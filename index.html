      <div id="cnStage" class="absolute inset-x-0 top-[12vh] bottom-[38vh] flex items-end justify-center gap-4 px-4 z-10"></div>
      <div class="absolute inset-x-0 bottom-[3vh] z-30 px-3 md:px-0">
        <div class="max-w-2xl mx-auto">
          <div class="flex items-end gap-2"><div id="cnName" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-t-xl font-display font-bold"></div><div id="cnMood" class="mb-1"></div></div>
          <div id="cnBox" class="glass-strong rounded-2xl rounded-tl-none p-4 md:p-5 min-h-[120px] cursor-pointer">
            <p id="cnText" class="text-[15px] md:text-base leading-relaxed text-white/90"></p>
            <p id="cnNext" class="text-right text-[10px] text-white/40 mt-2 hidden">▼ devam için dokun</p>
            <div id="cnChoices" class="grid gap-2 mt-3"></div>
          </div>
        </div>
      </div>`;
    document.body.appendChild(this.el);
    document.body.style.overflow='hidden';
    document.getElementById('cnSkip').onclick=()=>this.close();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ const t=document.getElementById('cnBarT'), b=document.getElementById('cnBarB'); if(t){ t.style.height='7vh'; b.style.height='3vh'; } }));
    const card=scene.card!==undefined?scene.card:this.LOC_CARD[scene.cardLoc||scene.loc];
    if(card||scene.pre) this.card(scene.pre||card,scene.pre?card:'',()=>this.go(scene.start||'a'));
    else this.go(scene.start||'a');
  },
  card(big,small,cb){
    if(!this.el) return cb&&cb();
    const c=document.createElement('div');
    c.className='cn-card absolute inset-0 z-[50] bg-black grid place-items-center text-center px-6'; this.cardOn=true;
    c.style.opacity='0';
    c.innerHTML=`<div><p class="big font-display text-3xl md:text-5xl font-bold text-white">${U.esc(big)}</p>${small?`<p class="text-sm text-white/50 mt-3 tracking-[.2em] uppercase">${U.esc(small)}</p>`:''}<p class="text-[10px] text-white/25 mt-8">dokun</p></div>`;
    this.el.appendChild(c);
    requestAnimationFrame(()=>c.style.opacity='1');
    let done=false; const fin=()=>{ if(done) return; done=true; this.cardOn=false; c.style.opacity='0'; setTimeout(()=>{ c.remove(); cb&&cb(); },420); };
    c.onclick=fin; setTimeout(fin,small?1900:1500);
  },
  close(silent){
    clearInterval(this.timer); this.timer=null;
    const el=this.el; this.el=null;
    const cb=silent?null:this.onEnd; if(!silent) this.onEnd=null;
    if(!el){ if(cb) cb(); return; }
    if(silent){ el.remove(); return; }
    const t=el.querySelector('#cnBarT'), b=el.querySelector('#cnBarB');
    if(t){ t.style.height='0'; b.style.height='0'; }
    el.style.opacity='0';
    setTimeout(()=>{ el.remove(); if(!this.el) document.body.style.overflow=''; if(cb) cb(); },320);
  },
  setSpeaker(id,ov,mood='ciddi'){
    const c=this.who(id,ov), st=document.getElementById('cnStage'), nm=document.getElementById('cnName'), md=document.getElementById('cnMood');
    if(!st) return c;
    const me=id==='sen', M=this.MOODS[mood]||this.MOODS.ciddi;
    const other=me?this.who(this.scene.lastWho||'genel',this.scene.lastOv):c;
    const om=me?(this.scene.lastMood||'ciddi'):mood;
    st.innerHTML=`
      <div class="relative w-[46%] max-w-[260px] h-full flex items-end transition-all duration-300 ${me?'opacity-40 scale-90':'cn-in'}">
        <div class="absolute inset-x-0 bottom-0 h-1/2 blur-3xl opacity-40" style="background:${(this.MOODS[om]||M).renk}"></div>
        <div class="relative w-full aspect-[5/6] ${!me&&mood==='ofke'?'cn-shake':!me&&mood==='neseli'?'cn-bob':''}">${this.bust(other,om)}</div>
      </div>
      ${me?`<div class="relative w-[34%] max-w-[190px] h-[80%] flex items-end cn-in"><div class="absolute inset-x-0 bottom-0 h-1/2 blur-3xl opacity-40" style="background:#22f5c9"></div><div class="relative w-full aspect-[5/6]">${this.bust(c,'ciddi')}</div></div>`:''}`;
    if(!me){ this.scene.lastWho=id; this.scene.lastOv=ov; this.scene.lastMood=mood; }
    nm.style.cssText=`background:${c.renk};color:#05070d`;
    nm.innerHTML=`<i data-lucide="${c.ikon}" class="w-4 h-4"></i>${U.esc(c.ad)}${c.unvan&&!me?`<span class="font-sans text-[10px] font-semibold opacity-70 ml-1">${U.esc(c.unvan)}</span>`:''}`;
    md.innerHTML=me?'':`<span class="inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full" style="background:${M.renk}22;color:${M.renk};border:1px solid ${M.renk}55"><i data-lucide="${M.ikon}" class="w-3 h-3"></i>${M.ad}</span>`;
    UI.icons();
    return c;
  },
  say(id,lines,done,ov,mood){
    lines=(Array.isArray(lines)?lines:[lines]).filter(Boolean);
    if(!lines.length) return done();
    const tx=document.getElementById('cnText'), nx=document.getElementById('cnNext'), box=document.getElementById('cnBox'), ch=document.getElementById('cnChoices');
    if(!tx) return;
    let i=0;
    const line=()=>{
      const L=lines[i], txt=typeof L==='object'?L.t:L, m=(typeof L==='object'&&L.mood)||mood||'ciddi';
      this.setSpeaker(id,ov,m);
      const full=U.fill(txt,GameState.ctx()); let k=0; ch.innerHTML=''; nx.classList.add('hidden');
      tx.textContent=''; clearInterval(this.timer); this.busy=true;
      tx.classList.toggle('italic',id==='sen'); tx.style.color=id==='sen'?'#22f5c9':'';
      this.timer=setInterval(()=>{ k+=1; tx.textContent=full.slice(0,k); if(k>=full.length){ clearInterval(this.timer); this.busy=false; nx.classList.remove('hidden'); } },22);
      box.onclick=()=>{
        if(CinemaEngine.cardOn) return;
        if(this.busy){ clearInterval(this.timer); tx.textContent=full; this.busy=false; nx.classList.remove('hidden'); return; }
        i++; if(i<lines.length) line(); else { box.onclick=null; nx.classList.add('hidden'); done(); }
      };
    };
    line();
  },
  go(id){
    const n=this.scene&&this.scene.nodes[id];
    if(!n) return this.close();
    this.say(n.who,n.text,()=>{ if(n.choices&&n.choices.length) this.choose(n); else if(n.next) this.go(n.next); else this.close(); },n.ov,n.mood);
  },
  pick(n,c){
    const s=GameState.s;
    document.getElementById('cnChoices').innerHTML='';
    if(c.onPick) return c.onPick(c);
    if(c.fx) GameState.apply(c.fx);
    if(c.tag) Persona.add(c.tag);
    (c.sosyal||[]).forEach(([k,t,o])=>Social.post(k,t,o||{}));
    if(c.mem) Social.remember(c.mem);
    if(c.run) c.run(s);
    GameState.persist();
    const rm=c.rmood||this.moodFor(n.who,c.fx);
    this.say('sen',[c.t],()=>this.say(n.who,c.react,()=>{ if(c.next) this.go(c.next); else this.close(); },n.ov,rm));
  },
  story(chained){
    const s=GameState.s, id=s.story.pending, ev=id&&StoryEngine.get(id); if(!ev) return this.close();
    this.lastAuto=id+'@'+U.stamp();
    const w=this.whoFor(ev), ov=w?null:{ad:U.fill(ev.kim,GameState.ctx()),unvan:'',renk:ev.renk,ikon:ev.ikon};
    const who=w||'genel', club=s.club, mood=this.STORY_MOOD[id]||'ciddi';
    const base=ev.secimler.map((c,i)=>({t:c.t,tag:Persona.tagOf(c),fx:c.fx,react:c.not,lock:c.sart?(st=>c.sart(st)?null:c.sartText):null,idx:i}));
    const adapt=(this.ADAPT[id]||[]).filter(a=>a.cond(s)).map(a=>({...a,idx:a.base,adaptive:true,react:ev.secimler[a.base].not,fx:{...(ev.secimler[a.base].fx||{}),...a.bonus}}));
    const onPick=c=>{
      if(c.adaptive){ GameState.apply(c.bonus||{}); Persona.add(c.tag,1); if(c.run) c.run(s); }
      const r=StoryEngine.resolve(c.idx); if(!r) return this.close();
      GameState.persist();
      this.say('sen',[c.t],()=>this.say(who,c.react,()=>{
        if(s.club!==club) return this.card('Yeni Bir Sayfa','Yeni şehir • yeni forma',()=>this.close());
        if(s.story.pending) return this.story(true);
        this.close();
      },ov,this.moodFor(who,c.fx)));
    };
    const loc=this.locFor(ev,who);
    const scene={loc,cardLoc:who==='baskan'?'baskan':loc,start:'a',mood,nodes:{a:{who,ov,mood,text:[{t:`— ${ev.baslik} —`,mood},...this.splitText(StoryEngine.text(ev)).map(t=>({t,mood}))],choices:[...base,...adapt].map(c=>({...c,onPick}))}}};
    const prevWeek=this.lastStoryWeek; this.lastStoryWeek=U.stamp();
    if(chained&&this.el){
      this.scene=scene; const L=this.LOCS[loc]||this.LOCS.tesis;
      this.card('Az Sonra...',this.LOC_CARD[scene.cardLoc]||'',()=>{ if(!this.el) return; this.el.style.background=L.bg; const d=document.getElementById('cnDeco'); if(d) d.innerHTML=this.decoHtml(loc); const l=document.getElementById('cnLoc'); if(l) l.textContent=L.ad; this.go('a'); });
    } else {
      if(prevWeek&&U.stamp()>prevWeek) scene.pre=(U.stamp()-prevWeek===1?'1 Hafta Sonra...':(U.stamp()-prevWeek)+' Hafta Sonra...');
      this.open(scene,()=>UI.after());
    }
  }
});

/* =========================================================
   Market – Biyolojik tolerans
========================================================= */
Market.gain=function(id){ const s=GameState.s, it=this.get(id); return id==='icecek'&&s.tol?15:it.energy; };
Market.trackTolerance=function(){
  const s=GameState.s, st=U.stamp();
  if(!s.drinkWeeks.includes(st)) s.drinkWeeks.push(st);
  s.drinkWeeks=s.drinkWeeks.slice(-6);
  if(!s.tol&&s.drinkWeeks.includes(st-1)){
    s.tol=true;
    GameState.log('Vücudun enerji içeceğine tolerans geliştirdi: artık sadece +15 enerji.','train');
    return 'Tolerans gelişti! Enerji içecekleri artık +15 veriyor.';
  }
  return null;
};
Market.detox=function(){
  const s=GameState.s;
  if(Life.doneThisWeek('spa')) return {ok:false,msg:'Bu hafta zaten detoks yaptın.'};
  if(s.ap<=0) return {ok:false,msg:'Aksiyon hakkı yok.'};
  if(s.money<1000) return {ok:false,msg:'Yetersiz bakiye (€1.000).'};
  s.ap--; s.money-=1000; s.life.done.spa=U.stamp(); s.tol=false; s.drinkWeeks=[];
  GameState.apply({morale:3});
  GameState.log('Spa & Detoks: tolerans sıfırlandı.','rest');
  return {ok:true};
};

    GameState.log(`Ticari yatırım: ${b.ad}`,'transfer');
    return {ok:true,b};
  },
  weekly(){
    const s=GameState.s, fx={}; let money=0;
    s.biz.forEach(id=>{ money+=this.income(id); if(id==='marka') fx.media=(fx.media||0)+1; });
    const p=s.partner;
    if(p){
      const P=this.PARTNERS[p.type];
      p.bond=U.clamp(p.bond-3,0,100);
      if(p.type==='influencer'){
        money-=P.fee; fx.media=(fx.media||0)+2; s.social.followers+=U.ri(300,900);
        if(Math.random()<.25){ if(Math.random()<.5){ fx.media+=3; fx.fanLove=(fx.fanLove||0)-3; Social.post('journalist','{ad} ve Selin Ay\'ın tatil fotoğrafları gündem oldu. Taraftar: "Önce maç!" #Magazin',{mag:2}); }
          else { fx.morale=(fx.morale||0)-3; Social.post('journalist','Kulis: {ad} ile Selin Ay arasında kriz mi var? Takipten çıkma iddiası! #Magazin',{mag:2}); } }
      } else { s.life.calm=U.clamp(s.life.calm+3,0,100); }
      if(p.bond<15){ Social.post(p.type==='influencer'?'journalist':'fan',p.type==='influencer'?`${P.ad}, {ad}'ı takipten çıkardı. İlişki bitti mi? #Magazin`:'{ad} ve Elif\'in yolları ayrıldı... İlgisizlik her şeyi bitirir.',{mag:2}); GameState.log(`${P.ad} ilişkiyi bitirdi (ilgisizlik).`,'story'); s.partner=null; GameState.apply({morale:-6}); }
    }
    s.money+=money;
    if(Object.keys(fx).length) GameState.apply(fx);
  }
};

(function(){ const orig=Career.afterMatch.bind(Career);

    if(s.week!==w) Legacy.weekly();

  }; })();
(function(){ const orig=Career.skipWeek.bind(Career);

    return r;
  }; })();
</script>

const Stars = {
  POOL:{
    gol1:{ad:'En az 1 gol at',ok:c=>c.gol>=1}, gol2:{ad:'2+ gol at',ok:c=>c.gol>=2},
    asist:{ad:'Asist yap',ok:c=>c.asist>=1}, skor:{ad:'Gol ya da asist üret',ok:c=>c.gol+c.asist>=1},

const Packs = {
  NAME:{bronz:'Bronz Paket',gumus:'Gümüş Paket',altin:'Altın Paket'},
  roll(tier){
    const s=GameState.s, T={bronz:1,gumus:2,altin:3}[tier], out=[];
    const pool=[
      ()=>{ const v=U.ri(1,3)*1000*T; s.money+=v; return {ikon:'wallet',t:'Nakit',v:U.eur(v)}; },
      ()=>{ const k=U.pick(Object.keys(CONFIG.ATTRS)), v=[.5,1,2][T-1]; GameState.apply({attrs:{[k]:v}}); return {ikon:CONFIG.ATTRS[k].ikon,t:CONFIG.ATTRS[k].ad,v:'+'+v}; },
      ()=>{ const id=U.pick(['icecek','bar','kahve']); s.inv[id]+=T; return {ikon:Market.get(id).ikon,t:Market.get(id).ad,v:'×'+T}; },

    ];
    const used=new Set(); while(out.length<3){ const i=U.ri(0,pool.length-1); if(used.has(i)) continue; used.add(i); out.push(pool[i]()); }
    return out;
  }
};

Career.startMatch=function(){
  const s=GameState.s, f=Fixtures.next(s), n=this.positions(), role=GameState.role();
  const pool={FV:['sut','pas','sut','sut'],OS:['pas','sut','pas','sut'],DF:['pas','sut','pas','pas'],KL:['pas','pas','pas','pas']}[s.player.mevki];
  const plan=Array.from({length:n},(_,i)=>pool[i%pool.length]);
  if(s.player.mevki!=='KL'&&n>=3&&Math.random()<.7) plan[U.ri(1,n-1)]='frikik';
  const lo=role==='YEDEK'?62:role==='ROTASYON'?30:3;
  const mins=plan.map(()=>U.ri(lo,90)).sort((a,b)=>a-b);
  const keyIdx=n>=3&&mins[n-1]>=75?n-1:-1;
  const stars=Stars.pick(plan,s.player.mevki);
  const rewinds=1+(Persona.lvl('pro')>=6?1:0);
  MatchEngine.start({mode:'match',f,plan,mins,keyIdx,stars,rewinds,maxAct:this.maxAct(),title:Fixtures.compName(f)+(f.tur?' • '+f.tur:''),left:s.club,right:f.rakip,onDone:c=>this.finishMatch(f,c)});
};

/* --- finishMatch sarmalayıcı: yıldızlar, paketler, disiplin (kartlar) --- */
(function(){ const orig=Career.finishMatch.bind(Career);
  Career.finishMatch=function(f,c){
    const live=MatchEngine.ctx===c&&MatchEngine.cfg;
    const sum=orig(f,c), s=GameState.s; GameState.ensure(s);
    const puan=+(((sum.stats||[]).find(x=>x[0]==='Puan')||[])[1]||0);
    // disiplin
    const asi=Persona.lvl('asi'), bad=c.res.filter(x=>x.code==='KAPTIRDI').length;
    const yC=U.clamp(.07+bad*.04+asi*.01,0,.35), rC=U.clamp(.012+asi*.004,0,.08), dk=U.ri(20,89);
    if(Math.random()<rC){
      s.discipline.kirmizi++; s.status.kadroDisi=Math.max(1,s.status.kadroDisi); GameState.apply({coachTrust:-4,fanLove:-2,media:-2});
      sum.chips.push('🟥 KIRMIZI KART • 1 maç ceza');
      Social.post('journalist',`${dk}. dakikada KIRMIZI KART! {ad} sert müdahale sonrası oyundan atıldı. Gelecek maçta yok. #Disiplin`,{mag:2.4});
      Social.post('fan','{ad} kafayı yemiş, takımı 10 kişi bıraktı. Bu sinirle olmaz!',{mood:-1});
    } else if(Math.random()<yC){
      s.discipline.sari++; sum.chips.push('🟨 Sarı kart');
      Social.post('fan',`${dk}'de o sarı kart gereksizdi {ad}. Sakin ol biraz.`,{mood:-1});
      if(s.discipline.sari%5===0){ s.status.kadroDisi=Math.max(1,s.status.kadroDisi); sum.chips.push('5. sarı kart • 1 maç ceza'); }
    }
    // yıldızlar & paket
    if(live&&MatchEngine.cfg.stars){
      const st=Stars.eval(MatchEngine.cfg.stars,c,{puan,win:sum.win}), n=st.filter(x=>x.ok).length;
      sum.stars=st;
      if(n){ s.money+=n*750; const tier=n===3?'altin':n===2?'gumus':'bronz'; s.packs.push({id:U.uid(),tier});
        sum.chips.push(`★${n} • ${Packs.NAME[tier]} kazandın (+${U.eur(n*750)})`); FX.queue.push({type:'pack'}); }
    }
    if(sum.chips.includes('KUPA ŞAMPİYONU!')) FX.queue.push({type:'trophy',t:Fixtures.compName(f)+' ŞAMPİYONU'});
    return sum;
  }; })();

/* =========================================================
   Transfer: imza parası, serbest kalma maddesi, walkout
========================================================= */
(function(){ const orig=Transfer.execute.bind(Transfer);
  Transfer.execute=function(o,veda){
    const s=GameState.s, r=orig(o,veda);
    if(o.bonus) s.money+=o.bonus;
    if(o.clause) s.contract.clause=o.clause;
    if(o.trustMod) s.coachTrust=U.clamp(s.coachTrust+o.trustMod,0,100);
    FX.queue.push({type:'walkout',club:o.club});
    return r;
  }; })();
(function(){ const orig=Transfer.accept.bind(Transfer);
  Transfer.accept=function(id){
    const s=GameState.s, o=this.get(id);
    if(o&&o.status==='bekliyor'&&s.contract.clause&&o.fee>=s.contract.clause){
      Social.post('journalist','{teklif}, {ad}\'ın serbest kalma maddesini ('+U.eur(s.contract.clause)+') yatırdı! Kulübün itiraz hakkı yok. #TransferHaberleri',{mag:3,ctx:{teklif:o.club}});
      this.execute(o,'iyi'); return {ok:true,done:true};
    }
    return orig(id);
  }; })();

/* =========================================================

  playerCard(){

  avatar(p,size=40){

    const sk=skins[h%5], hr=hairs[(h>>3)%6], st=(h>>6)%3, bg=p.renk||'#18b6ff';
    const hair=[`<path d="M11 17 Q20 5 29 17 Q27 11 20 10 Q13 11 11 17Z" fill="${hr}"/>`,`<path d="M10 19 Q11 7 20 7 Q29 7 30 19 L28 14 Q20 10 12 14Z" fill="${hr}"/>`,`<path d="M10 22 Q9 8 20 7 Q31 8 30 22 Q29 30 27 33 L27 16 Q20 11 13 16 L13 33 Q11 30 10 22Z" fill="${hr}"/>`][st];

      <path d="M17.5 22.5 Q20 24.5 22.5 22.5" stroke="#7c2d12" stroke-width="1" fill="none"/>${extra}</svg>`;
  },
  confetti(host,{count=160,colors=['#ffd700','#ffe48a','#22f5c9','#ff3d81','#ffffff','#7c5cff'],duration=3600}={}){
    const cv=document.createElement('canvas'); cv.className='absolute inset-0 pointer-events-none'; cv.style.zIndex='60';
    host.appendChild(cv); const W=cv.width=host.clientWidth||innerWidth, H=cv.height=host.clientHeight||innerHeight, g=cv.getContext('2d');
    const P=Array.from({length:count},()=>({x:W/2+U.rnd(-60,60),y:H*.45,vx:U.rnd(-9,9),vy:U.rnd(-16,-5),r:U.rnd(0,6.28),vr:U.rnd(-.3,.3),c:U.pick(colors),w:U.rnd(5,10),h:U.rnd(3,6)}));
    const t0=performance.now(); let raf;
    const loop=t=>{ g.clearRect(0,0,W,H); P.forEach(p=>{ p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w*Math.abs(Math.cos(p.r*2))+1,p.h); g.restore(); });
      if(t-t0<duration&&cv.isConnected) raf=requestAnimationFrame(loop); else cv.remove(); };
    raf=requestAnimationFrame(loop);
  },
  overlay(){
    const el=document.createElement('div');
    el.className='fixed inset-0 z-[95] overflow-hidden bg-black select-none';
    el.style.height='100dvh'; el.style.opacity='0'; el.style.transition='opacity .4s';

    return {el,close};

      I('Lüks Daire','home',s.invest.includes('ev'),'altin','Emlak','+8 enerji/hf • Moral'),
      I('Kriyoterapi Odası','snowflake',s.invest.includes('kriyo'),'gumus','Emlak','+12 enerji/hf'),
      I('Giyim Markan','shirt',s.biz.includes('marka'),'altin','İşletme','Haftalık pasif gelir'),
      I('Restoran Zinciri','utensils',s.biz.includes('restoran'),'altin','İşletme','Haftalık gelir • takım yemekleri'),
      ...(s.career.kupalar.length?s.career.kupalar.map(k=>I(k,'trophy',true,'altin','Kupalar','Kariyerinin parlayan anı')):[I('İlk Kupan','trophy',false,'altin','Kupalar','Bir lig ya da kupa kazan')]),
      I('50 Gol Kulübü','target',s.career.gol>=50,'ikon','Kilometre Taşı',`Kariyer golü: ${s.career.gol}/50`),
      I('100 Maç','medal',s.career.mac>=100,'altin','Kilometre Taşı',`Kariyer maçı: ${s.career.mac}/100`),
      I('Milli Oyuncu','flag',!!s.story.flags.milli,'altin','Kilometre Taşı','Milli takım çağrısı al'),
      I('Sokak Efsanesi','flame',s.street.wins>=15,'ikon','Kilometre Taşı',`Sokak galibiyeti: ${s.street.wins}/15`)
    ];

    el.style.background='radial-gradient(80% 60% at 50% 0%,#1d1440,#05070d 70%)';
    el.innerHTML=`<div class="h-full overflow-auto">
      <div class="max-w-4xl mx-auto px-4 py-6">
        <div class="flex items-center justify-between"><div><p class="text-[11px] tracking-[.4em] uppercase text-[#ffd34d]">VIP Vitrin</p><h2 class="font-display text-4xl font-bold grad-text">Şöhret Odası</h2></div>
          <button id="hofX" class="btn btn-ghost rounded-xl px-4 py-2 text-sm">Kapat ✕</button></div>
        <p class="text-sm text-white/50 mt-1">${items.filter(i=>i.own).length}/${items.length} parça açıldı • Kasa ${U.eur(s.money)} • Piyasa değeri ${U.eur(GameState.marketValue())}</p>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mt-5">
          ${items.map((it,i)=>`<div data-hof="${i}" class="hof-tile ${it.own?it.rar:'locked'} pop-in" style="animation-delay:${i*40}ms">
            <i data-lucide="${it.own?it.ikon:'lock'}" class="w-12 h-12 ${it.rar==='ikon'&&it.own?'text-white':'text-black/70'}" style="${it.own?'':'color:rgba(255,255,255,.4)'}"></i>
            <p class="font-display font-bold text-sm text-center px-2 leading-tight ${it.own&&it.rar!=='ikon'?'text-black/80':'text-white/85'}">${U.esc(it.ad)}</p>
            <p class="text-[9px] uppercase tracking-wider ${it.own&&it.rar!=='ikon'?'text-black/60':'text-white/45'}">${it.cat}</p></div>`).join('')}

    el.querySelectorAll('[data-hof]').forEach(t=>t.onclick=()=>{ const it=items[+t.dataset.hof];
      el.querySelectorAll('.hof-tile.pop').forEach(x=>x.classList.remove('pop')); void t.offsetWidth; t.classList.add('pop');
      el.querySelector('#hofInfo').innerHTML=`<b class="font-display text-lg ${it.own?'text-[#ffd34d]':'text-white/60'}">${U.esc(it.ad)}</b> <span class="text-white/40">• ${it.cat}</span><br>${it.own?'✓ Koleksiyonunda • ':'🔒 Kilitli • '}${U.esc(it.info)}`; });
  }
};

/* =========================================================
   Casino – Rulet & At Yarışı (Canvas)
========================================================= */
const Casino = {
  MAXW:3, bet:1000,
  left(){ const c=GameState.s.life.casino; return this.MAXW-(c.st===U.stamp()?c.n:0); },
  take(amount){
    const s=GameState.s, c=s.life.casino;
    if(this.left()<=0) return 'Bu hafta casino hakkın doldu (3/3).';
    if(s.money<amount) return 'Yetersiz bakiye.';
    if(c.st!==U.stamp()){ c.st=U.stamp(); c.n=0; }
    if(c.season!==s.season){ c.season=s.season; c.total=0; }
    c.n++; c.total++; s.money-=amount; return null;
  },
  settle(win,amount,mult,game){
    const s=GameState.s, pay=win?Math.round(amount*mult):0;
    s.money+=pay;
    GameState.apply({morale:win?3:-2}); Persona.add(win?'sov':'asi');
    if(win&&pay>=20000) Social.post('journalist',`{ad} kumarhanede ${U.eur(pay)} kazandı! ${game} masasında gece boyu şampanyalar patladı. #Magazin`,{mag:2.4});
    if(s.life.casino.total>=4&&Math.random()<.35){
      GameState.apply({coachTrust:-3,fanLove:-2,media:-2}); Social.remember('kumarhane skandalıyla anılan');
      Social.post('journalist','SKANDAL: {ad} bu sezon defalarca kumarhanede görüntülendi! Kulüp yönetimi rahatsız. #Skandal',{mag:2.8});
      Social.post('fan','Kumarhanede değil sahada görelim seni {ad}. Yazık.',{mood:-1});
    }
    GameState.log(`Casino (${game}): ${win?'+'+U.eur(pay):'-'+U.eur(amount)}`,'transfer');
    GameState.persist();
    return pay;
  },
  open(tab='rulet'){
    const s=GameState.s; GameState.ensure(s);
    const {el,close}=FX.overlay();
    el.style.background='radial-gradient(70% 60% at 50% 30%,#0f3a26,#03140c 60%,#020805)';
    this.el=el; this.close=close; this.tab=tab;
    this.render();
  },
  render(){
    const s=GameState.s, el=this.el, chips=[500,1000,5000,20000];
    el.innerHTML=`<div class="h-full overflow-auto"><div class="max-w-xl mx-auto px-4 py-5">
      <div class="flex items-center justify-between"><div><p class="text-[11px] tracking-[.4em] uppercase text-[#ffd34d]">Royal Casino</p><h2 class="font-display text-3xl font-bold text-white">Şans Masası</h2></div>
        <button id="csX" class="btn btn-ghost rounded-xl px-4 py-2 text-sm">Çık ✕</button></div>
      <p class="text-xs text-white/55 mt-1">Kasa: <b class="text-[#ffd34d]">${U.eur(s.money)}</b> • Bu hafta kalan: ${this.left()}/3 • Çok sık gelmek skandal yaratabilir.</p>
      <div class="flex gap-2 mt-4">${[['rulet','Rulet'],['at','At Yarışı']].map(([k,l])=>`<button data-cst="${k}" class="btn px-4 py-2 rounded-xl text-sm ${this.tab===k?'btn-primary':'btn-ghost'}">${l}</button>`).join('')}</div>
      <div class="flex gap-3 mt-4 justify-center">${chips.map((v,i)=>`<button data-chip="${v}" class="chip btn ${this.bet===v?'sel':''}" style="background:${['#ef4444','#2563eb','#16a34a','#0b0b0b'][i]};color:#fff;font-size:12px">${v>=1000?v/1000+'K':v}</button>`).join('')}</div>
      <div id="csGame" class="mt-5"></div>
      <p id="csMsg" class="text-center font-display text-2xl font-bold mt-4 min-h-[32px]"></p>
    </div></div>`;
    el.querySelector('#csX').onclick=()=>this.close();
    el.querySelectorAll('[data-cst]').forEach(b=>b.onclick=()=>{ if(this.spinning) return; this.tab=b.dataset.cst; this.render(); });
    el.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{ if(this.spinning) return; this.bet=+b.dataset.chip; this.render(); });
    this.tab==='rulet'?this.roulette():this.horses();
  },
  msg(t,c){ const m=this.el.querySelector('#csMsg'); if(m){ m.textContent=t; m.style.color=c; } },
  roulette(){
    const g=this.el.querySelector('#csGame');
    g.innerHTML=`<div class="relative mx-auto" style="width:300px;height:300px"><canvas id="rl" width="300" height="300" class="absolute inset-0"></canvas>
      <div class="absolute left-1/2 -translate-x-1/2 -top-1 w-0 h-0" style="border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #ffd34d;filter:drop-shadow(0 0 6px #ffd34d)"></div></div>
      <div class="grid grid-cols-3 gap-2 mt-4">
        <button data-rb="red" class="btn rounded-xl py-3 font-bold" style="background:#dc2626">KIRMIZI ×2</button>
        <button data-rb="black" class="btn rounded-xl py-3 font-bold" style="background:#111827;border:1px solid #374151">SİYAH ×2</button>
        <button data-rb="green" class="btn rounded-xl py-3 font-bold" style="background:#16a34a">0 YEŞİL ×36</button></div>`;
    const ORD=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    const RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
    const cv=g.querySelector('#rl'), c=cv.getContext('2d'), seg=Math.PI*2/37;
    const draw=rot=>{ c.clearRect(0,0,300,300); c.save(); c.translate(150,150);
      c.beginPath(); c.arc(0,0,146,0,Math.PI*2); c.fillStyle='#5b3a17'; c.fill();
      ORD.forEach((n,i)=>{ const a=rot+i*seg; c.beginPath(); c.moveTo(0,0); c.arc(0,0,136,a,a+seg); c.closePath(); c.fillStyle=n===0?'#16a34a':RED.has(n)?'#dc2626':'#111827'; c.fill(); c.strokeStyle='#d4af37'; c.lineWidth=1; c.stroke();
        c.save(); c.rotate(a+seg/2); c.translate(118,0); c.rotate(Math.PI/2); c.fillStyle='#fff'; c.font='bold 10px Rajdhani,sans-serif'; c.textAlign='center'; c.fillText(n,0,4); c.restore(); });
      c.beginPath(); c.arc(0,0,64,0,Math.PI*2); c.fillStyle='#1f2937'; c.fill(); c.strokeStyle='#d4af37'; c.lineWidth=4; c.stroke();
      c.beginPath(); c.arc(0,0,20,0,Math.PI*2); c.fillStyle='#ffd34d'; c.fill(); c.restore(); };
    let rot=this.rot||0; draw(rot);
    g.querySelectorAll('[data-rb]').forEach(b=>b.onclick=()=>{
      if(this.spinning) return; const err=this.take(this.bet); if(err) return this.msg(err,'#ff3d81');
      this.spinning=true; this.msg('Top dönüyor...','#ffffff');
      const idx=U.ri(0,36), num=ORD[idx], start=rot;
      let target=-Math.PI/2-(idx+.5)*seg; while(target<start+Math.PI*8) target+=Math.PI*2;
      const t0=performance.now(), dur=4300, type=b.dataset.rb, amount=this.bet;
      const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); rot=start+(target-start)*e; draw(rot);
        if(k<1&&cv.isConnected) return requestAnimationFrame(step);
        this.rot=rot; this.spinning=false;
        const col=num===0?'green':RED.has(num)?'red':'black', win=col===type;
        const pay=this.settle(win,amount,type==='green'?36:2,'Rulet');
        this.msg(win?`${num} ${col==='red'?'KIRMIZI':col==='black'?'SİYAH':'YEŞİL'} • +${U.eur(pay)}!`:`${num} ${col==='red'?'KIRMIZI':col==='black'?'SİYAH':'YEŞİL'} • Kaybettin`,win?'#ffd34d':'#ff3d81');
        if(win) FX.confetti(this.el,{count:140});
        const k2=this.el.querySelector('.text-xs'); if(k2) k2.innerHTML=`Kasa: <b class="text-[#ffd34d]">${U.eur(GameState.s.money)}</b> • Bu hafta kalan: ${this.left()}/3 • Çok sık gelmek skandal yaratabilir.`; };
      requestAnimationFrame(step);
    });
  },
  horses(){
    const H=[{ad:'Kara Şimşek',renk:'#e5e7eb',o:2.2},{ad:'Altın Rüzgar',renk:'#eab308',o:3.5},{ad:'Gece Yıldızı',renk:'#a78bfa',o:5},{ad:'Fırtına',renk:'#ef4444',o:8},{ad:'Mavi Bulut',renk:'#38bdf8',o:14}];
    const g=this.el.querySelector('#csGame');
    g.innerHTML=`<canvas id="hr" width="340" height="220" class="mx-auto block rounded-xl" style="max-width:100%;background:#14532d"></canvas>
      <div class="grid gap-2 mt-4">${H.map((h,i)=>`<button data-hb="${i}" class="btn btn-ghost rounded-xl px-4 py-2.5 flex items-center justify-between text-sm"><span class="flex items-center gap-2"><i class="w-3 h-3 rounded-full inline-block" style="background:${h.renk}"></i>${i+1}. ${h.ad}</span><b class="text-[#ffd34d]">×${h.o}</b></button>`).join('')}</div>`;
    const cv=g.querySelector('#hr'), c=cv.getContext('2d'), Wd=340, Hd=220, lane=(Hd-20)/5;
    const drawTrack=(prog,t)=>{ c.fillStyle='#166534'; c.fillRect(0,0,Wd,Hd);
      for(let i=0;i<=5;i++){ c.strokeStyle='rgba(255,255,255,.25)'; c.beginPath(); c.moveTo(0,10+i*lane); c.lineTo(Wd,10+i*lane); c.stroke(); }
      c.fillStyle='#fff'; for(let y=10;y<Hd-10;y+=8){ c.fillRect(Wd-26,y,4,4); }
      H.forEach((h,i)=>{ const x=14+prog[i]*(Wd-60), y=10+i*lane+lane/2, ph=t/60+i;
        c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(x,y+9,16,3,0,0,7); c.fill();
        c.strokeStyle='#3f2a14'; c.lineWidth=2; [[-9,1],[-5,-1],[6,1],[10,-1]].forEach(([dx,s])=>{ c.beginPath(); c.moveTo(x+dx,y+2); c.lineTo(x+dx+Math.sin(ph*6+s)*4,y+10); c.stroke(); });
        c.fillStyle='#7c4a1e'; c.beginPath(); c.ellipse(x,y,14,6,0,0,7); c.fill();
        c.beginPath(); c.ellipse(x+15,y-5,6,4,-.6,0,7); c.fill();
        c.fillStyle=h.renk; c.beginPath(); c.arc(x-1,y-8,4.5,0,7); c.fill();
        c.fillStyle='#fff'; c.font='bold 9px Rajdhani'; c.fillText(i+1,4,y+3); });
    };
    drawTrack(H.map(()=>0),0);
    g.querySelectorAll('[data-hb]').forEach(b=>b.onclick=()=>{
      if(this.spinning) return; const err=this.take(this.bet); if(err) return this.msg(err,'#ff3d81');
      this.spinning=true; const pick=+b.dataset.hb, amount=this.bet; this.msg('Ve start verildi!','#ffffff');
      const tot=H.reduce((a,h)=>a+1/h.o,0); let r=Math.random()*tot, w=0; for(let i=0;i<H.length;i++){ r-=1/H[i].o; if(r<=0){ w=i; break; } }
      const base=H.map(()=>U.rnd(.16,.2)); base[w]=Math.max(...base)+.012;
      const prog=H.map(()=>0); let last=performance.now(), done=false;
      const step=t=>{ const dt=Math.min(.05,(t-last)/1000); last=t;
        H.forEach((_,i)=>{ prog[i]+=Math.max(0,(base[i]+U.rnd(-.06,.06))*dt); if(i!==w&&prog[i]>prog[w]-.012&&prog[i]>.82) prog[i]=prog[w]-.012; });
        prog.forEach((p,i)=>prog[i]=Math.min(1,p)); drawTrack(prog,t);
        if(prog[w]>=1&&!done){ done=true; this.spinning=false;
          const win=w===pick, pay=this.settle(win,amount,H[pick].o,'At Yarışı');
          this.msg(win?`${H[w].ad} kazandı! +${U.eur(pay)}`:`Kazanan: ${H[w].ad} • Kaybettin`,win?'#ffd34d':'#ff3d81');
          if(win) FX.confetti(this.el,{count:160}); return; }
        if(cv.isConnected) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }
};
</script>

<script>
/* =========================================================
   MatchEngine – Phaser 3 Arcade Physics • Saf hareket (çizim) kontrollü motor
   Sol alt: sanal analog • Sağ alt: ŞUT / PAS (basılı tut = şarj)
   PC: WASD/Ok tuşları + J/Boşluk (şut) + K/L (pas)
   Dış bağlantılar korunur: start(cfg) → cfg.onDone(ctx) • record(code) • next(scene)
========================================================= */
const MatchEngine = {
  W:540, H:900, KEEPER_Y:104,
  game:null, cfg:null, ctx:null, el:null, scene:null,
  RES:{
    GOL:{t:'GOL!',ikon:'party-popper',renk:'#22f5c9',tip:'gol'},
    ASIST:{t:'ASİST!',ikon:'share-2',renk:'#22f5c9',tip:'asist'},
    KURTARDI:{t:'KALECİ KURTARDI',ikon:'hand',renk:'#ffc53d',tip:'iyi'},
    DIREK:{t:'DİREK!',ikon:'alert-triangle',renk:'#ffc53d',tip:'iyi'},
    TM_KACIRDI:{t:'ARKADAŞIN KAÇIRDI',ikon:'user-x',renk:'#ffc53d',tip:'iyi'},
    DISARI:{t:'DIŞARI',ikon:'x-circle',renk:'#ff3d81',tip:'kotu'},
    BLOK:{t:'DEFANSA TAKILDI',ikon:'shield',renk:'#ff3d81',tip:'kotu'},
    KESILDI:{t:'PAS KESİLDİ',ikon:'scissors',renk:'#ff3d81',tip:'kotu'},
    KAPTIRDI:{t:'TOP KAPTIRILDI',ikon:'user-minus',renk:'#ff3d81',tip:'kotu'},
    SURE:{t:'ATAK SÜRESİ DOLDU',ikon:'timer',renk:'#ff3d81',tip:'kotu'},
    KACTI:{t:'TOP DURDU',ikon:'ban',renk:'#ff3d81',tip:'kotu'},
    RAKIP_GOL:{t:'RAKİP GOL ATTI',ikon:'alert-circle',renk:'#ff3d81',tip:'rakip'},
    RAKIP_KACIRDI:{t:'RAKİP KAÇIRDI',ikon:'shield-check',renk:'#22f5c9',tip:'rakip'}
  },
  SKILL_UI:{roket:{ad:'Roket',ikon:'rocket',renk:'#ff7a3d'},falso:{ad:'Falso',ikon:'sparkles',renk:'#a993ff'},vision:{ad:'Vision',ikon:'eye',renk:'#18b6ff'}},
  goal(){ return this.cfg.mode==='street'?{x1:215,x2:325,y:80,depth:30}:{x1:190,x2:350,y:80,depth:44}; },

  start(cfg){
    this.cfg=cfg;
    const mods=SkillTree.mods(), charges={}; mods.actives.forEach(k=>charges[k]=1);
    const street=cfg.mode==='street';
    this.ctx={plan:street?[Math.random()<.3?'pas':'sut']:cfg.plan, mins:street?[]:cfg.mins, idx:0, res:[], gol:0, asist:0, iyi:0, kotu:0,
      d:U.clamp((cfg.f.guc-55)/30,0,1), mods, charges, armed:null, our:0, their:0,
      rewinds:cfg.rewinds!=null?cfg.rewinds:1, rewindUsed:0, keyIdx:cfg.keyIdx!=null?cfg.keyIdx:-1, stars:cfg.stars||null};
    this.teardown();                 // eski oyun/canvas tamamen temizlenir
    this.mount();
    this.game=new Phaser.Game({type:Phaser.AUTO,parent:'mePitch',backgroundColor:street?'#0b0d12':'#06120b',
      banner:false,                  // konsola tekrar eden "Phaser v3.60.0" logu yok
      audio:{noAudio:true},          // her maçta yeni AudioContext açılmaz (bellek sızıntısı)
      input:{activePointers:4},
      physics:{default:'arcade',arcade:{gravity:{x:0,y:0},debug:false}},
      scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:this.W,height:this.H},scene:[this.makeScene()]});
  },

  mount(){
    const cfg=this.cfg, street=cfg.mode==='street', clr=street?'#ff3d81':CONFIG.COMPS[cfg.f.comp].renk;
    this.el=document.createElement('div');
    this.el.className='fixed inset-0 z-[70] flex flex-col bg-[#05070d]';
    this.el.style.height='100dvh';
    // Temiz arayüz: yalnızca ince skor şeridi + saha. Buton / analog yok.
    this.el.innerHTML=`
      <div class="px-4 py-2 flex items-center gap-3 border-b border-white/5 bg-black/40">
        <span class="w-1.5 h-6 rounded-full shrink-0" style="background:${clr}"></span>
        <p class="font-display font-bold truncate flex-1 text-sm">${U.esc(cfg.left)} <span class="text-white/35">vs</span> ${U.esc(cfg.right)}</p>
        <p id="meMin" class="font-display text-lg font-bold neon-text shrink-0">0'</p>
        <p id="mePos" class="text-[10px] text-white/40 shrink-0"></p>
      </div>
      <div id="mePitch" class="relative flex-1 min-h-0 w-full select-none" style="touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none"></div>
      <div id="meSum" class="hidden absolute inset-0 z-10 bg-black/70 items-end md:items-center justify-center md:p-6"></div>`;
    document.body.appendChild(this.el);
    document.body.style.overflow='hidden';
  },

  hud(){
    const c=this.ctx, street=this.cfg.mode==='street';
    const mi=document.getElementById('meMin'), po=document.getElementById('mePos'); if(!mi) return;
    mi.textContent=street?`${c.our} - ${c.their}`:c.mins[c.idx]+"'";
    po.textContent=street?`A${c.idx+1}`:`${c.idx+1}/${c.plan.length}`;
  },

  // Aktif yetenekler artık hareketle otomatik tetiklenir (buton yok):
  // Roket = çok uzun/sert şut çizgisi • Falso = çok kavisli şut çizgisi • Vision = maçtaki ilk pas
  renderSkills(){},
  arm(){},

  record(code){
    const c=this.ctx, tip=this.RES[code].tip;
    c.res.push({code,min:this.cfg.mode==='street'?'A'+(c.idx+1):c.mins[c.idx],type:c.plan[c.idx]});
    if(tip==='gol') c.gol++; else if(tip==='asist') c.asist++; else if(tip==='iyi') c.iyi++; else c.kotu++;
  },

  next(scene){
    const c=this.ctx;
    if(this.cfg.mode==='street'){
      const last=c.res[c.res.length-1];
      if(last&&(last.code==='GOL'||last.code==='ASIST')) c.our++;
      if(c.our>=3) return this.finish();
      const scored=Math.random()<this.cfg.oppChance(); if(scored) c.their++;
      c.res.push({code:scored?'RAKIP_GOL':'RAKIP_KACIRDI',min:'A'+(c.idx+1),type:'def'});
      this.hud();
      scene.showOpp(scored,()=>{
        if(c.their>=3||c.idx>=14) return this.finish();

      });

    }

  },

  teardown(){
    // Phaser tam temizlik: WebGL bağlamı düşürülür, oyun yok edilir, #mePitch boşaltılır.
    // Not: destroy(true,true) Phaser'ın çekirdek eklentilerini kalıcı olarak siler ve aynı sayfada
    // YENİ bir oyun kurulmasını engeller (Phaser dokümantasyonu: "noReturn"). Her maçta yeni oyun
    // açtığımız için destroy(true,false) kullanılır; sızıntıyı geri kalan adımlar kapatır.
    const g=this.game; this.game=null; this.scene=null;
    if(g){
      let ext=null;
      try{ const gl=g.renderer&&g.renderer.gl; ext=gl&&gl.getExtension&&gl.getExtension('WEBGL_lose_context'); }catch(e){}
      try{ g.loop&&g.loop.stop&&g.loop.stop(); }catch(e){}
      try{ g.destroy(true,false); }catch(e){}
      try{ if(ext) ext.loseContext(); }catch(e){}
    }
    const pitch=document.getElementById('mePitch'); if(pitch) pitch.innerHTML='';
    if(this.el){ this.el.remove(); this.el=null; }
  },
  close(){
    this.teardown();
    document.body.style.overflow='';
    UI.render();
    const s=GameState.s; if(s.social.unread) UI.toast(`Sosyal medyada ${s.social.unread} yeni gönderi var.`);
