<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kariyer Yolu – Futbol RPG</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
<script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070d; --neon:#22f5c9; --neon2:#7c5cff; --hot:#ff3d81; --warn:#ffc53d; --sky:#18b6ff;
    --glass:rgba(255,255,255,.055); --stroke:rgba(255,255,255,.10);
  }
  *{-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:#e6edf7;font-family:Inter,system-ui,sans-serif;min-height:100%}
  body{
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(124,92,255,.25), transparent 60%),
      radial-gradient(700px 400px at 110% 10%, rgba(34,245,201,.16), transparent 60%),
      radial-gradient(600px 600px at 50% 120%, rgba(255,61,129,.12), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;z-index:0;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
  }
  .font-display{font-family:Rajdhani,sans-serif;letter-spacing:.02em}
  .glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-radius:20px}
  .glass-strong{background:rgba(12,16,28,.78);border:1px solid var(--stroke);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
  .neon-text{color:var(--neon);text-shadow:0 0 14px rgba(34,245,201,.55)}
  .grad-text{background:linear-gradient(90deg,#22f5c9,#18b6ff 40%,#a993ff 70%,#ff3d81);-webkit-background-clip:text;background-clip:text;color:transparent}
  .neon-border{box-shadow:0 0 0 1px rgba(34,245,201,.55),0 0 22px rgba(34,245,201,.18) inset}
  .btn{transition:transform .12s ease,box-shadow .2s,background .2s,opacity .2s;user-select:none;cursor:pointer}
  .btn:active{transform:scale(.96)}
  .btn:disabled{cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,var(--neon),#18b6ff);color:#04110e;font-weight:700;box-shadow:0 8px 28px rgba(34,245,201,.28)}
  .btn-primary:disabled{opacity:.35;box-shadow:none}
  .btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--stroke)}
  .btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.1)}
  .btn-danger{background:linear-gradient(135deg,#ff3d81,#ff6b3d);color:#fff;font-weight:700}
  .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .pos-card[aria-pressed="true"]{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 30px rgba(34,245,201,.25)}
  .ovr-ring{background:conic-gradient(var(--neon) calc(var(--p)*1%),rgba(255,255,255,.08) 0)}
  .fade-in{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pulse-dot{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .glow-hot{box-shadow:0 0 0 1px rgba(255,61,129,.5),0 0 40px rgba(255,61,129,.15)}
  .glow-violet{box-shadow:0 0 0 1px rgba(124,92,255,.5),0 0 40px rgba(124,92,255,.18)}
  .safe-bottom{padding-bottom:max(12px,env(safe-area-inset-bottom))}
  input:focus{outline:none}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:9px}
  /* sekmeler */
  .tab-pill{position:relative}
  .tab-pill[aria-selected="true"]{background:linear-gradient(135deg,rgba(34,245,201,.18),rgba(24,182,255,.12));border-color:rgba(34,245,201,.55);color:#fff}
  .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--hot);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 12px rgba(255,61,129,.6)}
  .mnav[aria-selected="true"]{color:var(--neon)}
  .mnav[aria-selected="true"] .mnav-dot{opacity:1}
  /* sosyal */
  .post{border-bottom:1px solid rgba(255,255,255,.07)}
  .post:hover{background:rgba(255,255,255,.025)}
  .hashtag{color:#18b6ff}
  .mention{color:#a993ff}
  .new-post{animation:newpost 1.2s ease}
  @keyframes newpost{from{background:rgba(34,245,201,.12)}to{background:transparent}}
  /* mektup */
  .letter{background:linear-gradient(165deg,rgba(255,226,160,.10),rgba(255,255,255,.03) 45%,rgba(124,92,255,.06));border:1px solid rgba(255,197,61,.35);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 60px rgba(255,197,61,.05)}
  .letter-serif{font-family:Georgia,'Times New Roman',serif}
  .seal{background:radial-gradient(circle at 35% 30%,#ff8a8a,#b91c1c 60%,#7f1d1d);box-shadow:0 4px 14px rgba(185,28,28,.5),inset 0 -3px 6px rgba(0,0,0,.35)}
  /* yetenek ağacı */
  .skill-node{transition:transform .15s, box-shadow .2s}
  .skill-node:hover{transform:translateY(-2px)}
  .skill-node.unlocked{border-color:rgba(34,245,201,.7);box-shadow:0 0 0 1px rgba(34,245,201,.4),0 0 26px rgba(34,245,201,.2)}
  .skill-node.available{border-color:rgba(255,197,61,.6);animation:availGlow 2s infinite}
  @keyframes availGlow{0%,100%{box-shadow:0 0 0 rgba(255,197,61,0)}50%{box-shadow:0 0 22px rgba(255,197,61,.28)}}
  .skill-node.locked{opacity:.45;filter:grayscale(.6)}
  .skill-link{width:2px;height:22px;margin:0 auto;background:rgba(255,255,255,.12)}
  .skill-link.on{background:linear-gradient(var(--neon),#18b6ff);box-shadow:0 0 10px rgba(34,245,201,.6)}
  .street-hero{background:linear-gradient(135deg,rgba(255,61,129,.22),rgba(124,92,255,.14) 50%,rgba(5,7,13,.2)),repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px)}
  table.lig td,table.lig th{padding:.55rem .5rem}
  .crest{display:grid;place-items:center;font-family:Rajdhani,sans-serif;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.25)}
</style>
</head>
<body class="antialiased">

<div id="app" class="relative z-[1] max-w-6xl mx-auto px-4 pt-5 pb-28 md:pb-10"></div>

<div id="modal" class="fixed inset-0 z-50 hidden items-end md:items-center justify-center bg-black/65 p-0 md:p-6">
  <div id="modalBox" class="glass-strong w-full md:max-w-lg rounded-t-3xl md:rounded-3xl p-6 fade-in safe-bottom max-h-[92vh] overflow-auto"></div>
</div>
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[90] space-y-2 w-[min(92vw,380px)] pointer-events-none"></div>

<script>
/* =========================================================
   CONFIG – sabit veriler
========================================================= */
const CONFIG = {
  ATTRS: {
    hiz:{ad:'Hız',ikon:'zap'}, sut:{ad:'Şut',ikon:'target'}, pas:{ad:'Pas',ikon:'share-2'},
    dribling:{ad:'Dripling',ikon:'wind'}, fizik:{ad:'Fizik',ikon:'dumbbell'}, defans:{ad:'Defans',ikon:'shield'}
  },
  POSITIONS: {
    KL:{ad:'Kaleci',kisa:'KL',ikon:'hand',renk:'#ffc53d',
        base:{hiz:40,sut:30,pas:45,dribling:35,fizik:55,defans:58}, w:{hiz:.1,sut:0,pas:.15,dribling:.05,fizik:.3,defans:.4}},
    DF:{ad:'Defans',kisa:'DF',ikon:'shield',renk:'#18b6ff',
        base:{hiz:48,sut:35,pas:45,dribling:38,fizik:55,defans:55}, w:{hiz:.15,sut:.03,pas:.15,dribling:.07,fizik:.25,defans:.35}},
    OS:{ad:'Orta Saha',kisa:'OS',ikon:'git-branch',renk:'#7c5cff',
        base:{hiz:50,sut:45,pas:55,dribling:52,fizik:45,defans:42}, w:{hiz:.12,sut:.15,pas:.32,dribling:.23,fizik:.1,defans:.08}},
    FV:{ad:'Forvet',kisa:'FV',ikon:'flame',renk:'#ff3d81',
        base:{hiz:55,sut:55,pas:42,dribling:52,fizik:46,defans:28}, w:{hiz:.25,sut:.38,pas:.08,dribling:.2,fizik:.09,defans:0}}
  },
  START_POINTS: 20, ATTR_CAP_START: 70,
  LEAGUES: {
    TR:{ad:'Süper Lig', clubs:[
      {ad:'Boğaziçi SK',kisa:'BGZ',guc:76,renk:'#eab308'},
      {ad:'Anadolu Kartalları',kisa:'ANK',guc:73,renk:'#e11d48'},
      {ad:'Ege Yıldızları',kisa:'EGE',guc:70,renk:'#0ea5e9'},
      {ad:'Karadeniz Fırtınası',kisa:'KRD',guc:68,renk:'#7c3aed'},
      {ad:'Başkent Gençlik',kisa:'BŞK',guc:64,renk:'#f97316'},
      {ad:'Kapadokya Spor',kisa:'KPD',guc:63,renk:'#d946ef'},
      {ad:'Çukurova FK',kisa:'ÇKR',guc:62,renk:'#16a34a'},
      {ad:'Trakya United',kisa:'TRK',guc:60,renk:'#2563eb'}]},
    EU:{ad:'Avrupa Elit Ligi', clubs:[
      {ad:'Real Ibérica',kisa:'RIB',guc:86,renk:'#f8fafc'},
      {ad:'Bavaria München',kisa:'BAV',guc:85,renk:'#dc2626'},
      {ad:'Lion Paris',kisa:'LIO',guc:83,renk:'#1e3a8a'},
      {ad:'London Royals',kisa:'LDN',guc:82,renk:'#4338ca'},
      {ad:'Milano Rossa',kisa:'MIL',guc:81,renk:'#b91c1c'},
      {ad:'Amsterdam Rood',kisa:'AMS',guc:77,renk:'#ef4444'},
      {ad:'Lizbon Atlético',kisa:'LIZ',guc:76,renk:'#059669'},
      {ad:'Porto Azul',kisa:'POR',guc:75,renk:'#0284c7'}]}
  },
  START_CLUBS: ['Başkent Gençlik','Kapadokya Spor','Çukurova FK','Trakya United'],
  COACHES: ['Rıza Ateş','Fikret Kaya','Cem Uslu','Orhan Demirtaş','Hakan Yazıcı','Marco Bellini','Jürgen Kohl','Luis Ortega'],
  COMPS: {
    LIG:{ad:'Lig',renk:'#22f5c9',ikon:'trophy'},
    KUPA:{ad:'Ziraat Kupası',renk:'#ffc53d',ikon:'award'},
    UCL:{ad:'Şampiyonlar Ligi',renk:'#a993ff',ikon:'star'},
    SOKAK:{ad:'3v3 Sokak',renk:'#ff3d81',ikon:'flame'}
  },
  ENERGY: { TRAIN:22, MATCH:22, REST:50, STREET:18 },
  AP: 3,
  STREET_TEAMS: ['Kadıköy Ekibi','Bağcılar Kafesi','Alsancak 3lü','Tophane Çocukları','Bornova Gece','Ataşehir Neon','Karşıyaka Asfalt','Beşiktaş Kafes'],
  STREET_RANKS: [[0,'Mahalle Çocuğu'],[3,'Asfalt Savaşçısı'],[6,'Kafes Ustası'],[10,'Sokak Kralı'],[15,'Sokak Efsanesi']]
};

/* =========================================================
   U – yardımcılar
========================================================= */
const U = {
  rnd:(a,b)=>a+Math.random()*(b-a),
  ri:(a,b)=>Math.floor(a+Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
  gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);},
  uid:()=>Math.random().toString(36).slice(2,10),
  esc:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  eur(v){ const n=v<0; v=Math.abs(v); const t=v>=1e6?'€'+(v/1e6).toFixed(2)+'M':v>=1000?'€'+Math.round(v/1000)+'K':'€'+Math.round(v); return (n?'-':'')+t; },
  num(n){ return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'B':String(Math.round(n)); },
  club(name){
    for(const k in CONFIG.LEAGUES){ const c=CONFIG.LEAGUES[k].clubs.find(x=>x.ad===name); if(c) return {...c,lig:k}; }
    return {ad:name,kisa:String(name).slice(0,3).toUpperCase(),guc:60,renk:'#64748b',lig:'TR'};
  },
  slug(n){ const m={ç:'c',ğ:'g',ı:'i',ö:'o',ş:'s',ü:'u',Ç:'C',Ğ:'G',İ:'I',Ö:'O',Ş:'S',Ü:'U'}; return String(n).replace(/[çğıöşüÇĞİÖŞÜ]/g,c=>m[c]).replace(/[^A-Za-z0-9]/g,''); },
  stamp(){ const s=GameState.s; return s.season*100+s.week; },
  fill(t,ctx){ return String(t).replace(/\{(\w+)\}/g,(m,k)=>ctx[k]!==undefined?ctx[k]:m); },
  weighted(arr,wf){ const t=arr.reduce((a,x)=>a+wf(x),0); let r=Math.random()*t; for(const x of arr){ r-=wf(x); if(r<=0) return x; } return arr[arr.length-1]; }
};

/* =========================================================
   DB – Dexie kayıt sistemi (IndexedDB yoksa bellek)
========================================================= */
const DB = {
  db:null, mem:null,
  init(){ try{ this.db=new Dexie('FutbolRPG'); this.db.version(1).stores({saves:'id'}); }catch(e){ this.db=null; } },
  async save(state){
    const rec={id:'slot1',data:JSON.parse(JSON.stringify(state)),t:Date.now()};
    try{ if(this.db){ await this.db.saves.put(rec); return; } }catch(e){}
    this.mem=rec;
  },
  async load(){
    try{ if(this.db){ const r=await this.db.saves.get('slot1'); return r?r.data:null; } }catch(e){}
    return this.mem?this.mem.data:null;
  },
  async reset(){ try{ if(this.db) await this.db.saves.delete('slot1'); }catch(e){} this.mem=null; }
};

/* =========================================================
   GameState – oyuncu verisi, göstergeler, türetilmiş değerler
========================================================= */
const GameState = {
  s:null,
  METERS:['morale','coachTrust','teamRel','fanLove','media'],
  LABELS:{morale:'Moral',coachTrust:'Hoca Güveni',teamRel:'Takım İçi',fanLove:'Taraftar',media:'Medya İmajı',energy:'Enerji',form:'Form',money:'Para',streetPoints:'Sokak Puanı'},

  create({ad,mevki,yas,attrs},keep){
    const club=keep&&keep.club&&CONFIG.LEAGUES.TR.clubs.some(c=>c.ad===keep.club)?keep.club:U.pick(CONFIG.START_CLUBS);
    const s=this.s={
      v:2, player:{ad,mevki,yas,attrs:{...attrs},xp:0},
      club, league:'TR', coach:U.pick(CONFIG.COACHES),
      week:1, season:1, ap:CONFIG.AP,
      energy:100, morale:65, coachTrust:42, teamRel:50, fanLove:45, media:50, form:6,
      money:5000,
      stats:{mac:0,gol:0,asist:0,ortPuan:0},
      career:{mac:0,gol:0,asist:0,kupalar:[],kulupler:[club]},
      history:[], fixtures:[], table:[], rounds:[], cupOut:false, seasonEnd:false, log:[],
      story:{pending:null,queue:[],used:{},flags:{}},
      status:{kadroDisi:0},
      social:{feed:[],unread:0,lastPost:0,followers:1200},
      street:{points:1,wins:0,losses:0,last:0},
      skills:[], contract:{wage:1500,years:2}, offers:[]
    };
    League.init(s,0);
    s.fixtures=Fixtures.build(s);
    Social.post('club','Altyapımızdan yetişen {mevki} {ad}, A takım kadromuza dahil edildi. Yolun açık olsun! #YeniYıldız',{mag:1.4});
    Social.post('journalist','{kulup} genç {mevki} {ad} için büyük umutlar besliyor. Teknik direktör {hoca} ilk haftalarda şans verecek mi?');
    Social.post('fan','Altyapıdan bir {ad} çıkıyor, isim yazın buraya. Bu çocuk patlayacak.');
    this.log(`${club} altyapısından A takıma yükseldin!`,'story');
    StoryEngine.force('ilk_gun'); StoryEngine.weekly(true);
    return s;
  },

  migrate(old){
    if(old && old.v>=2) return old;
    const p=old.player;
    this.create({ad:p.ad,mevki:p.mevki,yas:p.yas,attrs:p.attrs},{club:old.club});
    const s=this.s;
    ['energy','morale','coachTrust','form'].forEach(k=>{ if(typeof old[k]==='number') s[k]=old[k]; });
    if(old.stats) s.career={...s.career,mac:old.stats.mac||0,gol:old.stats.gol||0,asist:old.stats.asist||0};
    s.player.xp=p.xp||0;
    this.log('Kayıt yeni sürüme taşındı. Yeni sezon seni bekliyor!','story');
    return s;
  },

  ctx(extra={}){
    const s=this.s, nf=Fixtures.next(s);
    return {ad:s.player.ad, kulup:s.club, hoca:s.coach, mevki:CONFIG.POSITIONS[s.player.mevki].ad, kaptan:'Emre Kılıç',
      menajer:'Kerem Aydın', teklif:s.story.flags.offerClub||'bir Avrupa kulübü', rakip:nf?nf.rakip:'rakip', handle:'@'+U.slug(s.player.ad), ...extra};
  },
  ovr(p=this.s.player){ const w=CONFIG.POSITIONS[p.mevki].w; let t=0; for(const k in w) t+=p.attrs[k]*w[k]; return Math.round(t); },
  marketValue(){
    const s=this.s, o=this.ovr(), y=s.player.yas;
    const ageF=y<=19?1.5:y<=22?1.3:y<=26?1.1:y<=29?.9:.6;
    const base=Math.pow(1.13,o-40)*25000;
    const mood=.68+s.morale/250+s.coachTrust/250+s.media/320+s.fanLove/400+(s.form-6)/10;
    const lig=s.league==='EU'?1.35:1;
    return Math.max(10000,Math.round(base*ageF*mood*lig/1000)*1000);
  },
  role(){
    const s=this.s;
    if(s.status.kadroDisi>0) return 'KADRO DIŞI';
    return s.coachTrust>=55?'İLK 11':s.coachTrust>=30?'ROTASYON':'YEDEK';
  },
  clamp(){
    const s=this.s;
    s.energy=U.clamp(Math.round(s.energy),0,100);
    this.METERS.forEach(k=>s[k]=U.clamp(Math.round(s[k]),0,100));
    s.form=U.clamp(+s.form.toFixed(1),3,10);
    s.money=Math.round(s.money);
    for(const k in s.player.attrs) s.player.attrs[k]=Math.min(99,+s.player.attrs[k].toFixed(2));
  },
  apply(fx={}){
    const s=this.s, mods=SkillTree.mods();
    for(const k of this.METERS){ if(fx[k]){ let v=fx[k]; if(k==='media'&&v>0) v*=mods.mediaMul; s[k]+=v; } }
    if(fx.energy) s.energy+=fx.energy;
    if(fx.form) s.form+=fx.form;
    if(fx.money) s.money+=fx.money;
    if(fx.streetPoints) s.street.points+=fx.streetPoints;
    if(fx.attrs) for(const k in fx.attrs) s.player.attrs[k]+=fx.attrs[k];
    const buzz=(fx.media||0)+(fx.fanLove||0);
    if(buzz>0) s.social.followers+=Math.round(buzz*U.rnd(60,140)*(1+s.social.followers/40000));
    this.clamp();
  },
  log(txt,tip='info'){ const s=this.s; s.log.unshift({txt,tip,w:s.week,sz:s.season}); s.log=s.log.slice(0,30); },
  async persist(){ await DB.save(this.s); }
};

/* =========================================================
   League – puan tablosu ve fikstür eşleşmeleri
========================================================= */
const League = {
  init(s,roundsPlayed=0){
    const L=CONFIG.LEAGUES[s.league];
    s.table=L.clubs.map(c=>({ad:c.ad,o:0,g:0,b:0,m:0,ag:0,yg:0,p:0}));
    s.rounds=this.roundRobin(L.clubs.map(c=>c.ad).sort(()=>Math.random()-.5));
    for(let r=0;r<roundsPlayed;r++) this.simRound(s,r,null);
  },
  roundRobin(teams){
    const t=[...teams], n=t.length, rounds=[];
    for(let r=0;r<n-1;r++){
      const pairs=[]; for(let i=0;i<n/2;i++){ const a=t[i], b=t[n-1-i]; pairs.push(r%2?[b,a]:[a,b]); }
      rounds.push(pairs); t.splice(1,0,t.pop());
    }
    return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])));
  },
  poisson(l){ let L=Math.exp(-l),k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; },
  simScore(ga,gb,homeAdv=3){ const d=(ga+homeAdv-gb)/10, lam=x=>Math.max(.25,1.35+x*.55); return [this.poisson(lam(d)),this.poisson(lam(-d))]; },
  record(s,home,away,hg,ag){
    const T=n=>s.table.find(t=>t.ad===n), h=T(home), a=T(away); if(!h||!a) return;
    h.o++; a.o++; h.ag+=hg; h.yg+=ag; a.ag+=ag; a.yg+=hg;
    if(hg>ag){h.g++;a.m++;h.p+=3;} else if(hg<ag){a.g++;h.m++;a.p+=3;} else {h.b++;a.b++;h.p++;a.p++;}
  },
  simRound(s,r,skipClub){
    (s.rounds[r]||[]).forEach(([h,a])=>{
      if(skipClub&&(h===skipClub||a===skipClub)) return;
      const [x,y]=this.simScore(U.club(h).guc,U.club(a).guc); this.record(s,h,a,x,y);
    });
  },
  sorted(s){ return [...s.table].sort((a,b)=>b.p-a.p||(b.ag-b.yg)-(a.ag-a.yg)||b.ag-a.ag); },
  pos(s){ return this.sorted(s).findIndex(t=>t.ad===s.club)+1; }
};

/* =========================================================
   Fixtures – sezon takvimi (14 lig + 2 kupa + 2 ŞL)
========================================================= */
const Fixtures = {
  ORDER:['LIG','LIG','LIG','KUPA','LIG','LIG','LIG','UCL','LIG','LIG','LIG','KUPA','LIG','LIG','UCL','LIG','LIG','LIG'],
  build(s){
    let r=0,k=0,u=0;
    return (this.orderFor?this.orderFor(s):this.ORDER).map((comp,i)=>{
      const f={week:i+1,comp,sonuc:null};
      if(comp==='LIG'){
        const pair=s.rounds[r].find(p=>p.includes(s.club));
        f.round=r; f.evde=pair[0]===s.club; f.rakip=f.evde?pair[1]:pair[0]; r++;
      } else if(comp==='KUPA'){
        f.rakip=U.pick(CONFIG.LEAGUES[s.league].clubs.filter(c=>c.ad!==s.club)).ad; f.evde=Math.random()<.5; f.tur=k===0?'Yarı Final':'Final'; k++;
      } else {
        f.rakip=U.pick(CONFIG.LEAGUES.EU.clubs.filter(c=>c.ad!==s.club)).ad; f.evde=u===0; f.tur='Grup Maçı'; u++;
      }
      f.guc=U.club(f.rakip).guc; return f;
    });
  },
  next(s=GameState.s){ return s.fixtures.find(f=>!f.sonuc)||null; },
  compName(f,s=GameState.s){
    if(f.comp==='LIG') return CONFIG.LEAGUES[s.league].ad;
    if(f.comp==='KUPA') return s.league==='TR'?'Ziraat Kupası':'Ulusal Kupa';
    return CONFIG.COMPS[f.comp].ad;
  },
  dropCup(s){
    s.fixtures=s.fixtures.filter(f=>f.sonuc||f.comp!=='KUPA');
    s.fixtures.filter(f=>!f.sonuc).forEach((f,i)=>f.week=s.week+i);
  },
  rebuildAfterTransfer(s){
    const played=s.fixtures.filter(f=>f.sonuc);
    const pl=played.filter(f=>f.comp==='LIG').length, pk=played.filter(f=>f.comp==='KUPA').length, pu=played.filter(f=>f.comp==='UCL').length;
    let k=0,u=0;
    const fresh=this.build(s).filter(f=>f.comp==='LIG'?f.round>=pl:f.comp==='KUPA'?(k++)>=pk:(u++)>=pu);
    fresh.forEach((f,i)=>f.week=s.week+i);
    s.fixtures=played.concat(fresh);
  }
};

/* =========================================================
   Transfer – teklif mektupları, sözleşme, rest
========================================================= */
const Transfer = {
  pending(){ return GameState.s.offers.filter(o=>o.status==='bekliyor'); },
  weeklyCheck(){
    const s=GameState.s, fl=s.story.flags, ovr=GameState.ovr();
    s.offers.forEach(o=>{ if(o.status==='bekliyor'&&o.exp<s.week){ o.status='süresi doldu'; } });
    s.offers=s.offers.slice(0,12);
    if(s.contract.years<=0 && !this.pending().length && !s.story.pending){
      s.contract={wage:Math.round(s.contract.wage*.85/100)*100,years:1};
      GameState.log('Teklif kalmayınca kulübün seni 1 yıllık kontratla tuttu.','story');
    }
    let chance=.05+Math.max(0,s.form-6.5)*.08+Math.max(0,ovr-58)*.012+(s.media-50)/450+(fl.menajer?.07:0)+(fl.rumor?.22:0)+(fl.transferIstedi?.2:0);
    fl.rumor=false;
    if(this.pending().length<3 && Math.random()<chance) this.generate();
  },
  generate(o={}){
    const s=GameState.s, ovr=GameState.ovr(), mv=GameState.marketValue();
    const all=[...CONFIG.LEAGUES.TR.clubs.map(c=>({...c,lig:'TR'})),...CONFIG.LEAGUES.EU.clubs.map(c=>({...c,lig:'EU'}))]
      .filter(c=>c.ad!==s.club && !this.pending().some(p=>p.club===c.ad));
    const target=ovr+7;
    const club=U.weighted(all,c=>Math.exp(-Math.abs(c.guc-target)/5)+(c.lig==='EU'&&ovr<64?0:.01));
    const gap=club.guc-ovr, role=gap>12?'Yedek':gap>5?'Rotasyon':'İlk 11';
    const wage=Math.max(s.contract.wage*U.rnd(1.15,1.9),mv/260)*(club.lig==='EU'?1.6:1);
    const offer={id:U.uid(),club:club.ad,lig:club.lig,wage:Math.round(wage/100)*100,years:U.ri(2,4),
      fee:o.free?0:Math.round(mv*U.rnd(.8,1.4)/10000)*10000,role,exp:s.week+3,status:'bekliyor',sz:s.season,w:s.week,free:!!o.free,yeni:true};
    s.offers.unshift(offer);
    Social.post('journalist',o.free?'SERBEST OYUNCU ALARMI: {teklif}, {ad} için resmi teklif hazırladı. #TransferHaberleri':'SICAK: {teklif}, {ad} için {kulup}\'a resmi teklif yaptı! Bonservis: '+U.eur(offer.fee)+' #TransferHaberleri',{mag:2,ctx:{teklif:club.ad}});
    if(s.fanLove>60&&!o.free) Social.post('fan','{ad} gitmesin! Bu kulübün geleceği o. #GitmeKal',{mood:-1});
    GameState.log(`Resmi teklif: ${club.ad} (${U.eur(offer.fee)})`,'transfer');
    return offer;
  },
  force(n,o){ for(let i=0;i<n;i++) this.generate(o); },
  get(id){ return GameState.s.offers.find(o=>o.id===id); },
  accept(id){
    const s=GameState.s, o=this.get(id), fl=s.story.flags, mv=GameState.marketValue();
    if(!o||o.status!=='bekliyor') return {ok:false,msg:'Teklif geçerli değil.'};
    if(o.free||s.contract.years<=0){ this.execute(o,'iyi'); return {ok:true,done:true}; }
    let p=(o.fee/mv-.8)*1.1+(fl.transferIstedi?.35:0)+(s.contract.years<=1?.2:0)+(s.coachTrust<30?.15:0)+(fl.restCekti?.15:0);
    p=U.clamp(p,.05,.95);
    if(Math.random()<p){ this.execute(o,fl.transferIstedi||s.fanLove<40?'kotu':'iyi'); return {ok:true,done:true}; }
    o.status='kulüp reddetti'; fl.restOffer=o.id; fl.offerClub=o.club;
    StoryEngine.force('kulup_reddetti');
    return {ok:true,done:false};
  },
  leverage(id){
    const s=GameState.s, o=this.get(id);
    if(!o||o.status!=='bekliyor') return {ok:false};
    o.status='koz yapıldı';
    const p=U.clamp(.3+s.coachTrust/200+s.fanLove/400,.15,.85);
    if(Math.random()<p){
      const nw=Math.round(Math.max(s.contract.wage*1.3,o.wage*.9)/100)*100;
      s.contract={wage:nw,years:3};
      GameState.apply({coachTrust:4,fanLove:6,morale:6});
      Social.post('club','İMZA! {ad} ile sözleşmemizi 3 yıl uzattık. Burası senin evin! ✍️ #Sadakat',{mag:2.5});
      GameState.log(`${o.club} teklifi koz oldu: yeni maaş ${U.eur(nw)}/hafta`,'transfer');
      return {ok:true,win:true,wage:nw};
    }
    GameState.apply({coachTrust:-8,morale:-4,media:-2});
    Social.post('journalist','{kulup} yönetimi, {ad} tarafının "teklif var" kozuna boyun eğmedi. Gerilim tırmanıyor.',{mag:1.5});
    return {ok:true,win:false};
  },
  reject(id){
    const o=this.get(id); if(!o) return;
    o.status='reddedildi';
    GameState.apply({fanLove:5,teamRel:2});
    Social.post('fan','{ad} '+o.club+' teklifini reddetmiş! İşte sadakat budur. 💚',{mood:1,mag:1.4});
  },
  execute(o,veda='iyi'){
    const s=GameState.s, old=s.club, fl=s.story.flags, oldLeague=s.league;
    const hain=veda==='kotu'||fl.hain;
    Social.post(hain?'ultras':'fan',hain?'HAİN! Bu armayı satan bir daha bu stada adım atmasın. #Hain':'Teşekkürler {ad}. Yolun açık olsun, bu formayı hep hatırlayacağız. 💚',{mag:2.5,mood:hain?-1:1});
    o.status='kabul edildi';
    s.offers.forEach(x=>{ if(x.status==='bekliyor'||x.status==='rest') x.status='iptal'; });
    s.club=o.club; s.career.kulupler.push(o.club);
    const nl=U.club(o.club).lig;
    if(nl!==oldLeague){ s.league=nl; League.init(s,s.fixtures.filter(f=>f.comp==='LIG'&&f.sonuc).length); }
    s.cupOut=false;
    Fixtures.rebuildAfterTransfer(s);
    s.coach=U.pick(CONFIG.COACHES);
    s.contract={wage:o.wage,years:o.years};
    s.money+=o.wage*4;
    s.coachTrust=o.role==='İlk 11'?58:o.role==='Rotasyon'?45:32;
    s.teamRel=45; s.fanLove=48+Math.round((s.media-50)/5); s.status.kadroDisi=0;
    ['transferIstedi','hocaKavga','hain','restCekti','sadik','restOffer','basinaPatladi'].forEach(k=>delete fl[k]);
    s.story.queue=[]; s.story.pending=null;
    Social.post('journalist',`RESMİ: {ad} → ${o.club}. ${o.fee?'Bonservis '+U.eur(o.fee)+'. ':''}${o.years} yıllık imza. #TransferHaberleri`,{mag:3});
    Social.post('club',`Aramıza hoş geldin {ad}! ${o.years} yıllık sözleşme imzalandı. ✍️ #HoşGeldin`,{mag:3});
    GameState.log(`TRANSFER: ${old} → ${o.club}`,'transfer');
    GameState.apply({morale:10,media:6});
    StoryEngine.force('yeni_kulup');
    StoryEngine.weekly(true);
  },
  renewProposal(){
    const s=GameState.s, mv=GameState.marketValue();
    const wage=Math.max(s.contract.wage*1.12,mv/240)*(.8+s.coachTrust/250);
    return {wage:Math.round(wage/100)*100,years:3};
  },
  canRenew(){ const s=GameState.s, fl=s.story.flags; return !fl.renewStamp || U.stamp()-fl.renewStamp>=4; },
  negotiate(mode){
    const s=GameState.s, fl=s.story.flags, prop=this.renewProposal();
    fl.renewStamp=U.stamp();
    if(mode==='imzala'){
      s.contract={...prop}; GameState.apply({coachTrust:5,fanLove:5});
      Social.post('club','{ad} ile 3 yıllık yeni sözleşme! ✍️ #İmza',{mag:2});
      return {ok:true,msg:`Yeni sözleşme: ${U.eur(prop.wage)}/hafta, 3 yıl.`};
    }
    if(mode==='fazla'){
      const p=U.clamp(.2+s.coachTrust/220+s.fanLove/400+(this.pending().length?.2:0),.1,.85);
      if(Math.random()<p){
        const w=Math.round(prop.wage*1.3/100)*100; s.contract={wage:w,years:3}; GameState.apply({morale:6});

      GameState.apply({coachTrust:-8,fanLove:-4});
      Social.post('journalist','{kulup} ile {ad} arasındaki sözleşme görüşmeleri çıkmaza girdi.',{mag:1.4});
      return {ok:false,msg:'Yönetim talebini reddetti. Görüşmeler 4 hafta askıda.'};
    }
    if(mode==='rest'){
      fl.transferIstedi=true; GameState.apply({fanLove:-12,coachTrust:-8,media:4});
      Social.post('journalist','BOMBA: {ad} sözleşme masasından kalktı ve transfer talep etti! #TransferHaberleri',{mag:2.5});
      StoryEngine.force('baskan_ultimatom');
      this.force(1);
      return {ok:false,msg:'Transfer resti çektin. Başkan seni görmek istiyor...'};
    }
  }
};

  get(id){ return this.EVENTS.find(e=>e.id===id); },
  text(ev){ const s=GameState.s; const m=typeof ev.metin==='function'?ev.metin(s):ev.metin; return U.fill(m,GameState.ctx()); },
  queue(id,d=0,sans){ const s=GameState.s; s.story.queue.push({id,w:s.week+d,sans}); },
  force(id){ GameState.s.story.queue.unshift({id,w:0}); },
  recent(id){ const u=GameState.s.story.used[id]; return u && U.stamp()-u<6; },
  setPending(id){
    const s=GameState.s, ev=this.get(id); if(!ev) return;
    s.story.pending=id; s.story.used[id]=U.stamp();
    if(ev.giris) ev.giris(s);
  },
  weekly(chainOnly=false){
    const s=GameState.s; if(s.story.pending) return;
    while(true){
      const i=s.story.queue.findIndex(q=>q.w<=s.week); if(i<0) break;
      const q=s.story.queue.splice(i,1)[0], ev=this.get(q.id);
      if(!ev) continue;
      if(ev.kosulZincir && !ev.kosulZincir(s)) continue;
      if(q.sans && Math.random()>q.sans) continue;
      this.setPending(q.id); return;
    }
    if(chainOnly || s.seasonEnd) return;
    if(Math.random()<.72){
      const pool=this.EVENTS.filter(e=>e.kosul&&!this.recent(e.id)&&e.kosul(s));
      if(pool.length) this.setPending(U.weighted(pool,e=>e.w||1).id);
    }
  },
  resolve(idx){
    const s=GameState.s, ev=this.get(s.story.pending); if(!ev) return null;
    const c=ev.secimler[idx];
    if(c.sart && !c.sart(s)) return null;
    const before=GameState.marketValue();
    s.story.pending=null;
    if(c.fx) GameState.apply(c.fx);
    if(c.flag) Object.assign(s.story.flags,c.flag);
    (c.sosyal||[]).forEach(([k,t,o])=>Social.post(k,t,o||{}));
    if(c.run) c.run(s);
    (c.sonraki||[]).forEach(([id,d,sans])=>this.queue(id,d,sans));
    GameState.log(`${ev.baslik}: ${c.not}`,'story');
    this.weekly(true);
    return {not:c.not,diff:GameState.marketValue()-before};
  },
  postMatch(f,r){
    const s=GameState.s, fl=s.story.flags;
    if(fl.iddia){ delete fl.iddia; this.queue(r.played&&r.gol>0?'soz_tuttu':'soz_tutmadi',0); }
    if(fl.kucumsedi){ delete fl.kucumsedi; if(r.biz<r.onlar){ GameState.apply({media:-6,fanLove:-4}); Social.post('rival','Küçümsediğin takım sana dersini verdi. 😉',{mag:2,ctx:{rakip:f.rakip}}); } }
    if(fl.kapisma){ delete fl.kapisma; if(r.played) this.queue(r.biz>r.onlar?'kapisma_zafer':r.biz<r.onlar?'kapisma_yenilgi':'kapisma_zafer',0); }
    delete fl.pasVer;
  }
};

========================================================= */
const Training = {
  plans:{
    hucum:{ad:'Hücum',ikon:'target',attrs:['sut','dribling']},
    oyun:{ad:'Oyun Kurma',ikon:'share-2',attrs:['pas','dribling']},
    atletik:{ad:'Atletik',ikon:'zap',attrs:['hiz','fizik']},
    savunma:{ad:'Savunma',ikon:'shield',attrs:['defans','fizik']}
  },
  run(key){
    const s=GameState.s;
    if(s.ap<=0) return {ok:false,msg:'Bu hafta aksiyon hakkın bitti. Maça çık!'};
    if(s.energy<CONFIG.ENERGY.TRAIN) return {ok:false,msg:'Yeterli enerjin yok. Dinlenmelisin.'};
    const plan=this.plans[key], eff=.5+s.morale/200, gains={};
    plan.attrs.forEach(a=>{ gains[a]=+(Math.random()*.8*eff+.3).toFixed(2); });
    s.ap--;
    GameState.apply({energy:-CONFIG.ENERGY.TRAIN,attrs:gains,coachTrust:1});
    GameState.log(`${plan.ad} antrenmanı tamamlandı.`,'train');
    return {ok:true,gains};
  },
  rest(){
    const s=GameState.s;
    if(s.ap<=0) return {ok:false,msg:'Bu hafta aksiyon hakkın bitti.'};
    s.ap--; GameState.apply({energy:CONFIG.ENERGY.REST,morale:2});
    GameState.log('Dinlendin, enerji toplandı.','rest');
    return {ok:true};
  }
};

/* =========================================================
   Career – maç sonuçları, hafta/sezon döngüsü
========================================================= */
const Career = {
  positions(){ const r=GameState.role(), s=GameState.s; return r==='İLK 11'?3+(s.coachTrust>=80?1:0):r==='ROTASYON'?2:1; },
  blocked(){
    const s=GameState.s;
    if(s.story.pending) return 'Önce bekleyen hikaye kararını ver!';
    if(s.seasonEnd) return 'Sezon bitti. Sezon özetine geç.';
    if(!Fixtures.next(s)) return 'Fikstürde maç yok.';
    return null;
  },
  startMatch(){
    const s=GameState.s, f=Fixtures.next(s), n=this.positions(), role=GameState.role();
    const pool={FV:['sut','pas','sut','sut'],OS:['pas','sut','pas','sut'],DF:['pas','sut','pas','pas'],KL:['pas','pas','pas','pas']}[s.player.mevki];
    const plan=pool.slice(0,n);
    const lo=role==='YEDEK'?62:role==='ROTASYON'?30:5;
    const mins=plan.map(()=>U.ri(lo,89)).sort((a,b)=>a-b);
    MatchEngine.start({mode:'match',f,plan,mins,title:Fixtures.compName(f)+(f.tur?' • '+f.tur:''),left:s.club,right:f.rakip,onDone:c=>this.finishMatch(f,c)});
  },
  finishMatch(f,c){
    const s=GameState.s, P=s.player, club=U.club(s.club);
    const teamPow=club.guc+(GameState.ovr()-65)*.3+(s.morale-50)/20+(s.teamRel-50)/25;
    const [x,y]=League.simScore(teamPow,f.guc,f.evde?3:-3);
    const mine=c.gol+c.asist;
    const biz=mine+Math.max(0,x-(mine>0?1:0));
    let onlar=y; if(P.mevki==='KL') onlar=Math.max(0,onlar-(c.asist>0?1:0));
    const win=biz>onlar, lose=biz<onlar;
    let puan=6+c.gol+c.asist*.75+c.iyi*.15-c.kotu*.3+(win?.5:lose?-.4:0)+(Math.random()-.5)*.4;
    if(P.mevki==='KL') puan+=onlar===0?.9:-onlar*.3;
    puan=U.clamp(+puan.toFixed(1),3,10);
    const xp=10+c.gol*30+c.asist*20+c.iyi*8;
    const attrs={}; if(c.gol) attrs.sut=+(c.gol*.45).toFixed(2); if(c.asist) attrs.pas=+(c.asist*.35).toFixed(2); if(c.iyi) attrs.dribling=+(c.iyi*.15).toFixed(2);
    const before=GameState.marketValue();
    const r={biz,onlar,gol:c.gol,asist:c.asist,puan,played:true,xp,attrs};
    const cup=this.afterMatch(f,r);
    const diffMV=GameState.marketValue()-before;
    const R=MatchEngine.RES;
    return {
      title:Fixtures.compName(f)+' • Maç Sonu', color:CONFIG.COMPS[f.comp].renk,
      left:s.club, right:f.rakip, l:biz, r:onlar, win, lose,
      rows:c.res.map(x=>({min:x.min+"'",code:x.code,type:x.type})),
      stats:[['Gol',c.gol],['Asist',c.asist],['Puan',puan,puan>=7.5],['XP','+'+xp]],
      chips:Object.entries(attrs).map(([a,v])=>`${CONFIG.ATTRS[a].ad} +${v}`).concat(cup==='sampiyon'?['KUPA ŞAMPİYONU!']:cup==='elendi'?['Kupadan elendiniz']:[]),
      foot:`Piyasa değeri: <b class="${diffMV>=0?'text-[#22f5c9]':'text-[#ff3d81]'}">${diffMV>=0?'+':''}${U.eur(diffMV)}</b>`
    };
  },
  skipWeek(){
    const s=GameState.s, f=Fixtures.next(s), club=U.club(s.club);
    const [x,y]=League.simScore(club.guc-2,f.guc,f.evde?3:-3);
    s.status.kadroDisi=Math.max(0,s.status.kadroDisi-1);
    GameState.apply({morale:-4,energy:20,coachTrust:2});
    const r={biz:x,onlar:y,played:false};
    this.afterMatch(f,r);
    return r;
  },
  afterMatch(f,r){
    const s=GameState.s, win=r.biz>r.onlar, lose=r.biz<r.onlar, fl=s.story.flags;
    f.sonuc={biz:r.biz,onlar:r.onlar,gol:r.gol||0,asist:r.asist||0,puan:r.played?r.puan:null,oynadi:r.played};
    if(f.comp==='LIG'){
      if(f.evde) League.record(s,s.club,f.rakip,r.biz,r.onlar); else League.record(s,f.rakip,s.club,r.onlar,r.biz);
      League.simRound(s,f.round,s.club);
    }
    let cup=null;
    if(f.comp==='KUPA'){
      const adv=win||(!lose&&Math.random()<.5);
      if(!win&&!lose) f.sonuc.pen=adv?'Pen. kazandı':'Pen. kaybetti';
      if(!adv){ s.cupOut=true; cup='elendi'; GameState.apply({fanLove:-3}); }
      else if(f.tur==='Final'){ s.career.kupalar.push(`${Fixtures.compName(f)} ${s.season}`); GameState.apply({fanLove:12,morale:12,media:6}); cup='sampiyon'; }
    }
    if(r.played){
      const st=s.stats; st.ortPuan=+((st.ortPuan*st.mac+r.puan)/(st.mac+1)).toFixed(2); st.mac++; st.gol+=r.gol; st.asist+=r.asist;
      s.career.mac++; s.career.gol+=r.gol; s.career.asist+=r.asist; s.player.xp+=r.xp||0;
      GameState.apply({energy:-CONFIG.ENERGY.MATCH, morale:(win?6:lose?-5:0)+r.gol*2+r.asist,
        coachTrust:Math.round((r.puan-6.5)*4), form:(r.puan-s.form)*.35, attrs:r.attrs,
        fanLove:r.gol*3+(win?2:lose?-2:0)+(fl.hain?-2:0), media:r.puan>=8?4:r.puan<5.5?-4:0,
        teamRel:r.asist*3+(win?1:0)+(fl.bencil&&!r.asist?-2:0)});
    }
    GameState.log(`${Fixtures.compName(f)}: ${s.club} ${r.biz}-${r.onlar} ${f.rakip}${r.played?' • Puan '+r.puan:' • (oynamadın)'}`,'match');
    s.money+=s.contract.wage; s.week++; s.ap=CONFIG.AP;
    GameState.apply({energy:12});
    if(cup==='elendi') Fixtures.dropCup(s);
    Social.matchReaction(f,r,cup);
    StoryEngine.postMatch(f,r);
    Transfer.weeklyCheck();
    if(!Fixtures.next(s)) s.seasonEnd=true;
    StoryEngine.weekly();
    return cup;
  },
  endSeason(){
    const s=GameState.s, L=CONFIG.LEAGUES[s.league], pos=League.pos(s);
    const rec={season:s.season,club:s.club,lig:L.ad,pos,...s.stats};
    s.history.push(rec);
    const notes=[];
    if(pos===1){ s.career.kupalar.push(`${L.ad} ${s.season}`); GameState.apply({fanLove:15,morale:15,media:8}); notes.push('LİG ŞAMPİYONU!'); Social.post('club','ŞAMPİYON! 🏆 Bu sezon tarih yazdık! #Şampiyon',{mag:5}); }
    else if(pos<=3){ GameState.apply({fanLove:5,morale:6}); notes.push('Podyumda bitirdiniz.'); }
    else if(pos>=L.clubs.length-1){ GameState.apply({morale:-10,fanLove:-5}); notes.push('Hayal kırıklığı bir sezon...'); }
    if(s.stats.gol>=8){ notes.push('Gol Krallığı yarışında zirvedesin!'); GameState.apply({media:6}); }
    Social.post('journalist',`Sezon ${s.season} sona erdi: {kulup} ligi ${pos}. sırada tamamladı. {ad}: ${s.stats.mac} maç, ${s.stats.gol} gol, ${s.stats.asist} asist.`,{mag:2});
    s.player.yas++;
    if(s.player.yas>30){ s.player.attrs.hiz-=1.5; s.player.attrs.fizik-=1; }
    s.contract.years--;
    s.season++; s.week=1; s.ap=CONFIG.AP; s.cupOut=false; s.seasonEnd=false; s.energy=100;
    s.stats={mac:0,gol:0,asist:0,ortPuan:0};
    ['milli','hocaKavga','bencil','kucumsedi','sponsor','hayir'].forEach(k=>delete s.story.flags[k]);
    League.init(s,0); s.fixtures=Fixtures.build(s);
    if(s.contract.years<=0) StoryEngine.force('sozlesme_bitti');
    GameState.clamp();
    StoryEngine.weekly(true);
    return {rec,notes};
  }
};

    GameState.apply({energy:-CONFIG.ENERGY.STREET,streetPoints:pts,morale:win?5:-3,fanLove:win?2:0,media:win?2:0,attrs:{dribling:win?.35:.15}});
    Social.post('street',win?`{ad} kafeste ${opp.rakip} ekibini ${c.our}-${c.their} yıktı! Sokağın yeni kralı mı geliyor? 🔥 #SokakFutbolu`:`${opp.rakip}, {ad} ve ekibini ${c.their}-${c.our} mağlup etti. Asfalt acımasızdır. #SokakFutbolu`,{mag:win?1.8:1.2});
    GameState.log(`3v3 Sokak: ${c.our}-${c.their} ${opp.rakip} ${win?'(+'+pts+' Sokak Puanı)':''}`,'street');
    StoryEngine.weekly(true);
    return {
      title:'3v3 Sokak • Maç Sonu', color:'#ff3d81', left:'SEN & EKİP', right:opp.rakip, l:c.our, r:c.their, win, lose:!win,
      rows:c.res.map(x=>({min:x.min,code:x.code,type:x.type})),
      stats:[['Gol',c.gol],['Asist',c.asist],['Sokak P.','+'+pts,win],['Toplam',s.street.points]],
      chips:[win?'Galibiyet! Yetenek ağacında puan harca.':'Mağlubiyet. Asfaltta daha çok terle.'],
      foot:`Sokak Rütbesi: <b class="text-[#ff3d81]">${this.rank()}</b>`
    };
  }
};
</script>
<script>
/* =========================================================
   AŞAMA 7 MODÜLLERİ
   Persona • Lifestyle • CinemaEngine • Adaptif Sosyal Medya • Maç dengesi
   (Var olan modüller korunur; yalnızca sarmalayıcılar ile genişletilir)
========================================================= */

/* ---------- Kalıcı veri varsayılanları (eski kayıtlar için de) ---------- */
GameState.ensure=function(s=this.s){
  if(!s) return s;
  s.persona=s.persona||{lider:0,asi:0,pro:0,sov:0};
  s.invest=s.invest||[];
  s.talks=s.talks||{};
  if(typeof s.agentRel!=='number') s.agentRel=50;
  s.social.mem=s.social.mem||[];
  return s;
};
(function(){ const orig=GameState.create.bind(GameState);
  GameState.create=function(a,b){ const s=orig(a,b); this.ensure(s); return s; }; })();

/* =========================================================
   Persona – oyundaki kişiliğin (Lider • Asi • Profesyonel • Şovmen)
========================================================= */
const Persona = {
  T:{lider:{ad:'Lider',renk:'#4ade80',ikon:'crown',d:'Takımı sırtlayan ses'},
     asi:{ad:'Asi',renk:'#ff3d81',ikon:'flame',d:'Kurallara meydan okuyan'},
     pro:{ad:'Profesyonel',renk:'#18b6ff',ikon:'briefcase',d:'Gürültüsüz, disiplinli'},
     sov:{ad:'Şovmen',renk:'#ffc53d',ikon:'sparkles',d:'Kameraların yıldızı'}},
  add(tag,n=1){ const s=GameState.s; if(!s||!this.T[tag]) return; GameState.ensure(s); s.persona[tag]+=n; },
  dominant(){ const p=(GameState.s&&GameState.s.persona)||{}; let best='pro',v=-1; for(const k in this.T){ if((p[k]||0)>v){v=p[k]||0;best=k;} } return best; },
  lvl(tag){ return (GameState.s.persona||{})[tag]||0; },
  tagOf(c){
    const fx=c.fx||{}, fl=c.flag||{};
    if(fl.hain||fl.restCekti||fl.transferIstedi||fl.basinaPatladi||fl.bencil||fl.kapisma||fl.kucumsedi) return 'asi';
    if((fx.coachTrust||0)<0&&((fx.morale||0)>0||(fx.media||0)>0||(fx.fanLove||0)>0)) return 'asi';
    if((fx.teamRel||0)>0&&(fx.teamRel||0)>=(fx.coachTrust||0)) return 'lider';
    if((fx.coachTrust||0)>0&&(fx.coachTrust||0)>=(fx.media||0)) return 'pro';
    if((fx.media||0)>=4||(fl.iddia)) return 'sov';
    if((fx.coachTrust||0)>0||fx.attrs||fx.form) return 'pro';
    if((fx.media||0)>0||(fx.fanLove||0)>0) return 'sov';
    return 'pro';
  }
};

/* --- StoryEngine.resolve sarmalayıcı: her karar kişiliği ve sosyal hafızayı besler --- */
const STORY_MEMO={hoca_elestiri:'antrenmanda hocasıyla gerilen',kadro_disi:'kadro dışı kalan',menajer_devrede:'transfer krizinin ortasındaki',
  basin_toplantisi:'basın toplantısında iddialı konuşan',parti:'gece hayatıyla gündeme gelen',paparazzi:'paparazzilere yakalanan',
  rakip_laf:'rakibiyle sosyal medyada kapışan',milli:'milli takım gündemindeki',sokak_viral:'sokak maçıyla viral olan',
  taraftar_tepki:'tribünlerle arası gergin olan',taraftar_destek:'tribünlerin sevgilisi',kaptan_uyari:'kaptanından uyarı alan',
  baskan_ultimatom:'başkanla sözleşme pazarlığındaki',kulup_reddetti:'transferi veto edilen',soz_tutmadi:'verdiği sözü tutamayan',soz_tuttu:'sözünü tutan'};
(function(){ const orig=StoryEngine.resolve.bind(StoryEngine);
  StoryEngine.resolve=function(idx){
    const s=GameState.s, id=s.story.pending, ev=this.get(id), c=ev&&ev.secimler[idx];
    const r=orig(idx);
    if(r&&c){ Persona.add(Persona.tagOf(c)); if(STORY_MEMO[id]) Social.remember(STORY_MEMO[id]); }
    return r;
  }; })();

/* =========================================================
   Lifestyle – tesis / yaşam tarzı yatırımları (haftalık pasif enerji)
========================================================= */
const Lifestyle = {
  ITEMS:[
    {id:'beslenme',ad:'Beslenme Uzmanı',ikon:'apple',cost:6000,fee:250,energy:6,desc:'+6 enerji/hafta • Form +0.1/hafta',fx:{form:.1}},
    {id:'fizyo',ad:'Özel Fizyoterapist',ikon:'activity',cost:10000,fee:400,energy:10,desc:'+10 enerji/hafta • Sakatlık riskini azaltır'},
    {id:'psikolog',ad:'Spor Psikoloğu',ikon:'brain',cost:9000,fee:350,energy:3,desc:'+3 enerji/hafta • Moral +2/hafta',fx:{morale:2}},
    {id:'pr',ad:'PR & Sosyal Medya Ekibi',ikon:'megaphone',cost:12000,fee:500,energy:0,desc:'Medya İmajı +1/hafta • Takipçi artışı',fx:{media:1}},
    {id:'antrenor',ad:'Özel Antrenör',ikon:'dumbbell',cost:18000,fee:700,energy:4,desc:'+4 enerji/hafta • Her hafta rastgele bir yetenek +0.3',train:true},
    {id:'ev',ad:'Tesis Yakını Lüks Daire',ikon:'home',cost:25000,fee:600,energy:8,desc:'+8 enerji/hafta • Moral +1/hafta',fx:{morale:1}},
    {id:'kriyo',ad:'Kriyoterapi Odası',ikon:'snowflake',cost:30000,fee:300,energy:12,req:'fizyo',desc:'+12 enerji/hafta • Fizyoterapist gerekir'}
  ],
  has(id){ return (GameState.s.invest||[]).includes(id); },
  get(id){ return this.ITEMS.find(i=>i.id===id); },
  weeklyEnergy(){ return (GameState.s.invest||[]).reduce((a,id)=>a+(this.get(id)?.energy||0),0); },
  weeklyFee(){ return (GameState.s.invest||[]).reduce((a,id)=>a+(this.get(id)?.fee||0),0); },
  buy(id){
    const s=GameState.s, it=this.get(id);
    if(this.has(id)) return {ok:false,msg:'Zaten sahipsin.'};
    if(it.req&&!this.has(it.req)) return {ok:false,msg:`Önce ${this.get(it.req).ad} gerekli.`};
    if(s.money<it.cost) return {ok:false,msg:`Yetersiz bakiye: ${U.eur(it.cost)} gerekiyor.`};
    s.money-=it.cost; s.invest.push(id);
    GameState.log(`Yatırım: ${it.ad}`,'train');
    Social.post('me',U.pick([`Ekibime yeni bir isim katıldı: ${it.ad}. Detaylar şampiyonları ayırır. 💪`,`${it.ad} ile yeni dönem başlıyor. Daha güçlü, daha hızlı. ⚡`]),{mag:1.2});
    return {ok:true};
  },
  cancel(id){ const s=GameState.s; s.invest=s.invest.filter(x=>x!==id&&this.get(x).req!==id); },
  weekly(){
    const s=GameState.s; if(!s.invest.length) return;
    const fee=this.weeklyFee();
    s.money-=fee;
    if(s.money<0){ // bakiye eksiye düşerse en pahalı abonelik iptal
      const top=[...s.invest].sort((a,b)=>this.get(b).fee-this.get(a).fee)[0];
      this.cancel(top); GameState.log(`Bakiye yetersiz: ${this.get(top).ad} aboneliği iptal edildi.`,'transfer');
    }
    const fx={energy:this.weeklyEnergy()};
    s.invest.forEach(id=>{ const it=this.get(id); if(it.fx) for(const k in it.fx) fx[k]=(fx[k]||0)+it.fx[k]; });
    if(this.has('antrenor')){ const k=U.pick(Object.keys(CONFIG.ATTRS)); fx.attrs={[k]:.3}; }
    GameState.apply(fx);
  }
};

/* =========================================================
   Maç dengesi – İlk 11'de daha çok pozisyon & hamle
========================================================= */
Career.positions=function(){
  const r=GameState.role(), s=GameState.s;
  return r==='İLK 11'?5+(s.coachTrust>=70?1:0)+(s.coachTrust>=85?1:0):r==='ROTASYON'?3:2;
};
Career.maxAct=function(){ const r=GameState.role(); return r==='İLK 11'?8:r==='ROTASYON'?7:6; };
Career.startMatch=function(){
  const s=GameState.s, f=Fixtures.next(s), n=this.positions(), role=GameState.role();
  const pool={FV:['sut','pas','sut','sut'],OS:['pas','sut','pas','sut'],DF:['pas','sut','pas','pas'],KL:['pas','pas','pas','pas']}[s.player.mevki];
  const plan=Array.from({length:n},(_,i)=>pool[i%pool.length]);
  const lo=role==='YEDEK'?62:role==='ROTASYON'?30:3;
  const mins=plan.map(()=>U.ri(lo,90)).sort((a,b)=>a-b);
  MatchEngine.start({mode:'match',f,plan,mins,maxAct:this.maxAct(),title:Fixtures.compName(f)+(f.tur?' • '+f.tur:''),left:s.club,right:f.rakip,onDone:c=>this.finishMatch(f,c)});
};
(function(){ const orig=Career.finishMatch.bind(Career);
  // Çok pozisyonlu maçlarda kötü pozisyon cezası normalize edilir; pozisyon detayları sosyal medya için saklanır
  Career.finishMatch=function(f,c){
    Social._lastRes=(c.res||[]).slice();
    const n=Math.max(1,(c.res||[]).length), scale=Math.min(1,4/n);
    return orig(f,{...c,kotu:Math.round(c.kotu*scale)});
  }; })();
(function(){ const orig=Career.afterMatch.bind(Career);
  Career.afterMatch=function(f,r){ const s=GameState.s, w=s.week; const out=orig(f,r); if(s.week!==w) Lifestyle.weekly(); return out; }; })();

/* =========================================================
   Adaptif Sosyal Medya – maç olayları, reyting, kişilik ve hafızaya göre
========================================================= */
Social.remember=function(p){ const s=GameState.s; GameState.ensure(s); s.social.mem.unshift({p,st:U.stamp()}); s.social.mem=s.social.mem.slice(0,8); };
Social.recentMem=function(){ const s=GameState.s, m=(s.social.mem||[])[0]; return m&&U.stamp()-m.st<=3?m.p:null; };
Social.matchReaction=function(f,r,cup){
  const s=GameState.s, cname=Fixtures.compName(f), win=r.biz>r.onlar, lose=r.biz<r.onlar, fl=s.story.flags;
  const res=(r.played&&Social._lastRes)||[]; Social._lastRes=null;
  const mins=code=>res.filter(x=>x.code===code).map(x=>x.min);
  const L=a=>a.map(n=>n+"'").join(', '), dk=n=>n+'. dakikadaki';
  const goals=mins('GOL'), asists=mins('ASIST'), saved=mins('KURTARDI'), post=mins('DIREK'), wide=mins('DISARI'), tm=mins('TM_KACIRDI');
  const lost=res.filter(x=>['KAPTIRDI','KESILDI','BLOK','SURE'].includes(x.code)).length;
  const per=Persona.dominant(), mem=Social.recentMem(), ctx={rakip:f.rakip,puan:r.puan};
  const score=f.evde?`${s.club} ${r.biz}-${r.onlar} ${f.rakip}`:`${f.rakip} ${r.onlar}-${r.biz} ${s.club}`;
  this.post('club',`MAÇ SONUCU | ${cname}: ${score}${goals.length?` ⚽ {ad} ${L(goals)}`:''}${asists.length?` • Asist: {ad} ${L(asists)}`:''}${r.played&&r.puan>=8?` • Maçın oyuncusu: {ad} (${r.puan})`:''}`,{ctx});
  if(!r.played){
    this.post('fan',mem?`${mem} {ad} yine tribünde. Takım ${win?'kazandı ama':'puan kaybetti ve'} herkes aynı şeyi soruyor: bu inat kime yarıyor?`:U.pick(['{ad} tribünde, takım sahada... Bu iş böyle olmaz.','{hoca} inat etmesin, {ad}\'ı oynatsın! #FreeTheKid']),{ctx});
    if(lose) this.post('journalist',`{kulup} sahada ${r.onlar} gol yedi, {ad} ise kulübede bile değildi. Kadro dışı kararı tartışılıyor.`,{mag:1.4});
  } else {
    const parts=[`{ad}, {rakip} karşısında ${res.length} pozisyonda ${r.gol} gol${r.asist?`, ${r.asist} asist`:''} üretti`];
    if(saved.length) parts.push(`${saved.length} şutu kalecide kaldı (${L(saved)})`);
    if(post.length) parts.push(`${L(post)} dakikalarda direğe takıldı`);
    if(wide.length) parts.push(`${wide.length} vuruşu auta gitti`);
    if(lost) parts.push(`${lost} kez top kaybetti`);
    const verdict=r.puan>=8.5?'Gecenin yıldızı.':r.puan>=7.5?'Etkili bir performans.':r.puan>=6.5?'Ortalama bir gece.':r.puan>=5.5?'Silik kaldı.':'Unutulacak bir maç.';
    const pv={lider:'Sahada liderlik sinyalleri veriyor.',asi:'Tartışmalı karakteri sahaya da yansıyor.',pro:'Disiplinli oyunu dikkat çekiyor.',sov:'Kameralar onu seviyor, o da kameraları.'}[per];
    this.post('journalist',`${parts.join(', ')}. Reyting: ${r.puan}. ${verdict} ${pv}`,{mag:1.6,ctx});
    if(r.gol>=3) this.post('journalist',`HAT-TRICK! {ad} ${L(goals)} dakikalarda ağları sarstı. {rakip} savunması dağıldı. #HatTrick`,{mag:3.2,ctx});
    else if(goals.length) this.post('fan',U.pick([`${dk(goals[0])} golü 10 kere izledim. {ad} sen nesin!`,`${goals[goals.length-1]}' — {ad} imzasını attı. {rakip} defansı hâlâ onu arıyor. 🔥`,`O ${goals[0]}' golü sezonun en güzellerinden. Formasını alan kazandı.`]),{mag:1.6,mood:1,ctx});
    if(post.length) this.post('fan',`${post[0]}' direk... O top girse bambaşka konuşuyorduk. Şanssızlık {ad}.`,{ctx});
    if(saved.length>=2) this.post('fan',`{ad} bugün kaleciyle özel maç yaptı: ${saved.length} kurtarış (${L(saved)}). Bir gün o eldivenler de pes edecek.`,{ctx});
    if(wide.length>=2&&!r.gol) this.post('fan',`${wide.map(n=>n+"'").join(' ve ')} — iki vuruş da dışarı... {ad} nişan ayarını evde mi unuttu?`,{mood:-1,ctx});
    if(lost>=2) this.post('fan',`${lost} top kaybı. {ad} biraz daha az çalım, biraz daha fazla pas lütfen.`,{mood:-1,ctx});
    if(asists.length) this.post('teammate',`${dk(asists[0])} o pas için teşekkürler kardeşim, golün yarısı senin. 🎯`,{ctx});
    if(tm.length) this.post('teammate',`${dk(tm[0])} harika pasına karşılık veremedim, özür dilerim {ad}. Bir dahakine o top içeride.`,{ctx});
    if(r.puan<6&&per==='asi') this.post('fan','Basında o kadar konuşan adam {puan} reytingle döndü. Önce sahada konuş.',{mood:-1,ctx});
    if(r.puan>=8&&per==='sov') this.post('fan','Şovmen yine sahneyi aldı: {puan} reyting. Bu gece sosyal medya patlar. 🎬',{mood:1,ctx});
    if(r.puan>=7.5&&per==='lider') this.post('teammate','Soyunma odasında da sahada da öndeydi. O kaptanlık bandı bir gün ona çok yakışacak.',{ctx});
    if(r.puan>=7&&per==='pro') this.post('journalist','Gürültü yok, magazin yok: sadece futbol. {ad} profesyonelliğin tanımı. ({puan})',{ctx});
    if(mem) this.post('journalist',`Son günlerde ${mem} {ad}, ${r.gol?`sahada ${r.gol} golle cevap verdi`:r.puan<6?'sahada da beklentilerin uzağında kaldı':'sahada sessiz bir gece geçirdi'}. Reyting: ${r.puan}.`,{mag:1.3,ctx});
    const miss=saved[0]||wide[0]||post[0];
    if(lose&&miss) this.post('rival',`${dk(miss)} pozisyonu kaçıran çocuk bizi yenecekti öyle mi? 😉`,{mag:1.6,ctx});
    else if(win&&r.gol) this.post('rival','Tebrikler {ad}. Bugün senin günündü, rövanşta görüşürüz.',{ctx});
    if(fl.hain&&r.gol) this.post('ultras','Gol atman bir şeyi değiştirmez. Bu armayı satanlara affımız yok.',{mood:-1});
  }
  if(cup==='elendi') this.post('journalist','{kulup} kupaya veda etti. Taraftar tepkili. #ZiraatKupası');
  if(cup==='sampiyon') this.post('club','KUPA BİZİM! Şampiyonuz! 🏆 #Şampiyon',{mag:4});
};

/* =========================================================
   CinemaEngine – Görsel Roman / sinematik diyalog sekansları
   sahne = {loc, start, nodes:{id:{who, text:[...], choices:[{t,tag,fx,react,next,sosyal,mem,run,cond,lock}] , next}}}
========================================================= */
const CinemaEngine = {
  el:null, scene:null, timer:null, busy:false, onEnd:null, lastAuto:null,
  LOCS:{
    tesis:{ad:'Antrenman Tesisi',bg:'linear-gradient(180deg,#071410 0%,#0d3a22 55%,#082015 100%)'},
    soyunma:{ad:'Soyunma Odası',bg:'linear-gradient(180deg,#0b0f1a 0%,#1a2236 60%,#0b0f1a 100%)'},
    basin:{ad:'Basın Toplantısı Salonu',bg:'radial-gradient(ellipse at 50% 0%,#1d3a5f 0%,#0a1220 60%,#05070d 100%)'},
    masa:{ad:'Transfer Masası',bg:'linear-gradient(160deg,#1a1206 0%,#2c1d0a 45%,#0b0805 100%)'},
    tribun:{ad:'Stadyum Önü',bg:'linear-gradient(180deg,#1a0611 0%,#3a0d22 50%,#0b0306 100%)'},
    gece:{ad:'Gece Kulübü Çıkışı',bg:'linear-gradient(180deg,#12052a 0%,#2a0b4a 50%,#05030d 100%)'},
    telefon:{ad:'Sosyal Medya',bg:'linear-gradient(180deg,#05101f 0%,#0b2440 60%,#05070d 100%)'},
    sokak:{ad:'Sokak Arenası',bg:'linear-gradient(180deg,#0b0d12 0%,#1f1520 60%,#0b0d12 100%)'}
  },
  CHARS:{
    hoca:{ad:()=>GameState.s.coach,unvan:'Teknik Direktör',renk:'#ff3d81',ikon:'clipboard-list',acc:'cap'},
    menajer:{ad:'Kerem Aydın',unvan:'Menajer',renk:'#ffc53d',ikon:'briefcase',acc:'tie'},
    kaptan:{ad:'Emre Kılıç',unvan:'Takım Kaptanı',renk:'#4ade80',ikon:'users',acc:'band'},
    basin:{ad:'Ece Tunalı',unvan:'Spor Muhabiri',renk:'#18b6ff',ikon:'mic',acc:'mic'},
    baskan:{ad:'Kulüp Başkanı',unvan:'Yönetim Kurulu',renk:'#a993ff',ikon:'landmark',acc:'tie'},
    direktor:{ad:'Sportif Direktör',unvan:'Kulüp Yönetimi',renk:'#a993ff',ikon:'file-signature',acc:'tie'},
    taraftar:{ad:'Kuzey Tribünü',unvan:'Taraftar Grubu',renk:'#ff3d81',ikon:'flag',acc:'scarf'},
    rakip:{ad:'Rakip Forvet',unvan:'Rakip Oyuncu',renk:'#f97316',ikon:'flame',acc:'band'},
    sen:{ad:()=>GameState.s.player.ad,unvan:'Sen',renk:'#22f5c9',ikon:'user',acc:'band'},
    genel:{ad:'Anlatıcı',unvan:'',renk:'#94a3b8',ikon:'message-square',acc:''}
  },
  who(id,ov){ const c={...(this.CHARS[id]||this.CHARS.genel),...(ov||{})}; return {...c,ad:typeof c.ad==='function'?c.ad():c.ad}; },

  bust(c){ // stilize SVG portre
    const r=c.renk, dark='#0b0f1a';
    const acc={cap:`<path d="M58 66 Q100 30 142 66 L146 76 L54 76 Z" fill="${r}" opacity=".9"/><rect x="48" y="72" width="70" height="7" rx="3" fill="${r}"/>`,
      tie:`<path d="M100 158 L90 172 L100 224 L110 172 Z" fill="${r}"/>`,
      band:`<rect x="138" y="176" width="26" height="14" rx="3" fill="${r}" transform="rotate(-12 150 183)"/>`,
      mic:`<rect x="146" y="150" width="12" height="44" rx="5" fill="#cbd5e1"/><circle cx="152" cy="146" r="12" fill="${r}"/>`,
      scarf:`<path d="M62 160 Q100 182 138 160 L134 176 Q100 196 66 176 Z" fill="${r}"/>`}[c.acc]||'';
    return `<svg viewBox="0 0 200 240" class="w-full h-full drop-shadow-[0_0_30px_rgba(0,0,0,.6)]">
      <path d="M18 240 C18 176 58 152 100 152 C142 152 182 176 182 240 Z" fill="${dark}" stroke="${r}" stroke-width="3"/>
      <rect x="86" y="128" width="28" height="30" rx="8" fill="${dark}" stroke="${r}" stroke-width="3"/>
      <ellipse cx="100" cy="92" rx="44" ry="50" fill="${dark}" stroke="${r}" stroke-width="3"/>
      <path d="M70 92 Q100 108 130 92" stroke="${r}" stroke-opacity=".25" stroke-width="2" fill="none"/>
      ${acc}</svg>`;
  },
  decoHtml(loc){

  setSpeaker(id,ov){

  say(id,lines,done,ov){
    lines=(Array.isArray(lines)?lines:[lines]).filter(Boolean);
    if(!lines.length) return done();
    this.setSpeaker(id,ov);
    const tx=document.getElementById('cnText'), nx=document.getElementById('cnNext'), box=document.getElementById('cnBox'), ch=document.getElementById('cnChoices');
    let i=0;
    const line=()=>{
      const full=U.fill(lines[i],GameState.ctx()); let k=0; ch.innerHTML=''; nx.classList.add('hidden');
      tx.textContent=''; clearInterval(this.timer); this.busy=true;
      tx.classList.toggle('italic',id==='sen'); tx.style.color=id==='sen'?'#22f5c9':'';
      this.timer=setInterval(()=>{ k+=2; tx.textContent=full.slice(0,k); if(k>=full.length){ clearInterval(this.timer); this.busy=false; nx.classList.remove('hidden'); } },18);
      box.onclick=()=>{
        if(CinemaEngine.cardOn) return;
        if(this.busy){ clearInterval(this.timer); tx.textContent=full; this.busy=false; nx.classList.remove('hidden'); return; }
        i++; if(i<lines.length) line(); else { box.onclick=null; nx.classList.add('hidden'); done(); }
      };
    };
    line();
  },
  go(id){
    const n=this.scene&&this.scene.nodes[id];
    if(!n) return this.close();
    this.say(n.who,n.text,()=>{ if(n.choices&&n.choices.length) this.choose(n); else if(n.next) this.go(n.next); else this.close(); },n.ov);
  },
  choose(n){
    const s=GameState.s, ch=document.getElementById('cnChoices'); if(!ch) return;
    document.getElementById('cnNext').classList.add('hidden');
    const list=n.choices.filter(c=>!c.cond||c.cond(s));
    ch.innerHTML=list.map((c,i)=>{ const P=Persona.T[c.tag]||Persona.T.pro, lock=c.lock&&c.lock(s);
      return `<button data-cn="${i}" ${lock?'disabled':''} class="btn text-left rounded-xl px-4 py-3 border ${lock?'opacity-40 border-white/10':'border-white/15 hover:border-white/40'} bg-black/40 fade-in" style="animation-delay:${i*60}ms">
        <div class="flex items-center gap-2 mb-1"><span class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded" style="background:${P.renk}26;color:${P.renk}">${P.ad}</span>${c.adaptive?'<span class="text-[9px] text-[#a993ff]">✦ kişiliğine özel</span>':''}${lock?`<span class="text-[9px] text-white/45">🔒 ${U.esc(lock)}</span>`:''}</div>
        <p class="text-sm font-semibold">${U.esc(U.fill(c.t,GameState.ctx()))}</p>
        ${c.fx&&!lock?`<div class="flex flex-wrap gap-1 mt-1.5">${UI.fxChips(c.fx)}</div>`:''}
      </button>`; }).join('');
    UI.icons();
    document.getElementById('cnBox').onclick=null;
    ch.querySelectorAll('[data-cn]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); this.pick(n,list[+b.dataset.cn]); });
  },
  pick(n,c){
    const s=GameState.s;
    document.getElementById('cnChoices').innerHTML='';
    if(c.onPick) return c.onPick(c);
    if(c.fx) GameState.apply(c.fx);
    if(c.tag) Persona.add(c.tag);
    (c.sosyal||[]).forEach(([k,t,o])=>Social.post(k,t,o||{}));
    if(c.mem) Social.remember(c.mem);
    if(c.run) c.run(s);
    GameState.persist();
    this.say('sen',[c.t],()=>this.say(n.who,c.react,()=>{ if(c.next) this.go(c.next); else this.close(); },n.ov));
  },

  whoFor(ev){
    const k=ev.kim||'';
    if(/hoca|Teknik/i.test(k)) return 'hoca';
    if(/Menajer/.test(k)) return 'menajer';
    if(/Kaptan|Takım Arkadaşı|Soyunma/.test(k)) return 'kaptan';
    if(/Başkan/.test(k)) return 'baskan';
    if(/Sportif/.test(k)) return 'direktor';
    if(/Basın|Spor Basını|Magazin/.test(k)) return 'basin';
    if(/Tribün|Taraftar/.test(k)) return 'taraftar';
    if(/Rakip/.test(k)) return 'rakip';
    return null;
  },
  locFor(ev,who){
    const byId={parti:'gece',paparazzi:'gece',sokak_viral:'sokak',rakip_laf:'telefon',kapisma_zafer:'telefon',kapisma_yenilgi:'telefon',milli:'tesis',ilk_gun:'soyunma',soyunma_krizi:'soyunma',kaptan_uyari:'soyunma',sponsor:'masa',hayir:'tesis'};
    if(byId[ev.id]) return byId[ev.id];
    return {hoca:'tesis',kaptan:'soyunma',basin:'basin',menajer:'masa',direktor:'masa',baskan:'masa',taraftar:'tribun',rakip:'telefon'}[who]||'tesis';
  },
  splitText(t){ const p=t.match(/[^.!?]+[.!?]+["”]?|[^.!?]+$/g)||[t]; const out=[]; let cur=''; p.forEach(x=>{ if((cur+x).length>150&&cur){ out.push(cur.trim()); cur=x; } else cur+=x; }); if(cur.trim()) out.push(cur.trim()); return out; },
  story(chained){
    const s=GameState.s, id=s.story.pending, ev=id&&StoryEngine.get(id); if(!ev) return this.close();
    this.lastAuto=id+'@'+U.stamp();
    const w=this.whoFor(ev), ov=w?null:{ad:U.fill(ev.kim,GameState.ctx()),unvan:'',renk:ev.renk,ikon:ev.ikon};
    const who=w||'genel', club=s.club;
    const base=ev.secimler.map((c,i)=>({t:c.t,tag:Persona.tagOf(c),fx:c.fx,react:c.not,lock:c.sart?(st=>c.sart(st)?null:c.sartText):null,idx:i}));
    const adapt=(this.ADAPT[id]||[]).filter(a=>a.cond(s)).map(a=>({...a,idx:a.base,adaptive:true,react:ev.secimler[a.base].not,fx:{...(ev.secimler[a.base].fx||{}),...a.bonus}}));
    const onPick=c=>{
      if(c.adaptive){ GameState.apply(c.bonus||{}); Persona.add(c.tag,1); if(c.run) c.run(s); }
      const r=StoryEngine.resolve(c.idx); if(!r) return this.close();
      GameState.persist();
      this.say('sen',[c.t],()=>this.say(who,c.react,()=>{
        if(s.club!==club) return this.say('genel',['Yeni bir şehir, yeni bir forma. Kariyerinde yeni bir sayfa açılıyor...'],()=>this.close());
        if(s.story.pending) return this.say('genel',['Bu iş burada bitmedi...'],()=>this.story(true));
        this.close();
      },ov));
    };
    const scene={loc:this.locFor(ev,who),start:'a',nodes:{a:{who,ov,text:[`— ${ev.baslik} —`,...this.splitText(StoryEngine.text(ev))],choices:[...base,...adapt].map(c=>({...c,onPick}))}}};
    if(chained&&this.el){ this.scene=scene; const L=this.LOCS[scene.loc]; this.el.style.background=L.bg; this.go('a'); }
    else this.open(scene,()=>UI.after());
  },

        {t:'"Haklılar, daha iyisini yapacağım."',tag:'pro',fx:{media:4,fanLove:2},react:'Olgun bir cevap. Teşekkürler.',sosyal:[['journalist',`{ad}, ${f.rakip} maçındaki ${r.puan} reytinglik performansı için özeleştiri yaptı: "Daha iyisini yapacağım."`,{mag:1.4}]]},
        {t:'"Beni eleştirenler önce top oynasın."',tag:'asi',fx:{media:-5,fanLove:3,morale:2},react:'Bunu manşete taşıyacaklar, haberin olsun.',mem:'eleştirmenlere sert çıkan',
          sosyal:[['journalist',`{ad} eleştirilere sert çıktı: "Beni eleştirenler önce top oynasın." ${f.rakip} maçında ${r.puan} almıştı.`,{mag:2}],['fan','Bu tavır mı şimdi? Önce sahada göster {ad}.',{mood:-1}]]},
        {t:'"Kötü gün herkesin başına gelir. Sonraki maç şov var!"',tag:'sov',fx:{media:2,fanLove:3},react:'Söz verdin, takipteyiz.',sosyal:[['journalist','{ad}: "Sonraki maç şov var!" Genç yıldız moralini bozmadı.',{mag:1.3}]]}]:[
        {t:'"Tek odağım {kulup}."',tag:'pro',fx:{fanLove:6,coachTrust:2},react:'Taraftar bunu duymak istiyordu.',sosyal:[['fan','"Tek odağım {kulup}" diyor {ad}. İşte bu! 💚',{mood:1}]]},
        {t:'"Telefonum susmuyor açıkçası 😉"',tag:'sov',fx:{media:6,fanLove:-4},run:s=>{s.story.flags.rumor=true;},react:'Bu cevap transfer piyasasını hareketlendirir.',mem:'transfer imaları yapan',
          sosyal:[['journalist','{ad}\'dan transfer iması: "Telefonum susmuyor." Kulüpler sırada mı? #TransferHaberleri',{mag:2.2}]]},
        {t:'"Bu başarı takım arkadaşlarımın."',tag:'lider',fx:{teamRel:6,media:2},react:'Alçakgönüllülük her zaman kazanır.',sosyal:[['teammate','Röportajda bizi unutmadığın için sağ ol kardeşim. 🤝']]}]}}};
    },
    menajer(s){
      const p=Transfer.pending();
      if(p.length) return {loc:'masa',nodes:{a:{who:'menajer',text:[`Masada ${p[0].club} teklifi var: haftalık ${U.eur(p[0].wage)}.`,'Nasıl oynayalım? Bu kozları iyi kullanmalıyız.'],choices:[
        {t:'Teklifi kulübe sızdır, pazarlık gücü olsun.',tag:'asi',fx:{agentRel:6,coachTrust:-3,media:3},react:'Hah! İşte benim oyuncum. Telefonları açıyorum.',run:s=>{s.story.flags.rumor=true; s.agentRel=U.clamp(s.agentRel+6,0,100);},
          sosyal:[['journalist',`Kulis: ${p[0].club}, {ad} için masada. Menajer Kerem Aydın görüşmeleri doğruladı. #TransferHaberleri`,{mag:2}]]},
        {t:'Kulübüme sadığım, dikkatimi dağıtma.',tag:'lider',fx:{fanLove:5},react:'Senin kararın... Ama bu fırsatlar her zaman gelmez.',run:s=>{s.agentRel=U.clamp(s.agentRel-6,0,100);}},
        {t:'Bana daha iyisini bul.',tag:'pro',fx:{},react:'Birkaç telefon açayım, bu hafta yeni bir teklif bekleyebilirsin.',run:s=>{s.agentRel=U.clamp(s.agentRel+3,0,100); Transfer.generate();}}]}}};
      return {loc:'masa',nodes:{a:{who:'menajer',text:['Kahven soğumadan imajın üzerine konuşalım.','Piyasa değerin '+U.eur(GameState.marketValue())+'. Daha yukarı çıkabiliriz.'],choices:[
        {t:'Röportaj ve reklam turu ayarla.',tag:'sov',fx:{media:6,energy:-6},react:'Kameralar seni seviyor, bunu paraya çevireceğiz.',run:s=>{s.agentRel=U.clamp(s.agentRel+4,0,100);},
          sosyal:[['journalist','{ad} bu hafta 3 farklı programa konuk olacak. Genç yıldız ekranları sallıyor.',{mag:1.5}]]},
        {t:'Odak sahada kalsın, magazin istemiyorum.',tag:'pro',fx:{coachTrust:3},react:'Peki... Ama bu kadar sessiz kalırsan pazarlıkta zorlanırız.',run:s=>{s.agentRel=U.clamp(s.agentRel-2,0,100);}},
        {t:'Kulübe baskı yap, maaş artışı istiyorum.',tag:'asi',fx:{coachTrust:-4,media:2},react:'Tam benim dilimden konuştun. Yönetim bu hafta beni duyacak.',mem:'maaş krizi yaşayan',run:s=>{s.agentRel=U.clamp(s.agentRel+6,0,100); s.story.flags.rumor=true;},
          sosyal:[['journalist','Menajer Kerem Aydın, {ad} için {kulup} yönetimiyle maaş görüşmesine başladı. Gerilim kapıda. #Kulis',{mag:1.6}]]}]}}};

<script>
/* =========================================================
   AŞAMA 8 – Market (anlık tüketim) & Kişisel Hayat (Yaşam sekmesi)
   Var olan modüller sarmalayıcılarla genişletilir; veri yapıları korunur.
========================================================= */
(function(){ const orig=GameState.ensure.bind(GameState);
  GameState.ensure=function(s=this.s){
    orig(s); if(!s) return s;
    s.inv=s.inv||{icecek:0,bar:0,kahve:0};
    s.drinks=s.drinks||{st:0,n:0};
    s.luxury=s.luxury||[];
    s.life=s.life||{calm:20,circle:0,done:{}};
    s.life.done=s.life.done||{};
    return s;
  }; })();

/* ---------- Market: hızlı tüketim ürünleri ---------- */
const Market = {
  ITEMS:[
    {id:'icecek',ad:'Enerji İçeceği',ikon:'zap',renk:'#ffc53d',price:400,energy:30,desc:'+30 enerji • Üst üste 2 hafta içilirse tolerans (+15) • Haftada 2\'den fazlası yan etki'},
    {id:'bar',ad:'Protein Bar',ikon:'cookie',renk:'#f97316',price:150,energy:15,desc:'+15 enerji • Yan etkisiz'},
    {id:'kahve',ad:'Kahve Shot',ikon:'coffee',renk:'#a16207',price:60,energy:10,desc:'+10 enerji • Yan etkisiz'}
  ],
  get(id){ return this.ITEMS.find(i=>i.id===id); },
  drinksThisWeek(){ const s=GameState.s; return s.drinks.st===U.stamp()?s.drinks.n:0; },
  buy(id,n=1){
    const s=GameState.s, it=this.get(id);
    if(s.money<it.price*n) return {ok:false,msg:`Yetersiz bakiye (${U.eur(it.price*n)}).`};
    s.money-=it.price*n; s.inv[id]+=n; return {ok:true};
  },
  use(id){
    const s=GameState.s, it=this.get(id);
    if(s.inv[id]<=0) return {ok:false,msg:'Stokta yok.'};
    if(s.energy>=100) return {ok:false,msg:'Enerjin zaten dolu.'};
    s.inv[id]--;
    const gain=this.gain?this.gain(id):it.energy;
    GameState.apply({energy:gain});
    const tolMsg=(id==='icecek'&&this.trackTolerance)?this.trackTolerance():null;
    let side=null;
    if(id==='icecek'){
      if(s.drinks.st!==U.stamp()) s.drinks={st:U.stamp(),n:0};
      s.drinks.n++;
      if(s.drinks.n>2){
        if(Math.random()<.5){ GameState.apply({form:-.5}); side='Yan etki: Form -0.5 (aşırı kafein, çarpıntı)'; }
        else { GameState.apply({attrs:{fizik:-.2}}); side='Yan etki: Fizik -0.2 (kas yorgunluğu)'; }
        GameState.log(`Bu hafta ${s.drinks.n}. enerji içeceği: ${side}`,'train');
        if(s.drinks.n===3) Social.post('journalist','Kulüp doktorlarının {ad} için enerji içeceği tüketimini sınırlandırdığı iddia ediliyor. #Sağlık',{mag:1.2});
      }
    }
    if(tolMsg) side=side?side+' • '+tolMsg:tolMsg;
    return {ok:true,side,energy:gain};
  },
  buyAndUse(id){ if(GameState.s.energy>=100) return {ok:false,msg:'Enerjin zaten dolu.'}; const b=this.buy(id); if(!b.ok) return b; return this.use(id); }
};

/* ---------- Kişisel hayat ---------- */
const Life = {
  EVENTS:[
    {id:'arkadas',ad:'Arkadaşlarla Dışarı Çık',ikon:'beer',cost:300,fx:{morale:6,media:2,energy:-10,teamRel:1},risk:.10,tag:'lider',desc:'Mahalle arkadaşlarınla eski günler.'},
    {id:'restoran',ad:'Lüks Restoranda Yemek',ikon:'utensils',cost:1500,fx:{morale:5,media:5,energy:-5},risk:.25,tag:'sov',desc:'Şehrin en pahalı masası, kameralar kapıda.'},
    {id:'kulup',ad:'Gece Kulübüne Git',ikon:'music',cost:2500,fx:{morale:10,media:7,energy:-25,coachTrust:-2},risk:.45,tag:'sov',desc:'Gecenin yıldızı sensin… ama sabah antrenman var.'}
  ],
  LUX:[
    {id:'kiyafet',ad:'Marka Kıyafet Koleksiyonu',ikon:'shirt',price:12000,media:.05,fan:.05,desc:'Medya +%5 • Taraftar +%5 kazanç'},
    {id:'saat',ad:'Lüks Saat',ikon:'watch',price:35000,media:.10,fan:0,desc:'Medya +%10 kazanç'},
    {id:'araba',ad:'Spor Araba',ikon:'car',price:80000,media:.15,fan:.08,desc:'Medya +%15 • Taraftar +%8 kazanç'}
  ],
  CIRCLE:['Yalnız','Küçük Arkadaş Grubu','Güvenilir Çevre','Sarsılmaz Destek Ağı'],
  CIRCLE_PCT:[0,.4,.7,1],
  mults(){ const s=GameState.s; let m=1,f=1; (s.luxury||[]).forEach(id=>{ const l=this.LUX.find(x=>x.id===id); if(l){ m+=l.media; f+=l.fan; } }); return {media:m,fan:f}; },
  doneThisWeek(id){ return GameState.s.life.done[id]===U.stamp(); },
  blocked(id,cost=0,energy=0){
    const s=GameState.s;
    if(this.doneThisWeek(id)) return 'Bu hafta yaptın';
    if(s.ap<=0) return 'Aksiyon hakkı yok';
    if(s.money<cost) return 'Yetersiz bakiye';
    if(energy&&s.energy<energy) return 'Enerjin yetmez';
    return null;
  },
  social(id){
    const s=GameState.s, e=this.EVENTS.find(x=>x.id===id), blk=this.blocked(id,e.cost,-e.fx.energy);
    if(blk) return {ok:false,msg:blk};
    s.ap--; s.money-=e.cost; s.life.done[id]=U.stamp();
    GameState.apply(e.fx); Persona.add(e.tag);
    GameState.log(`Sosyal hayat: ${e.ad}`,'story');
    let papa=false;
    if(Math.random()<e.risk){
      papa=true;
      if(id==='kulup'&&!s.story.pending){ s.story.flags.parti=true; StoryEngine.force('paparazzi'); StoryEngine.weekly(true); }
      else if(id==='restoran'){ Social.post('journalist','{ad} şehrin en lüks restoranında görüntülendi. Hesap tam '+U.eur(e.cost)+'! #Magazin',{mag:1.8}); GameState.apply({media:2,fanLove:-2}); Social.remember('lüks hayatıyla magazinde olan'); }
      else { Social.post('fan','{ad}\'ı mahallede arkadaşlarıyla gördüm, çok mütevazı adam. 💚',{mood:1}); GameState.apply({fanLove:3}); }
    }
    if(!papa&&id!=='arkadas') Social.post('me',id==='kulup'?'Güzel gece. 🎶 Pazartesi sahadayız.':'Güzel yemek, güzel sohbet. 🍽️',{mag:1.1});
    return {ok:true,papa,e};
  },
  buyLux(id){
    const s=GameState.s, l=this.LUX.find(x=>x.id===id);
    if(s.luxury.includes(id)) return {ok:false,msg:'Zaten sahipsin.'};
    if(s.money<l.price) return {ok:false,msg:`Yetersiz bakiye (${U.eur(l.price)}).`};
    s.money-=l.price; s.luxury.push(id); Persona.add('sov');
    GameState.apply({media:3});
    Social.post('me',{araba:'Yeni oyuncak garajda. 🏎️',saat:'Zaman değerlidir. ⌚',kiyafet:'Yeni sezon, yeni stil. 🔥'}[id],{mag:2});
    Social.post('fan',s.fanLove<40||s.form<6?`Takım puan kaybederken ${l.ad.toLowerCase()} paylaşmak... Önceliklerin yanlış {ad}.`:`${l.ad} {ad}\'a çok yakışmış! Başarının ödülü. 👑`,{mood:s.fanLove<40?-1:1});
    GameState.log(`Lüks harcama: ${l.ad}`,'transfer');
    return {ok:true,l};
  },
  family(){
    const s=GameState.s, blk=this.blocked('aile',200); if(blk) return {ok:false,msg:blk};
    s.ap--; s.money-=200; s.life.done.aile=U.stamp();
    s.life.calm=U.clamp(s.life.calm+8,0,100);
    GameState.apply({morale:8,energy:10}); Persona.add('pro');
    if(Math.random()<.4) Social.post('me','Annemin yemekleri gibisi yok. Ailem her şeyim. ❤️',{mag:1.6});
    GameState.log('Aileni ziyaret ettin. Soğukkanlılık arttı.','rest');
    return {ok:true};
  },
  circleCost(){ return [1500,4000,9000][GameState.s.life.circle]||0; },
  buildCircle(){
    const s=GameState.s;
    if(s.life.circle>=3) return {ok:false,msg:'Çevren zaten en üst seviyede.'};
    const cost=this.circleCost(), blk=this.blocked('cevre',cost); if(blk) return {ok:false,msg:blk};
    s.ap--; s.money-=cost; s.life.done.cevre=U.stamp(); s.life.circle++;
    GameState.apply({morale:4}); Persona.add('lider');
    GameState.log(`Sosyal çevren büyüdü: ${this.CIRCLE[s.life.circle]}`,'rest');
    return {ok:true};
  }
};

/* --- Lüks çarpanları: pozitif Medya / Taraftar kazançlarını büyütür --- */
(function(){ const orig=GameState.apply.bind(GameState);
  GameState.apply=function(fx={}){
    const s=this.s;
    if(s&&s.luxury&&s.luxury.length){ const m=Life.mults(); fx={...fx}; if(fx.media>0) fx.media*=m.media; if(fx.fanLove>0) fx.fanLove*=m.fan; }
    return orig(fx);
  }; })();

/* --- Haftalık döngü: sosyal çevre kötü maç moral düşüşünü emer, soğukkanlılık yavaşça azalır --- */
(function(){ const orig=Career.afterMatch.bind(Career);
  Career.afterMatch=function(f,r){
    const s=GameState.s; GameState.ensure(s);
    const m0=s.morale, w=s.week;
    const out=orig(f,r);
    if(r.played&&s.morale<m0){
      const pct=Life.CIRCLE_PCT[s.life.circle]||0, back=Math.round((m0-s.morale)*pct);
      if(back>0){ s.morale=U.clamp(s.morale+back,0,100); GameState.log(`Sosyal çevren moralini topladı (+${back} moral).`,'rest'); }
    }
    if(s.week!==w) s.life.calm=U.clamp(s.life.calm-2,0,100);
    return out;
  }; })();
</script>

<script>

/* ---------- veri varsayılanları ---------- */
(function(){ const orig=GameState.ensure.bind(GameState);

/* =========================================================

Object.assign(CinemaEngine,{
  MOODS:{ofke:{ad:'Öfkeli',renk:'#ff3d81',ikon:'flame'},ciddi:{ad:'Ciddi',renk:'#94a3b8',ikon:'meh'},
         gurur:{ad:'Gururlu',renk:'#ffc53d',ikon:'award'},neseli:{ad:'Neşeli',renk:'#4ade80',ikon:'laugh'}},
  STORY_MOOD:{ilk_gun:'neseli',yeni_kulup:'gurur',hoca_elestiri:'ofke',kadro_disi:'ofke',menajer_devrede:'ciddi',taraftar_tepki:'ofke',
    taraftar_destek:'gurur',baskan_ultimatom:'ciddi',basin_toplantisi:'neseli',soz_tuttu:'gurur',soz_tutmadi:'ofke',parti:'neseli',
    paparazzi:'ciddi',kaptan_uyari:'ciddi',soyunma_krizi:'ofke',rakip_laf:'ofke',kapisma_zafer:'neseli',kapisma_yenilgi:'ofke',
    yedek_isyan:'ciddi',milli:'gurur',sokak_viral:'neseli',menajer_ajans:'neseli',sponsor:'neseli',hayir:'ciddi',kulup_reddetti:'ciddi',
    kulup_pes_etti:'ciddi',rest_basarisiz:'ofke',sozlesme_bitti:'ciddi'},
  LOC_CARD:{tesis:'Antrenman Tesislerinde...',soyunma:'Soyunma Odasında...',basin:'Basın Salonunda...',masa:'Transfer Masasında...',
    tribun:'Stadyumun Önünde...',gece:'Gece Yarısı, Kulüp Çıkışında...',telefon:'Telefon Ekranında...',sokak:'Sokak Arenasında...',ev:'Evde, Sakin Bir Akşam...',baskan:'Başkanın Odasında...'},
  REL_KEY:{hoca:'coachTrust',baskan:'coachTrust',direktor:'coachTrust',kaptan:'teamRel',basin:'media',menajer:'media',taraftar:'fanLove',rakip:'media',partner:'morale'},

  who(id,ov){
    const base={...(this.CHARS[id]||this.CHARS.genel),...(ov||{})}, out={};
    for(const k in base) out[k]=typeof base[k]==='function'?base[k]():base[k];

  },
  moodFor(who,fx={}){
    const v=fx[this.REL_KEY[who]||'morale']||0;
    return v<=-3?'ofke':v>=6?'gurur':v>0?'neseli':'ciddi';
  },
  face(c,mood){
    const r=c.renk, F={
      ofke:`<path d="M68 72 L92 82" stroke="${r}" stroke-width="5" stroke-linecap="round"/><path d="M132 72 L108 82" stroke="${r}" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="82" cy="92" rx="5" ry="3" fill="${r}"/><ellipse cx="118" cy="92" rx="5" ry="3" fill="${r}"/><path d="M84 120 Q100 108 116 120" stroke="${r}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
      ciddi:`<path d="M70 79 L92 79" stroke="${r}" stroke-width="4" stroke-linecap="round"/><path d="M108 79 L130 79" stroke="${r}" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="82" cy="92" rx="5" ry="4.5" fill="${r}"/><ellipse cx="118" cy="92" rx="5" ry="4.5" fill="${r}"/><path d="M88 116 L112 116" stroke="${r}" stroke-width="4" stroke-linecap="round"/>`,
      gurur:`<path d="M70 78 Q81 70 92 76" stroke="${r}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M108 76 Q119 70 130 78" stroke="${r}" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M77 93 Q82 89 87 93" stroke="${r}" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M113 93 Q118 89 123 93" stroke="${r}" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M86 113 Q100 122 114 113" stroke="${r}" stroke-width="4" fill="none" stroke-linecap="round"/>`,

    };
    return F[mood]||F.ciddi;
  },
  bust(c,mood='ciddi'){
    const r=c.renk, dark='#0b0f1a', M=this.MOODS[mood]||this.MOODS.ciddi;
    const acc={cap:`<path d="M58 66 Q100 30 142 66 L146 76 L54 76 Z" fill="${r}" opacity=".9"/><rect x="48" y="72" width="70" height="7" rx="3" fill="${r}"/>`,
      tie:`<path d="M100 158 L90 172 L100 224 L110 172 Z" fill="${r}"/>`,
      band:`<rect x="138" y="176" width="26" height="14" rx="3" fill="${r}" transform="rotate(-12 150 183)"/>`,

      scarf:`<path d="M62 160 Q100 182 138 160 L134 176 Q100 196 66 176 Z" fill="${r}"/>`,
      glam:`<path d="M54 70 Q100 20 146 70 Q150 110 140 140 L132 100 Q100 60 68 100 L60 140 Q50 110 54 70Z" fill="${r}" opacity=".55"/><rect x="66" y="60" width="68" height="10" rx="5" fill="#0b0f1a" stroke="${r}" stroke-width="2"/>`,
      pearl:`<path d="M56 72 Q100 28 144 72 L146 120 Q140 96 132 84 Q100 58 68 84 Q60 96 54 120 Z" fill="${r}" opacity=".45"/><circle cx="58" cy="104" r="4" fill="#fde68a"/><circle cx="142" cy="104" r="4" fill="#fde68a"/>`}[c.acc]||'';
    return `<svg viewBox="0 0 200 240" class="w-full h-full" style="filter:drop-shadow(0 0 26px ${M.renk}55)">

  open(scene,onEnd){
    this.close(true);
    this.scene=scene; this.onEnd=onEnd||null;
    const L=this.LOCS[scene.loc]||this.LOCS.tesis, s=GameState.s;
    this.el=document.createElement('div');
    this.el.className='fixed inset-0 z-[80] overflow-hidden select-none';
    this.el.style.cssText+=`background:${L.bg};height:100dvh;transition:background .6s ease, opacity .3s ease`;

      <div id="cnDeco">${this.decoHtml(scene.loc)}</div>

      <div class="absolute top-[8.5vh] left-4 z-20 fade-in">

      </div>
