  /* ---------- Phaser sahnesi: SAF HAREKET KONTROLÜ (tek çizgi sistemi) ----------
     Zaman durur → parmağınla rota çizersin → bırakınca oyun niyeti otomatik okur:
       • Çizgi ucu takım arkadaşında  → PAS
       • Çizgi ucu ceza sahasında/kalede → ŞUT
       • Diğer her yer               → TOPLA KOŞU (rota boyunca dripling)
     Çizginin kavisi = falso. Uzunluğu = güç. */
  makeScene(){
    const E=this, W=E.W, H=E.H, street=E.cfg.mode==='street', G=E.goal();
    const rnd=U.rnd, gauss=U.gauss, dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    const TRAIL={roket:0xff7a3d,falso:0xa993ff,vision:0x18b6ff};
    const INTENT={pas:{c:0x18b6ff,t:'PAS'},sut:{c:0xff3d81,t:'ŞUT'},kosu:{c:0x22f5c9,t:'KOŞU'}};
    const BOX=street?{x1:150,x2:390,y2:G.y+140}:{x1:80,x2:460,y2:G.y+230};
    const MAX_ACT=E.cfg.maxAct||(street?6:7), RUN_MAX=240, BALL_FR=.62;
    const HB={x:W-74,y:H-104,r:46};   // NSS vuruş noktası topu (frikik)
    const sim=(o,dt)=>{
      const a=o.spin*dt, cs=Math.cos(a), sn=Math.sin(a), fr=Math.pow(BALL_FR,dt);
      const vx=o.vx*cs-o.vy*sn, vy=o.vx*sn+o.vy*cs;
      o.vx=vx*fr; o.vy=vy*fr; o.spin*=Math.pow(.55,dt); o.x+=o.vx*dt; o.y+=o.vy*dt;
    };

    return class MatchScene extends Phaser.Scene{
      constructor(){ super('match'); }

      create(){
        E.scene=this;
        street?this.drawStreet():this.drawPitch();
        this.makeBallTex();
        this.physics.world.setBounds(10,G.y+6,W-20,H-G.y-14);
        this.A=this.physics.add.group(); this.D=this.physics.add.group();
        this.physics.add.collider(this.A,this.D);
        this.physics.add.collider(this.D,this.D);
        this.dyn=[]; this.tp=[];
        this.freezeG=this.add.graphics().setDepth(4);
        this.ringG=this.add.graphics().setDepth(6);
        this.fx=this.add.graphics().setDepth(9);
        this.lineG=this.add.graphics().setDepth(30);
        this.dotG=this.add.graphics().setDepth(45);
        this.shadow=this.add.ellipse(0,0,18,8,0x000000,.35).setDepth(9);
        this.ball=this.physics.add.image(W/2,H/2,'mBall').setDepth(11);
        this.ball.body.setCircle(10); this.ball.body.setAllowGravity(false);
        this.keeper=this.add.container(W/2,E.KEEPER_Y,[
          this.add.rectangle(0,0,46,14,0xffc53d).setStrokeStyle(2,0x000000,.35),
          this.add.circle(0,0,9,0xffe08a).setStrokeStyle(2,0x000000,.35)]).setDepth(8).setVisible(!street);
        this.intentTxt=this.add.text(0,0,'',{fontFamily:'Rajdhani, sans-serif',fontSize:'18px',fontStyle:'bold',color:'#ffffff'}).setOrigin(.5).setDepth(46).setStroke('#05070d',5).setVisible(false);
        this.hintTxt=this.add.text(W/2,H-60,'Parmağınla rotayı çiz',{fontFamily:'Rajdhani, sans-serif',fontSize:'22px',fontStyle:'bold',color:'#ffffff'}).setOrigin(.5).setDepth(46).setAlpha(.55);
        this.tweens.add({targets:this.hintTxt,alpha:.2,duration:900,yoyo:true,repeat:-1});
        this.drawPts=null; this.state='init'; this.visionUsed=false;
        this.hitG=this.add.graphics().setDepth(47); this.confG=this.add.graphics().setDepth(44); this.conf=[];
        this.hitTxt=this.add.text(HB.x,HB.y-HB.r-14,'',{fontFamily:'Rajdhani, sans-serif',fontSize:'13px',fontStyle:'bold',color:'#ffffff'}).setOrigin(.5).setDepth(48).setStroke('#05070d',4).setVisible(false);
        this.input.on('pointerdown',this.onDown,this);
        this.input.on('pointermove',this.onMove,this);
        this.input.on('pointerup',this.onUp,this);
        this.input.on('pointerupoutside',this.onUp,this);
        E.hud(); this.setup();
      }

      /* ----- saha çizimleri ----- */
      drawPitch(){
        const g=this.add.graphics();
        for(let i=0;i<12;i++){ g.fillStyle(i%2?0x0f5a2b:0x116630,1); g.fillRect(0,i*75,W,75); }
        g.fillStyle(0x07160d,1); g.fillRect(0,0,W,G.y);
        for(let i=0;i<260;i++){ g.fillStyle(Phaser.Display.Color.HSVToRGB(Math.random(),.5,.5+Math.random()*.4).color,.8); g.fillCircle(rnd(0,W),rnd(2,G.y-G.depth-4),rnd(1.5,2.8)); }
        g.fillStyle(0x22f5c9,.18); g.fillRect(0,G.y-G.depth-4,W,3);
        g.lineStyle(3,0xffffff,.7);
        g.lineBetween(0,G.y,W,G.y);
        g.strokeRect(80,G.y,380,230); g.strokeRect(175,G.y,190,80);
        g.fillStyle(0xffffff,.8); g.fillCircle(W/2,G.y+165,4);
        g.beginPath(); g.arc(W/2,G.y+165,75,Phaser.Math.DegToRad(60),Phaser.Math.DegToRad(120),false); g.strokePath();
        g.beginPath(); g.arc(W/2,H+40,110,Phaser.Math.DegToRad(200),Phaser.Math.DegToRad(340),false); g.strokePath();
        this.drawGoal(g);
      }
      drawStreet(){
        const g=this.add.graphics();
        g.fillStyle(0x15171d,1); g.fillRect(0,0,W,H);
        for(let i=0;i<500;i++){ g.fillStyle(0xffffff,Math.random()*.05); g.fillRect(rnd(0,W),rnd(0,H),rnd(1,3),rnd(1,3)); }
        g.fillStyle(0x0b0d12,1); g.fillRect(0,0,W,G.y);
        g.lineStyle(1,0x8892a6,.18);
        for(let x=-H;x<W;x+=18){ g.lineBetween(x,0,x+G.y,G.y); g.lineBetween(x+G.y,0,x,G.y); }
        g.lineStyle(1,0x8892a6,.12);
        for(let y=G.y;y<H;y+=18){ g.lineBetween(0,y,14,y+14); g.lineBetween(W,y,W-14,y+14); }
        g.lineStyle(3,0xff3d81,.85); g.lineBetween(0,G.y,W,G.y);
        g.lineStyle(3,0x22f5c9,.6); g.strokeRect(150,G.y,240,140);
        g.lineStyle(2,0xa993ff,.5); g.strokeCircle(W/2,H-40,90);
        this.add.text(W/2,H*.55,'KAFES',{fontFamily:'Rajdhani, sans-serif',fontSize:'110px',fontStyle:'bold',color:'#ff3d81'}).setOrigin(.5).setAlpha(.06).setAngle(-8);
        this.drawGoal(g);
      }
      drawGoal(g){
        g.fillStyle(0xffffff,.06); g.fillRect(G.x1,G.y-G.depth,G.x2-G.x1,G.depth);
        g.lineStyle(1,0xffffff,.22);
        for(let x=G.x1;x<=G.x2;x+=10) g.lineBetween(x,G.y-G.depth,x,G.y);
        for(let y=G.y-G.depth;y<=G.y;y+=8) g.lineBetween(G.x1,y,G.x2,y);
        g.lineStyle(6,0xffffff,1);
        g.lineBetween(G.x1,G.y-G.depth,G.x1,G.y); g.lineBetween(G.x2,G.y-G.depth,G.x2,G.y); g.lineBetween(G.x1,G.y-G.depth,G.x2,G.y-G.depth);
        g.lineStyle(2,street?0xff3d81:0x22f5c9,.9); g.lineBetween(G.x1,G.y,G.x2,G.y);
      }
      makeBallTex(){
        if(this.textures.exists('mBall')) return;
        const t=this.make.graphics({},false);
        t.fillStyle(0xffffff,1).fillCircle(10,10,9);
        t.fillStyle(0x111111,1).fillCircle(10,10,3).fillCircle(4,7,2).fillCircle(16,7,2).fillCircle(7,16,2).fillCircle(14,16,2);
        t.lineStyle(1,0x000000,.4).strokeCircle(10,10,9);
        t.generateTexture('mBall',20,20); t.destroy();
      }

      /* ----- oyuncular ----- */
      mkPlayer(x,y,color,label,team){
        const p=this.add.circle(x,y,14,color).setStrokeStyle(3,0xffffff,.85).setDepth(7);
        (team==='A'?this.A:this.D).add(p);
        p.body.setCircle(14); p.body.setCollideWorldBounds(true); p.body.setBounce(.2);
        p.sh=this.add.ellipse(x+2,y+6,30,12,0x000000,.3).setDepth(5);
        p.lbl=this.add.text(x,y,label||'',{fontFamily:'Rajdhani, sans-serif',fontSize:'11px',fontStyle:'bold',color:team==='A'?'#04110e':'#ffffff'}).setOrigin(.5).setDepth(8);
        p.team=team; p.face=-Math.PI/2; p.cd=0; p.stun=0; p.tried=false; p.isMe=false; p.lane=undefined; p.role=null; p.mark=null; p.react=1; p.attr={sut:60,pas:60,dribling:58};
        this.dyn.push(p.sh,p.lbl);
        return p;
      }

      setup(){
        const c=E.ctx, type=c.plan[c.idx], d=c.d, P=GameState.s.player.attrs;
        this.A.clear(true,true); this.D.clear(true,true);
        this.dyn.forEach(o=>o.destroy()); this.dyn=[];
        if(this.banner){ this.banner.destroy(); this.banner=null; }
        this.fx.clear(); this.lineG.clear(); this.tp=[]; this.drawPts=null; this.intentTxt.setVisible(false);
        this.owner=null; this.lastKick=null; this.lastKicker=null; this.kickTime=0; this.route=null;
        this.shot=null; this.spin=0; this.frozen=false; this.recvR=20; this.goalBall=false; this.kTarget=null; this.looseT=0;
        this.actions=0; this.type=type; this.isKey=false; this.power=false; this.lift=0; this.overBar=false; this.snap=null;
        if(this.clearRw) this.clearRw();
        if(type==='frikik'){ this.setupFreeKick(); return; }
        const deep=type==='pas'&&!street;
        const mx=rnd(150,390), my=deep?rnd(600,670):street?rnd(470,540):rnd(430,520);
        this.me=this.mkPlayer(mx,my,0x22f5c9,'SEN','A'); this.me.isMe=true;
        const buff=(window.Legacy&&Legacy.matchBuff)?Legacy.matchBuff():0;
        this.me.spd=150+P.hiz*1.3; this.me.attr={sut:P.sut+buff,pas:P.pas+buff,dribling:P.dribling+buff};
        this.mates=[];
        const nm=street?1:(deep?2:1+(Math.random()<.5?1:0));
        const lanes=nm===1?[mx<W/2?rnd(330,420):rnd(120,210)]:[rnd(100,180),rnd(360,440)];
        lanes.forEach((lx,i)=>{
          const m=this.mkPlayer(lx,my-rnd(110,190),0x18b6ff,street?'EKİP':['9','10'][i],'A');
          m.lane=lx; m.spd=165+d*10; m.attr={sut:60+d*10,pas:60,dribling:58}; this.mates.push(m);
        });
        this.attackers=[this.me,...this.mates];
        this.defs=[];
        const nd=street?2:2+(d>.45?1:0)+(deep?1:0);
        for(let i=0;i<nd;i++){
          const t=(i+1)/(nd+1);
          const dx=Phaser.Math.Linear(70,W-70,t)+rnd(-25,25), dy=Phaser.Math.Linear(my-90,G.y+70,rnd(.25,.7));
          const df=this.mkPlayer(dx,dy,street?0xf97316:0xff3d81,'','D');
          df.spd=118+d*95; df.react=rnd(.7,1.1); this.defs.push(df);
        }
        this.keeper.setPosition(W/2,E.KEEPER_Y).setScale(1);
        this.state='prep'; this.drawDots();
        this.give(this.me);
        this.cameras.main.flash(180,0,0,0);
        this.afterSetup();
        E.hud();
      }

      /* ===== AŞAMA 10: frikik (NSS vuruş noktası), kilit an, geri sar, konfeti ===== */
      setupFreeKick(){
        const P=GameState.s.player.attrs, buff=(window.Legacy&&Legacy.matchBuff)?Legacy.matchBuff():0;
        const bx=rnd(170,370), by=rnd(330,400);
        const ang=Math.atan2(G.y-by,W/2-bx);
        this.me=this.mkPlayer(bx-Math.cos(ang)*20,by-Math.sin(ang)*20,0x22f5c9,'SEN','A'); this.me.isMe=true; this.me.spd=0; this.me.face=ang;
        this.me.attr={sut:P.sut+buff,pas:P.pas+buff,dribling:P.dribling+buff};
        this.mates=[]; this.attackers=[this.me]; this.defs=[];
        const wx=bx+Math.cos(ang)*82, wy=by+Math.sin(ang)*82, px=-Math.sin(ang), py=Math.cos(ang);
        for(let i=-1;i<=1;i++){ const df=this.mkPlayer(wx+px*i*29,wy+py*i*29,0xff3d81,'','D'); df.spd=0; df.wall=true; this.defs.push(df); }
        this.keeper.setPosition(W/2,E.KEEPER_Y).setScale(1);
        this.hit={x:0,y:0};
        this.state='prep'; this.drawDots();
        this.owner=this.me; this.control=this.me;
        this.freeze();
        this.ball.body.reset(bx,by);
        this.popText(W/2,H*.5,'SERBEST VURUŞ','#ffc53d');
        this.afterSetup();
        E.hud();
      }
      afterSetup(){
        const c=E.ctx;
        this.drawHit();
        this.isKey=c.keyIdx===c.idx&&this.cfgKeyOk!==false;
        if(this.isKey){
          const t=this.add.text(W/2,H*.36,'KİLİT AN!',{fontFamily:'Rajdhani, sans-serif',fontSize:'64px',fontStyle:'bold',color:'#ff3d81'}).setOrigin(.5).setDepth(46).setStroke('#05070d',8).setShadow(0,0,'#ff3d81',24,true,true);
          const t2=this.add.text(W/2,H*.36+48,c.mins[c.idx]+"' • Maçın kaderi senin ayağında",{fontFamily:'Inter, sans-serif',fontSize:'16px',color:'#ffffff'}).setOrigin(.5).setDepth(46).setStroke('#05070d',4);
          this.cameras.main.shake(260,.006);
          this.tweens.add({targets:[t,t2],alpha:0,delay:1700,duration:600,onComplete:()=>{t.destroy();t2.destroy();}});
          this.drawFreeze();
        }
        if(c.idx===0&&c.stars&&!this.starsShown){
          this.starsShown=true;
          const lines=c.stars.map(id=>'★  '+((window.Stars&&Stars.POOL[id])?Stars.POOL[id].ad:id)).join('\n');
          const bg=this.add.rectangle(W/2,H*.62,W-80,150,0x05070d,.82).setStrokeStyle(2,0xffd700,.7).setDepth(45);
          const hd=this.add.text(W/2,H*.62-52,'MAÇ HEDEFLERİ',{fontFamily:'Rajdhani, sans-serif',fontSize:'20px',fontStyle:'bold',color:'#ffd700'}).setOrigin(.5).setDepth(46);
          const tx=this.add.text(W/2,H*.62+12,lines,{fontFamily:'Inter, sans-serif',fontSize:'17px',color:'#ffffff',align:'center',lineSpacing:8}).setOrigin(.5).setDepth(46);
          this.tweens.add({targets:[bg,hd,tx],alpha:0,delay:3200,duration:700,onComplete:()=>{bg.destroy();hd.destroy();tx.destroy();}});
        }
        if(c.idx===0&&!this.buffShown&&window.Legacy&&Legacy.buffText&&Legacy.buffText()){ this.buffShown=true; this.popText(W/2,H*.8,Legacy.buffText(),Legacy.matchBuff()>0?'#f472b6':'#ff3d81'); }
      }
      drawHit(){
        const g=this.hitG; g.clear();
        if(this.type!=='frikik'||this.state==='done'){ this.hitTxt.setVisible(false); return; }
        const cx=HB.x, cy=HB.y, r=HB.r;
        g.fillStyle(0x000000,.4).fillCircle(cx+5,cy+7,r);
        g.fillStyle(0x9ca3af,1).fillCircle(cx,cy,r);
        g.fillStyle(0xe5e7eb,1).fillCircle(cx-r*.08,cy-r*.1,r*.9);
        g.fillStyle(0xffffff,1).fillCircle(cx-r*.18,cy-r*.22,r*.66);
        g.fillStyle(0x111827,.92).fillCircle(cx,cy,r*.22);
        for(let i=0;i<5;i++){ const a=-Math.PI/2+i*Math.PI*2/5; g.fillStyle(0x111827,.85).fillCircle(cx+Math.cos(a)*r*.66,cy+Math.sin(a)*r*.66,r*.15); }
        g.fillStyle(0xffffff,.8).fillCircle(cx-r*.42,cy-r*.45,r*.12);
        g.lineStyle(2,0x22f5c9,.9).strokeCircle(cx,cy,r);
        const hx=cx+this.hit.x*r*.85, hy=cy+this.hit.y*r*.85;
        g.lineStyle(3,0xff3d81,1).strokeCircle(hx,hy,8); g.lineBetween(hx-13,hy,hx+13,hy); g.lineBetween(hx,hy-13,hx,hy+13);
        const side=this.hit.x<-.2?'Sağa falso':this.hit.x>.2?'Sola falso':'Düz vuruş', up=this.hit.y>.35?'yüksek (baraj üstü)':this.hit.y<-.35?'alçak & sert':'orta yükseklik';
        this.hitTxt.setText('VURUŞ NOKTASI • '+side+' • '+up).setPosition(Math.min(HB.x,W-150),HB.y-HB.r-14).setVisible(true);
      }
      takeSnap(){
        return {players:[...this.attackers,...this.defs].map(p=>({p,x:p.x,y:p.y,face:p.face})),owner:this.owner,actions:this.actions,
          kx:this.keeper.x,ky:this.keeper.y,visionUsed:this.visionUsed,charges:{...E.ctx.charges},bx:this.ball.x,by:this.ball.y};
      }
      offerRewind(code){
        this.state='rewind'; this.lineG.clear(); this.intentTxt.setVisible(false);
        [...this.attackers,...this.defs].forEach(p=>p.body.setVelocity(0,0)); this.ball.body.setVelocity(0,0);
        const R=E.RES[code];
        this.rwTxt=this.add.text(W/2,H*.38,R.t,{fontFamily:'Rajdhani, sans-serif',fontSize:'46px',fontStyle:'bold',color:R.renk}).setOrigin(.5).setDepth(41).setStroke('#05070d',8);
        this.rwBtn=this.add.text(W/2,H*.5,'⟲  GERİ SAR  ('+E.ctx.rewinds+')',{fontFamily:'Rajdhani, sans-serif',fontSize:'34px',fontStyle:'bold',color:'#05070d',backgroundColor:'#22f5c9',padding:{x:18,y:8}}).setOrigin(.5).setDepth(42);
        this.rwSub=this.add.text(W/2,H*.5+48,'Geri sarmak için ekrana dokun • 3 sn',{fontFamily:'Inter, sans-serif',fontSize:'14px',color:'#ffffff'}).setOrigin(.5).setDepth(42).setStroke('#05070d',4);
        this.tweens.add({targets:this.rwBtn,scale:1.08,duration:420,yoyo:true,repeat:-1});
        this.cameras.main.flash(120,255,61,129);
        this.time.delayedCall(3000,()=>{ if(this.state==='rewind'){ this.clearRw(); this.state='play'; this.finalize(code); } });
      }
      clearRw(){ [this.rwTxt,this.rwBtn,this.rwSub].forEach(o=>{ if(o){ this.tweens.killTweensOf(o); o.destroy(); } }); this.rwTxt=this.rwBtn=this.rwSub=null; }
      doRewind(){
        if(this.state!=='rewind'||!this.snap) return;
        this.clearRw(); const S=this.snap, c=E.ctx;
        c.rewinds--; c.rewindUsed=(c.rewindUsed||0)+1;
        S.players.forEach(o=>{ if(o.p.body){ o.p.body.reset(o.x,o.y); o.p.face=o.face; } });
        this.keeper.setPosition(S.kx,S.ky); this.keeper.scaleX=1;
        Object.assign(c.charges,S.charges); this.visionUsed=S.visionUsed; this.frozen=false; this.recvR=20;
        this.actions=S.actions; this.shot=null; this.power=false; this.lift=0; this.overBar=false; this.spin=0;
        this.lastKick=null; this.lastKicker=null; this.kTarget=null; this.looseT=0; this.goalBall=false;
        this.defs.forEach(d=>d.tried=false); this.tp=[]; this.fx.clear();
        this.owner=S.owner; this.control=S.owner;
        this.state='prep';
        this.cameras.main.flash(260,169,147,255);
        this.popText(W/2,H*.45,'⟲ GERİ SARILDI','#a993ff');
        this.freeze();
        if(this.type==='frikik') this.ball.body.reset(S.bx,S.by);
        this.drawDots(); this.drawHit();
      }
      spawnConfetti(){
        const cols=[0xffd700,0xffe48a,0x22f5c9,0xff3d81,0xffffff,0x7c5cff];
        for(let i=0;i<110;i++) this.conf.push({x:rnd(0,W),y:rnd(-260,-10),vx:rnd(-50,50),vy:rnd(140,300),r:rnd(0,6.28),vr:rnd(-7,7),c:U.pick(cols),w:rnd(5,10),h:rnd(3,6)});
      }
      updateConf(dt){
        const g=this.confG; g.clear(); if(!this.conf.length) return;
        this.conf.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; g.fillStyle(p.c,1).fillRect(p.x,p.y,p.w*Math.abs(Math.cos(p.r))+1,p.h); });
        this.conf=this.conf.filter(p=>p.y<H+20);
      }

      give(p){
        this.owner=p; this.control=p; this.ball.body.reset(p.x,p.y-16);
        this.freeze();
      }

      /* ----- zaman: dondur / akıt ----- */
      freeze(){
        if(this.state==='done'||this.state==='over') return;
        if(this.actions>=MAX_ACT){ this.state='play'; return this.end('SURE'); }
        this.state='aim'; this.route=null;
        [...this.attackers,...this.defs].forEach(p=>p.body.setVelocity(0,0));
        this.ball.body.setVelocity(0,0);
        if(this.owner) this.ball.body.reset(this.owner.x+Math.cos(this.owner.face)*17,this.owner.y+Math.sin(this.owner.face)*17);
        this.cameras.main.flash(90,255,255,255);
        this.snap=this.takeSnap?this.takeSnap():null;
        this.drawFreeze();
      }
      drawFreeze(){
        const g=this.freezeG; g.clear();
        if(this.state!=='aim'&&this.state!=='drawing') return;
        g.fillStyle(0x05070d,.28).fillRect(0,G.y,W,H-G.y);
        if(this.isKey){ g.lineStyle(10,0xff3d81,.35).strokeRect(5,G.y+5,W-10,H-G.y-10); }
      }

      /* ----- çizim girişi (dokunmatik + fare aynı) ----- */
      onDown(p){
        if(this.state==='rewind'){ this.doRewind(); return; }
        if(this.type==='frikik'&&this.state==='aim'&&Math.hypot(p.x-HB.x,p.y-HB.y)<HB.r+8){
          let hx=(p.x-HB.x)/HB.r, hy=(p.y-HB.y)/HB.r; const l=Math.hypot(hx,hy); if(l>1){ hx/=l; hy/=l; }
          this.hit={x:hx,y:hy}; this.drawHit(); return;
        }
        if(this.state!=='aim'||!this.owner) return;
        this.drawT0=this.time.now;
        this.state='drawing';
        this.drawPts=[{x:this.owner.x,y:this.owner.y},{x:p.x,y:p.y}];
        if(this.hintTxt.visible){ this.tweens.killTweensOf(this.hintTxt); this.hintTxt.setVisible(false); }
        this.renderLine();
      }
      onMove(p){
        if(this.state!=='drawing') return;
        const l=this.drawPts[this.drawPts.length-1];
        if(Math.hypot(p.x-l.x,p.y-l.y)<5) return;
        this.drawPts.push({x:p.x,y:p.y}); this.renderLine();
      }
      onUp(){
        if(this.state!=='drawing') return;
        const pts=this.drawPts; this.drawPts=null; this.lineG.clear(); this.intentTxt.setVisible(false);
        const I=this.classify(pts);
        if(!I){ this.state='aim'; return; }
        this.actions++;
        this.freezeG.clear();
        if(I.kind==='kosu') this.startRun(pts);
        else this.kick(I,pts);
        this.drawDots();
      }

      pathLen(pts){ let L=0; for(let i=1;i<pts.length;i++) L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); return L; }
      bulge(pts){
        const s0=pts[0], e=pts[pts.length-1], dx=e.x-s0.x, dy=e.y-s0.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
        let b=0; pts.forEach(p=>{ const cr=ux*(p.y-s0.y)-uy*(p.x-s0.x); if(Math.abs(cr)>Math.abs(b)) b=cr; });
        return {ratio:Phaser.Math.Clamp(b/len,-.45,.45),len,ang:Math.atan2(dy,dx)};
      }
      // Niyet okuma: pas / şut / koşu
      classify(pts){
        if(!pts||pts.length<2) return null;
        const L=this.pathLen(pts); if(L<28) return null;
        if(this.type==='frikik') return {kind:'sut'};
        const e=pts[pts.length-1], o=this.owner;
        const r=this.visionLeft()?62:44;
        const mate=this.attackers.filter(a=>a!==o).map(a=>({a,d:dist(a,e)})).sort((x,y)=>x.d-y.d)[0];
        if(mate&&mate.d<r) return {kind:'pas',target:mate.a};
        if(e.y<=G.y+8 || (e.y<BOX.y2&&e.x>BOX.x1&&e.x<BOX.x2&&e.y<o.y-20)) return {kind:'sut'};
        return {kind:'kosu'};
      }
      visionLeft(){ return E.ctx.charges.vision>0&&!this.visionUsed; }

      renderLine(){
        const pts=this.drawPts, g=this.lineG; g.clear();
        const I=this.classify(pts)||{kind:'kosu'}, col=INTENT[I.kind].c;
        let pathPts=pts;
        if(I.kind==='kosu') pathPts=this.trimRun(pts);
        [[14,.12],[7,.3],[3,1]].forEach(([w,a])=>{
          g.lineStyle(w,col,a); g.beginPath(); g.moveTo(pathPts[0].x,pathPts[0].y);
          pathPts.forEach(p=>g.lineTo(p.x,p.y)); g.strokePath();
        });
        const e=pathPts[pathPts.length-1];
        g.fillStyle(col,1).fillCircle(e.x,e.y,6);
        if(I.kind==='pas'){ g.lineStyle(3,col,.9).strokeCircle(I.target.x,I.target.y,24); }
        if(I.kind==='sut'){ g.lineStyle(3,col,.7).strokeRect(G.x1,G.y-G.depth,G.x2-G.x1,G.depth); }
        // güç göstergesi (şut/pas): çizgi ucunda mini halka
        if(I.kind!=='kosu'){
          const pw=Phaser.Math.Clamp((this.pathLen(pts)-30)/260,.15,1);
          g.lineStyle(3,pw>.9?0xff7a3d:0xffffff,.9); g.beginPath(); g.arc(e.x,e.y,13,-Math.PI/2,-Math.PI/2+Math.PI*2*pw,false); g.strokePath();
        }
        const b=this.bulge(pts);
        const extra=I.kind==='sut'&&Math.abs(b.ratio)>.25&&E.ctx.charges.falso>0?' • FALSO':I.kind==='sut'&&this.pathLen(pts)>300&&E.ctx.charges.roket>0?' • ROKET':I.kind==='pas'&&this.visionLeft()?' • VISION':'';
        this.intentTxt.setText(INTENT[I.kind].t+extra).setPosition(Phaser.Math.Clamp(e.x,50,W-50),Math.max(G.y+20,e.y-26)).setColor(Phaser.Display.Color.IntegerToColor?Phaser.Display.Color.IntegerToColor(col).rgba:'#ffffff').setVisible(true);
      }
      trimRun(pts){ // koşu rotası en fazla RUN_MAX px
        const out=[pts[0]]; let L=0;
        for(let i=1;i<pts.length;i++){
          const a=pts[i-1], b=pts[i], s=Math.hypot(b.x-a.x,b.y-a.y);
          if(L+s>RUN_MAX){ const t=(RUN_MAX-L)/s; out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}); return out; }
          L+=s; out.push(b);
        }
        return out;
      }
      drawDots(){
        const g=this.dotG; g.clear();
        for(let i=0;i<MAX_ACT;i++){ g.fillStyle(i<MAX_ACT-this.actions?0x22f5c9:0xffffff,i<MAX_ACT-this.actions?.85:.15).fillCircle(W-18-i*14,G.y+18,4); }
      }

      /* ----- koşu (dripling) ----- */
      startRun(pts){
        this.route=this.trimRun(pts).slice(1); this.routeI=0;
        this.state='run'; this.runStart=this.time.now; this.dangerFroze=false;
      }

      /* ----- vuruş: pas veya şut ----- */
      kick(I,pts){
        const o=this.owner, c=E.ctx, m=c.mods, A=o.attr, st=GameState.s;
        const b=this.bulge(pts), L=this.pathLen(pts), power=Phaser.Math.Clamp((L-30)/260,.15,1);
        this.power=false; this.lift=0; this.overBar=false;
        let skill=null;
        if(I.kind==='sut'){
          if(Math.abs(b.ratio)>.25&&c.charges.falso>0) skill='falso';
          else if(L>300&&c.charges.roket>0) skill='roket';
        } else if(this.visionLeft()) skill='vision';
        if(skill){ c.charges[skill]--; if(skill==='vision'){ this.visionUsed=true; this.frozen=true; this.recvR=32; } }
        const fk=(.6+A.dribling/200)*m.curve*(skill==='falso'?2.2:1);
        const e=pts[pts.length-1];
        let ang, speed, spin;
        if(I.kind==='sut'){
          const tx=e.y<=G.y+8?e.x:o.x+(e.x-o.x)*((o.y-(G.y-10))/Math.max(20,o.y-e.y));  // çizgiyi kale çizgisine uzat
          ang=Math.atan2((G.y-10)-o.y,tx-o.x)+b.ratio*.75*fk;
          spin=-b.ratio*3.2*fk;
          speed=(420+power*(700+A.sut*7-420))*m.shotSpeed*(skill==='roket'?1.45:1);
          let err=(1.05-A.sut/100)*.1*(.55+power*.75);
          if(o.isMe&&!m.noEnergyErr) err*=1+(100-st.energy)/160;
          if(o.isMe&&st.life) err*=1-U.clamp(st.life.calm,0,100)/500;   // Soğukkanlılık (Yaşam)
          err*=m.shotErr; if(Math.abs(b.ratio)>.12) err*=m.curveErr;
          ang+=gauss()*err;
          if(this.type==='frikik'){ spin+=-this.hit.x*2.1*(.8+A.dribling/250); ang+=this.hit.x*.16; this.lift=Math.max(0,this.hit.y); this.overBar=this.lift>.8&&power>.8&&Math.random()<.6; }
          if(!skill&&L>=150&&(this.time.now-(this.drawT0||0))<450){ this.power=true; speed*=1.15; }
        } else {
          const t=I.target, l=dist(o,t);
          ang=Math.atan2(t.y-o.y,t.x-o.x)+b.ratio*.6*fk;
          spin=-b.ratio*2.6*fk;
          speed=U.clamp(l*2.2,330,760)*(.85+power*.3);
          ang+=gauss()*(1.05-A.pas/100)*.08*m.passErr;
          this.passTo=t;
        }
        this.shot=skill;
        this.owner=null; this.lastKick=I.kind; this.lastKicker=o; this.kickTime=this.time.now; this.looseT=0;
        this.defs.forEach(d=>d.tried=false);
        this.spin=spin;
        this.ball.body.reset(o.x+Math.cos(ang)*16,o.y+Math.sin(ang)*16);
        this.ball.body.setVelocity(Math.cos(ang)*speed,Math.sin(ang)*speed);
        o.face=ang; this.tp=[];
        this.state='ball';
        if(I.kind==='sut'&&!street){
          this.kReact=this.time.now+Math.max(110,300-c.d*170)*(skill==='roket'?2:1);
          this.kTarget=this.predictX()+gauss()*(34*(1-c.d)+8);
        }
        if(this.power){ this.cameras.main.shake(140,.005); this.popText(o.x,o.y-30,'POWER SHOT!','#ff7a3d'); }
        if(skill){ this.cameras.main.flash(160,...(skill==='roket'?[255,122,61]:skill==='falso'?[169,147,255]:[24,182,255])); this.popText(o.x,o.y-30,{roket:'ROKET ŞUT!',falso:'FALSOLU ŞUT!',vision:'PASÖR VISION!'}[skill],'#'+TRAIL[skill].toString(16).padStart(6,'0')); }
        this.tweens.add({targets:o,scale:1.18,duration:90,yoyo:true});
      }
      predictX(){
        const b=this.ball.body, o={x:this.ball.x,y:this.ball.y,vx:b.velocity.x,vy:b.velocity.y,spin:this.spin};
        for(let i=0;i<180;i++){ sim(o,1/60); if(o.y<=E.KEEPER_Y) break; }
        return Phaser.Math.Clamp(o.x,G.x1-14,G.x2+14);
      }

      /* ----- yapay zeka (yalnızca zaman akarken) ----- */
      steer(p,tx,ty,sp,dt){
        const dx=tx-p.x, dy=ty-p.y, l=Math.hypot(dx,dy);
        const tvx=l>4?dx/l*sp:0, tvy=l>4?dy/l*sp:0, k=Math.min(1,dt*7), v=p.body.velocity;
        p.body.setVelocity(v.x+(tvx-v.x)*k,v.y+(tvy-v.y)*k);
        if(l>4) p.face=Math.atan2(dy,dx);
      }
      aiAttackers(dt){
        const ref=this.owner||this.ball;
        this.attackers.forEach(a=>{
          if(a===this.owner) return;
          let tx,ty,sp=a.spd*.85;
          if(this.owner){
            tx=(a.lane!==undefined?a.lane:(ref.x<W/2?W*.72:W*.28))+Math.sin(this.time.now/700+a.x)*30;
            ty=U.clamp(ref.y-rnd(120,160),G.y+110,H-160);
            const nd=this.defs.reduce((b,d)=>dist(d,a)<dist(b,a)?d:b,this.defs[0]);
            if(nd&&dist(nd,a)<60){ tx+=(a.x-nd.x)*.8; ty+=(a.y-nd.y)*.4; }
          } else if(a===this.passTo&&this.lastKick==='pas'){ tx=this.ball.x; ty=this.ball.y; sp*=.7; }
          else if(this.lastKick==='pas'||this.looseT>.4){ tx=this.ball.x; ty=this.ball.y; }
          else { tx=a.x; ty=a.y-10; sp*=.3; }
          this.steer(a,tx,ty,sp,dt);
        });
      }
      aiDefenders(dt,time){
        const d=E.ctx.d, ref=this.owner||this.ball;
        if(!this.assignT||time>this.assignT){
          this.assignT=time+250;
          const sorted=[...this.defs].sort((a,b)=>dist(a,ref)-dist(b,ref));
          const mates=this.attackers.filter(a=>a!==this.owner);
          sorted.forEach((df,i)=>{ df.role=i===0?'press':(mates[i-1]?'mark':'cover'); df.mark=mates[i-1]||null; });
          if(sorted[1]&&d>.55) sorted[1].role='press2';
        }
        for(const df of this.defs){
          if(df.wall){ df.body.setVelocity(0,0); continue; }
          let tx,ty,sp=df.spd;
          if(df.role==='press'||df.role==='press2'){
            const lv=this.owner?this.owner.body.velocity:this.ball.body.velocity;
            tx=ref.x+lv.x*.25*df.react; ty=ref.y+lv.y*.25*df.react;
            if(df.role==='press2'){ tx=Phaser.Math.Linear(ref.x,W/2,.3); ty=ref.y-36; }
          } else if(df.role==='mark'&&df.mark){
            tx=Phaser.Math.Linear(df.mark.x,ref.x,.35); ty=Math.min(df.mark.y,ref.y)-14;
          } else { tx=Phaser.Math.Linear(ref.x,W/2,.5); ty=Phaser.Math.Linear(ref.y,G.y+40,.45); }
          if(time<df.stun) sp*=.3;
          if(this.frozen) sp*=.3;
          this.steer(df,tx,ty,sp,dt);
          if(this.owner&&dist(df,this.owner)<31&&time>df.cd&&time>df.stun){
            df.cd=time+750;
            const p=U.clamp(.3+d*.3-this.owner.attr.dribling/330,.08,.7);
            if(Math.random()<p){ this.owner=null; this.ball.body.setVelocity((df.x-this.ball.x)*3,(df.y-this.ball.y)*3); return this.end('KAPTIRDI'); }
            df.stun=time+700; this.popText(this.owner.x,this.owner.y-26,'ÇALIM!','#22f5c9');
          }
        }
      }
      aiKeeper(dt,time){
        if(street) return;
        const k=this.keeper, d=E.ctx.d, roket=this.shot==='roket';
        const flying=!this.owner&&this.lastKick==='sut'&&time-this.kickTime<2500;
        if(flying&&this.kTarget!=null){
          if(time>=this.kReact){ const sp=(210+d*230)*(roket?.75:1)*dt, dx=this.kTarget-k.x; k.x+=Phaser.Math.Clamp(dx,-sp,sp); k.scaleX=Math.abs(dx)>6?1.35:1; }
        } else {
          const ref=this.owner||this.ball;
          const tx=U.clamp(W/2+(ref.x-W/2)*.35,G.x1+12,G.x2-12), ty=E.KEEPER_Y+(ref.y<260?16:0);
          k.x+=(tx-k.x)*Math.min(1,dt*4); k.y+=(ty-k.y)*Math.min(1,dt*3); k.scaleX=1;
          if(this.owner&&dist(this.owner,k)<30&&time>(this.kCd||0)){
            this.kCd=time+500; if(Math.random()<.45+d*.2){ this.owner=null; return this.end('KURTARDI'); }
          }
        }
      }

      /* ----- serbest top & sonuçlar ----- */
      ballFree(dt,time){
        const b=this.ball.body, d=E.ctx.d;
        const a=this.spin*dt, cs=Math.cos(a), sn=Math.sin(a), fr=Math.pow(BALL_FR,dt);
        const vx=b.velocity.x*cs-b.velocity.y*sn, vy=b.velocity.x*sn+b.velocity.y*cs;
        b.setVelocity(vx*fr,vy*fr); this.spin*=Math.pow(.55,dt);
        const sp=Math.hypot(vx,vy), bx=this.ball.x, by=this.ball.y, py=this.prevBY!==undefined?this.prevBY:by;
        if(this.shot!=='falso'){
          for(const df of this.defs){
            if(df.tried||dist(df,this.ball)>22) continue;
            df.tried=true;
            if(df.wall&&this.lift>.35) continue;
            const pasA=this.lastKicker?this.lastKicker.attr.pas:60;
            const p=sp<160?.9:this.lastKick==='pas'?U.clamp(.6-pasA/250,.18,.5)*(this.frozen?.4:1):.5;
            if(Math.random()<p){
              const nx=bx-df.x, ny=by-df.y, l=Math.hypot(nx,ny)||1; b.setVelocity(nx/l*sp*.3,ny/l*sp*.3); this.spin=0;
              return this.end(this.lastKick==='pas'?'KESILDI':this.lastKick==='sut'?'BLOK':'KAPTIRDI');
            }
          }
        }
        for(const a of this.attackers){
          if(a===this.lastKicker&&time-this.kickTime<380) continue;
          if(dist(a,this.ball)<this.recvR&&sp<780){ this.frozen=false; this.recvR=20; this.lastKick=null; this.shot=null; this.fx.clear(); this.give(a); return; }
        }
        if(!street&&py>E.KEEPER_Y&&by<=E.KEEPER_Y){
          const k=this.keeper, off=Math.abs(bx-k.x), roket=this.shot==='roket', reach=(26+d*6)*(roket?.7:1);
          const beaten=(sp>980&&off>reach*.6)||(roket&&sp>850&&off>reach*.3);
          if(off<reach+8&&!beaten){ const nx=bx-k.x, l=Math.hypot(nx,12)||1; b.setVelocity(nx/l*sp*.3,12/l*sp*.3); this.spin=0;
            return this.end(this.lastKicker&&!this.lastKicker.isMe?'TM_KACIRDI':'KURTARDI'); }
        }
        if(py>G.y&&by<=G.y){
          if(this.overBar) return this.end('DISARI');
          if(bx>G.x1+7&&bx<G.x2-7){ this.goalBall=true; return this.end(this.lastKicker&&this.lastKicker.isMe?'GOL':'ASIST'); }
          if(Math.abs(bx-G.x1)<=10||Math.abs(bx-G.x2)<=10){ b.setVelocity(vx*.5,-vy*.5); this.spin=0; return this.end('DIREK'); }
          return this.end(this.lastKicker&&!this.lastKicker.isMe&&this.lastKick==='sut'?'TM_KACIRDI':'DISARI');
        }
        if(bx<-12||bx>W+12||by>H+12||by<0) return this.end('DISARI');
        if(sp<160){ for(const df of this.defs){ if(dist(df,this.ball)<20) return this.end(this.lastKick==='pas'?'KESILDI':'KAPTIRDI'); } }
        if(sp<30){
          if(this.lastKick==='sut') return this.end('KACTI');
          this.looseT+=dt; if(this.looseT>3) return this.end('KACTI');
        }
      }

      popText(x,y,t,c){
        const tx=this.add.text(x,y,t,{fontFamily:'Rajdhani, sans-serif',fontSize:'20px',fontStyle:'bold',color:c}).setOrigin(.5).setDepth(31).setStroke('#000000',4);
        this.tweens.add({targets:tx,y:y-30,alpha:0,duration:800,onComplete:()=>tx.destroy()});
      }
      showOpp(scored,cb){
        if(this.banner){ this.banner.destroy(); this.banner=null; }
        const R=E.RES[scored?'RAKIP_GOL':'RAKIP_KACIRDI'];
        if(scored) this.cameras.main.shake(160,.006);
        const t=this.add.text(W/2,H*.42,scored?'RAKİP GOL!':'SAVUNMA TAMAM!',{fontFamily:'Rajdhani, sans-serif',fontSize:'58px',fontStyle:'bold',color:R.renk})
          .setOrigin(.5).setDepth(40).setStroke('#05070d',8).setShadow(0,0,R.renk,18,true,true).setScale(.3).setAlpha(0);
        this.banner=t;
        this.tweens.add({targets:t,scale:1,alpha:1,duration:300,ease:'Back.out'});
        this.time.delayedCall(1300,cb);
      }
      end(code){
        if(this.state==='done'||this.state==='over'||this.state==='init'||this.state==='rewind') return;
        const miss=['KURTARDI','DISARI','DIREK','BLOK','KESILDI','KAPTIRDI','TM_KACIRDI','KACTI'].includes(code);
        if(miss&&E.ctx.rewinds>0&&this.snap) return this.offerRewind(code);
        this.finalize(code);
      }
      finalize(code){
        if(this.state==='done'||this.state==='over'||this.state==='init') return;
        this.state='done'; this.hitG.clear(); this.hitTxt.setVisible(false); this.lineG.clear(); this.freezeG.clear(); this.intentTxt.setVisible(false); this.keeper.scaleX=1; this.frozen=false; this.drawPts=null;
        E.record(code);
        const R=E.RES[code], big=R.tip==='gol'||R.tip==='asist';
        const last=E.ctx.res[E.ctx.res.length-1];
        if(last){ if(this.power&&big) last.power=true; if(this.isKey) last.key=true; if(this.type==='frikik') last.fk=true; }
        if(big){ this.cameras.main.shake(320,.014); this.cameras.main.flash(220,255,215,0); this.spawnConfetti(); }
        this.banner=this.add.text(W/2,H*.42,R.t,{fontFamily:'Rajdhani, sans-serif',fontSize:big?'84px':'48px',fontStyle:'bold',color:R.renk,align:'center'})
          .setOrigin(.5).setDepth(40).setStroke('#05070d',8).setShadow(0,0,R.renk,20,true,true).setScale(.3).setAlpha(0);
        this.tweens.add({targets:this.banner,scale:1,alpha:1,duration:320,ease:'Back.out'});
        this.time.delayedCall(1500,()=>{ if(this.state==='done'){ this.fx.clear(); E.next(this); } });
      }

      /* ----- ana döngü ----- */
      update(time,delta){
        if(!this.me||this.state==='init'||this.state==='over') return;
        const dt=Math.min(delta,34)/1000, b=this.ball.body;
        if(this.state==='aim'||this.state==='drawing'||this.state==='rewind'){
          // ZAMAN DURDU: kimse hareket etmez, sadece hafif nefes alan halka
          [...this.attackers,...this.defs].forEach(p=>p.body.setVelocity(0,0)); b.setVelocity(0,0);
          this.syncAll(dt,time); return;
        }
        if(this.state==='run'||this.state==='ball'){
          if(this.state==='run'){
            const o=this.owner, tgt=this.route[this.routeI];
            if(!tgt){ this.syncAll(dt,time); return this.freeze(); }
            const sp=o.spd*.92;
            this.steer(o,tgt.x,tgt.y,sp,dt*1.6);
            if(dist(o,tgt)<10) this.routeI++;
            // tehlike: rakip çok yaklaştıysa zaman yeniden durur (bir kez)
            if(!this.dangerFroze&&time-this.runStart>350&&this.defs.some(df=>dist(df,o)<46)){ this.dangerFroze=true; this.syncAll(dt,time); return this.freeze(); }
          }
          this.aiAttackers(dt);
          this.aiDefenders(dt,time);
          if(this.state!=='run'&&this.state!=='ball') return this.syncAll(dt,time);
          this.aiKeeper(dt,time);
          if(this.state!=='run'&&this.state!=='ball') return this.syncAll(dt,time);
          if(this.owner){
            const o=this.owner;
            this.ball.body.reset(o.x+Math.cos(o.face)*17,o.y+Math.sin(o.face)*17);
            this.ball.rotation+=Math.hypot(o.body.velocity.x,o.body.velocity.y)*dt/9;
          } else this.ballFree(dt,time);
        } else if(this.state==='done'){
          [...this.attackers,...this.defs].forEach(p=>{ const v=p.body.velocity; p.body.setVelocity(v.x*.9,v.y*.9); });
          const fr=Math.pow(this.goalBall?.02:.4,dt); b.setVelocity(b.velocity.x*fr,b.velocity.y*fr);
          if(this.goalBall&&this.ball.y<G.y-G.depth+10) b.reset(this.ball.x,G.y-G.depth+10);
        }
        this.syncAll(dt,time);
      }
      syncAll(dt,time){
        this.prevBY=this.ball.y;
        [...this.attackers,...this.defs].forEach(p=>{ p.lbl.setPosition(p.x,p.y); p.sh.setPosition(p.x+2,p.y+6); });
        this.shadow.setPosition(this.ball.x+3,this.ball.y+5);
        const bv=this.ball.body.velocity, bs=Math.hypot(bv.x,bv.y);
        if(!this.owner) this.ball.rotation+=bs*dt/9;
        if(!this.owner&&bs>120){
          this.tp.push({x:this.ball.x,y:this.ball.y}); if(this.tp.length>16) this.tp.shift();
          const col=this.shot?TRAIL[this.shot]:0xffffff, n=this.tp.length; this.fx.clear();
          if(this.power) this.tp.forEach((p,i)=>{ const k=i/n, j=(1-k)*7;
              this.fx.fillStyle(0xff3d00,k*.45).fillCircle(p.x+rnd(-j,j),p.y+rnd(-j,j),15*k+3);
              this.fx.fillStyle(0xffb300,k*.7).fillCircle(p.x+rnd(-j/2,j/2),p.y+rnd(-j/2,j/2),9*k+2);
              this.fx.fillStyle(0xfff7c2,k*.9).fillCircle(p.x,p.y,4*k+1); });
          else this.tp.forEach((p,i)=>{ this.fx.fillStyle(col,(i/n)*(this.shot?.6:.2)); this.fx.fillCircle(p.x,p.y,(this.shot?8:5)*(i/n)+1); });
        } else if(this.tp.length){ this.tp=[]; this.fx.clear(); }
        // top sahibinin etrafında ince halka (zaman durunca nabız atar) + koşu rotası izi
        const g=this.ringG; g.clear();
        if(this.owner&&this.state!=='done'){
          const o=this.owner, pulse=(this.state==='aim')?3*Math.sin(time/180):0;
          g.lineStyle(2,0x22f5c9,.9).strokeCircle(o.x,o.y,20+pulse);
        }
        if(this.state==='run'&&this.route){
          g.lineStyle(2,0x22f5c9,.35); g.beginPath(); g.moveTo(this.owner.x,this.owner.y);
          for(let i=this.routeI;i<this.route.length;i++) g.lineTo(this.route[i].x,this.route[i].y); g.strokePath();
        }
        this.updateConf(dt);
        if(this.state==='aim'&&this.frozen===false&&this.visionLeft()){
          this.attackers.forEach(a=>{ if(a!==this.owner) g.lineStyle(1,0x18b6ff,.35).strokeCircle(a.x,a.y,62); });
        }
      }
    };
  }
};

</script>
<script>
/* =========================================================
   UI – tüm ekranlar (Kariyer, Sosyal, Sokak, Lig, Ofis)
========================================================= */
const UI = {
  app:document.getElementById('app'),
  draft:null, tab:'hub', feedFilter:'all',
  TABS:[['hub','Kariyer','layout-dashboard'],['sosyal','Sosyal','at-sign'],['sokak','Sokak','flame'],['lig','Lig','trophy'],['ofis','Ofis','briefcase'],['yasam','Yaşam','sun']],
  METERS:[['energy','Enerji','battery-charging','#22f5c9'],['morale','Moral','smile','#ffc53d'],['coachTrust','Hoca Güveni','user-check','#a993ff'],
          ['teamRel','Takım İçi','users','#4ade80'],['fanLove','Taraftar Sevgisi','heart','#ff3d81'],['media','Medya İmajı','tv','#18b6ff']],
  FLAG_CHIPS:{hain:['HAİN DAMGASI','#ff3d81'],transferIstedi:['Transfer talebinde','#ffc53d'],sadik:['Sadık oyuncu','#4ade80'],milli:['Milli oyuncu','#ef4444'],
              menajer:['Menajerli','#ffc53d'],bencil:['Bencil imajı','#f97316'],restCekti:['Rest çekti','#ff3d81'],hocaKavga:['Hocayla küs','#ff3d81'],viral:['Viral yıldız','#a993ff']},
  esc:U.esc, eur:U.eur,
  icons(){ if(window.lucide) lucide.createIcons({attrs:{'stroke-width':2}}); },
  barColor(v){ return v>=75?'linear-gradient(90deg,#22f5c9,#18b6ff)':v>=50?'linear-gradient(90deg,#7c5cff,#18b6ff)':v>=30?'linear-gradient(90deg,#ffc53d,#ff8a3d)':'linear-gradient(90deg,#ff3d81,#ff6b6b)'; },
  toast(msg,tip='info'){
    const c={info:'#22f5c9',warn:'#ffc53d',bad:'#ff3d81'}[tip];
    const el=document.createElement('div');
    el.className='glass-strong rounded-2xl px-4 py-3 text-sm fade-in flex items-center gap-2';
    el.style.borderColor=c;
    el.innerHTML=`<span class="w-2 h-2 rounded-full shrink-0" style="background:${c}"></span><span>${msg}</span>`;
    document.getElementById('toast').appendChild(el);
    setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},2800);
  },
  modal(html,wide){
    const m=document.getElementById('modal'), b=document.getElementById('modalBox');
    b.className=`glass-strong w-full ${wide?'md:max-w-2xl':'md:max-w-lg'} rounded-t-3xl md:rounded-3xl p-6 fade-in safe-bottom max-h-[92vh] overflow-auto`;
    b.innerHTML=html; m.classList.remove('hidden'); m.classList.add('flex'); this.icons();
  },
  closeModal(){ const m=document.getElementById('modal'); m.classList.add('hidden'); m.classList.remove('flex'); },
  crest(name,size=40){ const c=U.club(name); return `<div class="crest rounded-xl shrink-0" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.32)}px;background:linear-gradient(135deg,${c.renk},${c.renk}66)">${c.kisa}</div>`; },
  fxChips(fx={}){
    const L={morale:['Moral','smile'],coachTrust:['Hoca','user-check'],teamRel:['Takım','users'],fanLove:['Taraftar','heart'],media:['Medya','tv'],energy:['Enerji','battery'],form:['Form','trending-up'],money:['Para','wallet'],streetPoints:['Sokak','flame']};
    let out='';
    for(const k in L) if(fx[k]){ const up=fx[k]>0;
      out+=`<span class="inline-flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-full" style="background:${up?'rgba(34,245,201,.12)':'rgba(255,61,129,.12)'};color:${up?'#22f5c9':'#ff3d81'}"><i data-lucide="${L[k][1]}" class="w-3 h-3"></i>${L[k][0]} ${up?'▲':'▼'}</span>`; }
    if(fx.attrs) out+=`<span class="text-[10px] px-2 py-0.5 rounded-full bg-[rgba(34,245,201,.12)] text-[#22f5c9]">Yetenek ▲</span>`;
    return out;
  },
  async after(msg,tip){ await GameState.persist(); this.render(); if(msg) this.toast(msg,tip); },
  go(tab){ this.tab=tab; if(tab==='sosyal') GameState.s.social.unread=0; this.render(); window.scrollTo({top:0,behavior:'smooth'}); },
  affordable(){ const s=GameState.s; return Object.keys(SkillTree.NODES).filter(k=>SkillTree.state(k)==='available'&&s.street.points>=SkillTree.NODES[k].cost).length; },

  /* ================= OYUNCU OLUŞTURMA ================= */
  renderCreate(){
    if(!this.draft) this.draft={ad:'',yas:17,mevki:'FV',bonus:{hiz:0,sut:0,pas:0,dribling:0,fizik:0,defans:0}};

    const used=Object.values(d.bonus).reduce((a,b)=>a+b,0), left=CONFIG.START_POINTS-used;
    const attrs={}; for(const k in pos.base) attrs[k]=pos.base[k]+d.bonus[k];
    const ovr=GameState.ovr({mevki:d.mevki,attrs});
    this.app.innerHTML=`
    <header class="flex items-center gap-3 mb-6 fade-in">
      <div class="w-11 h-11 rounded-xl grid place-items-center neon-border"><i data-lucide="sparkles" class="w-5 h-5 text-[#22f5c9]"></i></div>
      <div><p class="text-[11px] uppercase tracking-[.25em] text-white/40">Kariyer Yolu</p>
      <h1 class="font-display text-3xl font-bold">Efsaneni <span class="grad-text">Yarat</span></h1></div>
    </header>
    <div class="grid lg:grid-cols-[1fr_340px] gap-5">
      <div class="space-y-5">
        <section class="glass p-5 fade-in">
          <label class="text-xs uppercase tracking-widest text-white/50">Oyuncu Adı</label>
          <div class="mt-2 flex items-center gap-3 rounded-xl bg-black/30 border border-white/10 px-4 focus-within:border-[#22f5c9]">

            <input id="inpAd" maxlength="22" value="${this.esc(d.ad)}" placeholder="Örn. Arda Yıldırım" class="bg-transparent flex-1 py-3 text-lg font-semibold placeholder:text-white/25">
          </div>
          <div class="mt-4 flex items-center justify-between">
            <span class="text-xs uppercase tracking-widest text-white/50">Yaş</span>
            <div class="flex items-center gap-2">${[16,17,18,19].map(y=>`<button data-yas="${y}" class="btn px-3 py-1.5 rounded-lg text-sm ${d.yas===y?'btn-primary':'btn-ghost'}">${y}</button>`).join('')}</div>
          </div>
        </section>
        <section class="glass p-5 fade-in">

            ${Object.entries(CONFIG.POSITIONS).map(([k,p])=>`
              <button data-pos="${k}" aria-pressed="${d.mevki===k}" class="pos-card btn glass p-4 text-left border border-white/10">

                <p class="font-display text-xl font-bold leading-none">${p.kisa}</p><p class="text-xs text-white/50 mt-1">${p.ad}</p>
              </button>`).join('')}
          </div>
        </section>
        <section class="glass p-5 fade-in">
          <div class="flex items-center justify-between mb-4">
            <p class="text-xs uppercase tracking-widest text-white/50">Başlangıç Yetenekleri</p>
            <span class="text-sm">Kalan Puan: <b class="font-display text-xl ${left?'neon-text':'text-white/40'}">${left}</b></span>
          </div>
          <div class="space-y-3">
            ${Object.entries(CONFIG.ATTRS).map(([k,a])=>{ const v=attrs[k]; return `
              <div class="flex items-center gap-3">
                <i data-lucide="${a.ikon}" class="w-4 h-4 text-white/50 shrink-0"></i><span class="w-20 text-sm">${a.ad}</span>
                <div class="bar flex-1"><i style="width:${v}%;background:${this.barColor(v)}"></i></div>
                <span class="w-8 text-right font-display text-lg font-bold">${v}</span>
                <div class="flex gap-1.5">
                  <button data-dec="${k}" class="btn btn-ghost w-9 h-9 rounded-lg grid place-items-center ${d.bonus[k]?'':'opacity-30'}"><i data-lucide="minus" class="w-4 h-4"></i></button>
                  <button data-inc="${k}" class="btn btn-ghost w-9 h-9 rounded-lg grid place-items-center ${left&&v<CONFIG.ATTR_CAP_START?'':'opacity-30'}"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
              </div>`; }).join('')}
          </div>
          <p class="text-[11px] text-white/35 mt-3">Başlangıçta hiçbir yetenek ${CONFIG.ATTR_CAP_START}'i geçemez. Mevki ağırlıkları genel puanı belirler.</p>
        </section>
      </div>
      <aside class="lg:sticky lg:top-5 h-fit">
        <div class="glass p-6 fade-in relative overflow-hidden">
          <div class="absolute -top-16 -right-16 w-48 h-48 rounded-full blur-3xl opacity-40" style="background:${pos.renk}"></div>
          <p class="text-[11px] uppercase tracking-[.25em] text-white/40">Oyuncu Kartı</p>
          <div class="flex items-center gap-4 mt-4">
            <div class="ovr-ring w-24 h-24 rounded-full grid place-items-center" style="--p:${ovr}">
              <div class="w-[84px] h-[84px] rounded-full bg-[#0a0e18] grid place-items-center"><div class="text-center"><p class="font-display text-4xl font-bold leading-none neon-text">${ovr}</p><p class="text-[10px] text-white/40 tracking-widest">GENEL</p></div></div>
            </div>
            <div class="min-w-0"><p id="cardName" class="font-display text-2xl font-bold truncate">${this.esc(d.ad)||'İsimsiz Yetenek'}</p><p class="text-sm" style="color:${pos.renk}">${pos.ad} • ${d.yas} yaş</p></div>
          </div>
          <div class="grid grid-cols-3 gap-2 mt-5 text-center">
            ${Object.entries(CONFIG.ATTRS).map(([k,a])=>`<div class="rounded-xl bg-black/25 py-2"><p class="font-display text-lg font-bold">${attrs[k]}</p><p class="text-[10px] uppercase text-white/40">${a.ad.slice(0,3)}</p></div>`).join('')}
          </div>
          <button id="btnStart" ${(!d.ad.trim()||left)?'disabled':''} class="btn btn-primary w-full mt-6 py-3.5 rounded-xl font-display text-lg tracking-wide flex items-center justify-center gap-2">KARİYERE BAŞLA <i data-lucide="arrow-right" class="w-5 h-5"></i></button>
          <p id="startHint" class="text-[11px] text-white/35 text-center mt-2">${!d.ad.trim()?'Bir isim gir.':left?`${left} puan daha dağıt.`:'Hazırsın!'}</p>
        </div>
      </aside>
    </div>`;
    this.icons(); this.bindCreate(attrs);
  },
  bindCreate(attrs){
    const d=this.draft, inp=document.getElementById('inpAd');
    inp.addEventListener('input',e=>{
      d.ad=e.target.value;
      const left=CONFIG.START_POINTS-Object.values(d.bonus).reduce((a,c)=>a+c,0);
      document.getElementById('btnStart').disabled=!d.ad.trim()||left>0;
      document.getElementById('startHint').textContent=!d.ad.trim()?'Bir isim gir.':left?`${left} puan daha dağıt.`:'Hazırsın!';
      document.getElementById('cardName').textContent=d.ad||'İsimsiz Yetenek';
    });
    const rr=()=>this.renderCreate();
    this.app.querySelectorAll('[data-yas]').forEach(b=>b.onclick=()=>{d.yas=+b.dataset.yas;rr();});
    this.app.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{d.mevki=b.dataset.pos;d.bonus={hiz:0,sut:0,pas:0,dribling:0,fizik:0,defans:0};rr();});
    this.app.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{ const k=b.dataset.inc, used=Object.values(d.bonus).reduce((a,c)=>a+c,0); if(used<CONFIG.START_POINTS&&attrs[k]<CONFIG.ATTR_CAP_START){d.bonus[k]++;rr();} });
    this.app.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{ const k=b.dataset.dec; if(d.bonus[k]>0){d.bonus[k]--;rr();} });
    document.getElementById('btnStart').onclick=async()=>{
      const pos=CONFIG.POSITIONS[d.mevki], a={}; for(const k in pos.base) a[k]=pos.base[k]+d.bonus[k];
      GameState.create({ad:d.ad.trim(),mevki:d.mevki,yas:d.yas,attrs:a});
      this.draft=null; this.tab='hub';
      await this.after(`Hoş geldin ${this.esc(d.ad.trim())}! Kulübün: ${GameState.s.club}`);
    };
  },

  /* ================= KABUK (header + sekmeler) ================= */
  render(){
    const s=GameState.s; if(!s) return this.renderCreate(); GameState.ensure(s);
    const p=s.player, pos=CONFIG.POSITIONS[p.mevki], ovr=GameState.ovr(), mv=GameState.marketValue(), role=GameState.role();
    const roleClr={'İLK 11':'#22f5c9','ROTASYON':'#18b6ff','YEDEK':'#ffc53d','KADRO DIŞI':'#ff3d81'}[role];
    const badge={hub:s.story.pending?'!':'',sosyal:s.social.unread?Math.min(99,s.social.unread):'',ofis:Transfer.pending().length||'',sokak:this.affordable()||'',lig:'',yasam:(GameState.ensure(s),s.energy<25&&Object.values(s.inv).some(v=>v>0))?'!':''};
    const apDots=Array.from({length:CONFIG.AP},(_,i)=>`<span class="w-2 h-2 rounded-full ${i<s.ap?'bg-[#22f5c9] shadow-[0_0_8px_#22f5c9]':'bg-white/15'}"></span>`).join('');
    this.app.innerHTML=`
    <header class="glass p-4 md:p-5 fade-in relative overflow-hidden">
      <div class="absolute -left-10 -top-10 w-44 h-44 rounded-full blur-3xl opacity-30" style="background:${pos.renk}"></div>
      <div class="absolute right-0 top-0 w-64 h-64 rounded-full blur-3xl opacity-20" style="background:${U.club(s.club).renk}"></div>
      <div class="relative flex items-center gap-3 md:gap-4">
        <div class="ovr-ring w-16 h-16 md:w-20 md:h-20 rounded-full grid place-items-center shrink-0" style="--p:${ovr}">
          <div class="w-[54px] h-[54px] md:w-[68px] md:h-[68px] rounded-full bg-[#0a0e18] grid place-items-center"><span class="font-display text-2xl md:text-3xl font-bold neon-text">${ovr}</span></div>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 min-w-0">
            <p class="font-display text-xl md:text-2xl font-bold truncate">${this.esc(p.ad)}</p>

    const ctx=GameState.ctx();
    return `

      <div class="relative">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl grid place-items-center shrink-0" style="background:${ev.renk}22;color:${ev.renk}"><i data-lucide="${ev.ikon}" class="w-6 h-6"></i></div>
          <div class="min-w-0">
            <p class="text-[10px] uppercase tracking-[.2em] flex items-center gap-1.5" style="color:${ev.renk}"><span class="w-1.5 h-1.5 rounded-full pulse-dot" style="background:${ev.renk}"></span>Hikaye • ${this.esc(U.fill(ev.kim,ctx))}</p>
            <p class="font-display text-2xl font-bold leading-tight">${ev.baslik}</p>

              ${ok?`<div class="flex flex-wrap gap-1.5 mt-2">${this.fxChips(c.fx)}${c.sonraki?'<span class="text-[10px] px-2 py-0.5 rounded-full bg-[rgba(169,147,255,.14)] text-[#a993ff]">Sonuçları olacak…</span>':''}</div>`:`<p class="text-[11px] text-white/40 mt-1">${c.sartText}</p>`}
            </button>`; }).join('')}

      </div>

  matchCard(){
    const s=GameState.s, f=Fixtures.next(s);
    if(s.seasonEnd) return `
      <section class="glass p-6 text-center fade-in glow-violet">
        <i data-lucide="trophy" class="w-10 h-10 mx-auto text-[#ffc53d]"></i>
        <p class="font-display text-3xl font-bold mt-2">Sezon ${s.season} Tamamlandı</p>
        <p class="text-sm text-white/55">${CONFIG.LEAGUES[s.league].ad}'i ${League.pos(s)}. sırada bitirdiniz.</p>
        <button id="btnSeason" class="btn btn-primary mt-5 px-6 py-3 rounded-xl font-display text-lg">SEZON ÖZETİ</button>
      </section>`;
    if(!f) return '';
    const comp=CONFIG.COMPS[f.comp], cname=Fixtures.compName(f), role=GameState.role(), blk=Career.blocked();
    const head=`
      <div class="flex items-center justify-between gap-2">
        <span class="flex items-center gap-2 text-xs uppercase tracking-widest truncate" style="color:${comp.renk}"><i data-lucide="${comp.ikon}" class="w-4 h-4 shrink-0"></i>${cname}${f.tur?' • '+f.tur:f.round!==undefined?' • '+(f.round+1)+'. Hafta':''}</span>
        <span class="flex items-center gap-1.5 text-xs text-white/50 shrink-0"><span class="w-1.5 h-1.5 rounded-full bg-[#ff3d81] pulse-dot"></span>Sonraki Maç</span>
      </div>
      <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 mt-5">
        <div class="text-center min-w-0"><div class="mx-auto w-fit">${this.crest(s.club,56)}</div><p class="font-display font-bold mt-2 truncate">${this.esc(s.club)}</p><p class="text-[11px] text-white/40">${f.evde?'Ev Sahibi':'Deplasman'}</p></div>
        <div class="font-display text-3xl font-bold text-white/25">VS</div>
        <div class="text-center min-w-0"><div class="mx-auto w-fit">${this.crest(f.rakip,56)}</div><p class="font-display font-bold mt-2 truncate">${this.esc(f.rakip)}</p><p class="text-[11px] text-white/40">Güç ${f.guc}</p></div>
      </div>`;
    if(s.status.kadroDisi>0) return `
      <section class="glass p-5 fade-in glow-hot relative overflow-hidden">
        <div class="absolute inset-0 opacity-10" style="background:repeating-linear-gradient(-45deg,#ff3d81 0 12px,transparent 12px 24px)"></div>
        <div class="relative">${head}
          <div class="mt-5 rounded-xl bg-[rgba(255,61,129,.12)] border border-[rgba(255,61,129,.4)] p-3 text-center">
            <p class="font-display text-xl font-bold text-[#ff3d81]">KADRO DIŞISIN</p><p class="text-xs text-white/60">Kalan ceza: ${s.status.kadroDisi} hafta • Takımın senin yokluğunda oynayacak.</p>
          </div>
          <button id="btnSkip" ${blk?'disabled':''} class="btn btn-danger w-full mt-4 py-3.5 rounded-xl font-display text-lg ${blk?'opacity-40':''}"><i data-lucide="eye" class="w-5 h-5 inline -mt-1"></i> HAFTAYI TRİBÜNDE İZLE</button>
          ${blk?`<p class="text-[11px] text-[#ffc53d] mt-2 text-center">${blk}</p>`:''}
        </div>
      </section>`;
    return `
      <section class="glass p-5 fade-in relative overflow-hidden">
        <div class="absolute inset-0 opacity-20" style="background:linear-gradient(120deg,${comp.renk}55,transparent 55%)"></div>
        <div class="relative">${head}
          <div class="flex flex-wrap justify-center gap-2 mt-4 text-[11px]">
            <span class="px-2.5 py-1 rounded-full bg-black/30">Rol: <b>${role}</b></span>
            <span class="px-2.5 py-1 rounded-full bg-black/30">${Career.positions()} pozisyon</span>
            <span class="px-2.5 py-1 rounded-full bg-black/30">-${CONFIG.ENERGY.MATCH} enerji</span>
          </div>
          <button id="btnMatch" class="btn btn-primary w-full mt-4 py-3.5 rounded-xl font-display text-lg tracking-wide flex items-center justify-center gap-2 ${blk?'opacity-40':''}"><i data-lucide="play" class="w-5 h-5"></i> MAÇA ÇIK</button>
          ${blk?`<p class="text-[11px] text-[#ffc53d] mt-2 text-center">${blk}</p>`:''}
        </div>
      </section>`;

  bind_hub(){
    const $=id=>document.getElementById(id);
    $('btnMatch')&&($('btnMatch').onclick=()=>this.onMatch());
    $('btnCinema')&&($('btnCinema').onclick=()=>CinemaEngine.story());
    this.bindQuick();
    this.app.querySelectorAll('[data-talk]').forEach(b=>b.onclick=()=>CinemaEngine.talk(b.dataset.talk));
    $('btnSkip')&&($('btnSkip').onclick=()=>this.onSkip());
    $('btnSeason')&&($('btnSeason').onclick=()=>this.openSeasonEnd());
    $('btnTrain')&&($('btnTrain').onclick=()=>this.openTraining());
    $('btnRest')&&($('btnRest').onclick=async()=>{ if(GameState.s.energy>=100) return this.toast('Enerjin zaten dolu!','warn'); const r=Training.rest(); if(!r.ok) return this.toast(r.msg,'bad'); await this.after('Dinlendin. Enerji yenilendi.'); });
    this.app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{
      const club=GameState.s.club, r=StoryEngine.resolve(+b.dataset.choice); if(!r) return;
      await this.after(GameState.s.club!==club?`TRANSFER TAMAMLANDI! Yeni kulübün: ${GameState.s.club}`:r.not, r.diff<0?'warn':'info');
    });
    $('btnReset').onclick=()=>{
      this.modal(`<p class="font-display text-2xl font-bold">Kariyeri sıfırla?</p><p class="text-sm text-white/60 mt-2">Tüm ilerleme silinecek. Bu işlem geri alınamaz.</p>
        <div class="flex gap-3 mt-6"><button id="mNo" class="btn btn-ghost flex-1 py-3 rounded-xl">Vazgeç</button><button id="mYes" class="btn btn-danger flex-1 py-3 rounded-xl">Sıfırla</button></div>`);
      $('mNo').onclick=()=>this.closeModal();
      $('mYes').onclick=async()=>{ await DB.reset(); GameState.s=null; this.closeModal(); this.tab='hub'; this.renderCreate(); };
    };
  },

  onMatch(){
    const s=GameState.s, blk=Career.blocked();
    if(blk) return this.toast(blk,'warn');
    if(s.energy<15) return this.toast('Enerjin çok düşük! Dinlen ya da Yaşam › Market\'ten enerji içeceği al.','bad');
    if(window.Phaser) return Career.startMatch();
    // Yedek: Phaser yüklenemezse hızlı simülasyon
    const f=Fixtures.next(s), n=Career.positions(), c={res:[],gol:0,asist:0,iyi:0,kotu:0};
    for(let i=0;i<n;i++){ const r=Math.random(), ch=s.player.attrs.sut/170, code=r<ch?(i%2?'ASIST':'GOL'):r<ch+.3?'KURTARDI':'DISARI';
      c.res.push({code,min:U.ri(10,89),type:'sut'}); const t=MatchEngine.RES[code].tip; if(t==='gol')c.gol++; else if(t==='asist')c.asist++; else if(t==='iyi')c.iyi++; else c.kotu++; }
    this.quickSummary(Career.finishMatch(f,c));
  },
  quickSummary(sum){
    GameState.persist();
    this.modal(`<p class="text-[11px] uppercase tracking-widest" style="color:${sum.color}">${U.esc(sum.title)} • Hızlı simülasyon</p>
      <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 mt-4 text-center"><p class="font-display font-bold truncate">${U.esc(sum.left)}</p>
      <p class="font-display text-5xl font-bold ${sum.win?'neon-text':sum.lose?'text-[#ff3d81]':''}">${sum.l}-${sum.r}</p><p class="font-display font-bold truncate">${U.esc(sum.right)}</p></div>
      <div class="grid grid-cols-4 gap-2 mt-4 text-center">${sum.stats.map(([l,v])=>`<div class="rounded-xl bg-black/30 py-2.5"><p class="font-display text-xl font-bold">${v}</p><p class="text-[10px] text-white/40 uppercase">${l}</p></div>`).join('')}</div>
      <p class="text-sm text-center mt-3 text-white/60">${sum.foot}</p>
      <button id="mOk" class="btn btn-primary w-full mt-5 py-3 rounded-xl font-display text-lg">DEVAM</button>`);
    document.getElementById('mOk').onclick=()=>{ this.closeModal(); this.render(); };
  },
  async onSkip(){
    const blk=Career.blocked(); if(blk) return this.toast(blk,'warn');
    const r=Career.skipWeek();
    await this.after(`Takımın sensiz oynadı: ${r.biz}-${r.onlar}. ${GameState.s.status.kadroDisi?'Ceza devam ediyor.':'Cezan bitti!'}`, 'warn');
  },
  openTraining(){
    const s=GameState.s;
    this.modal(`
      <div class="flex items-center justify-between"><p class="font-display text-2xl font-bold">Antrenman Planı</p>
        <button id="mX" class="btn btn-ghost w-9 h-9 rounded-lg grid place-items-center"><i data-lucide="x" class="w-4 h-4"></i></button></div>
      <p class="text-sm text-white/50 mt-1">Enerji: <b class="text-white">${s.energy}</b> • Aksiyon: <b class="text-white">${s.ap}</b> • Moral verimi: <b class="text-white">%${Math.round((.5+s.morale/200)*100)}</b></p>
      <div class="grid grid-cols-2 gap-3 mt-5">
        ${Object.entries(Training.plans).map(([k,p])=>`
          <button data-plan="${k}" class="btn btn-ghost rounded-2xl p-4 text-left ${s.energy<CONFIG.ENERGY.TRAIN?'opacity-40':''}">
            <i data-lucide="${p.ikon}" class="w-5 h-5 text-[#22f5c9]"></i><p class="font-display text-lg font-bold mt-2">${p.ad}</p>
            <p class="text-[11px] text-white/45">${p.attrs.map(a=>CONFIG.ATTRS[a].ad).join(' • ')}</p></button>`).join('')}

        ${SkillTree.BRANCHES.map(br=>`
          <div>
            <p class="text-xs uppercase tracking-widest font-bold mb-3" style="color:${br.renk}">${br.ad}</p>
            ${br.nodes.map((k,i)=>(i?`<div class="skill-link ${SkillTree.has(k)?'on':''}"></div>`:'')+nodeHtml(k)).join('')}

  bind_sokak(){
    const b=document.getElementById('btnStreet');
    b.onclick=()=>{
      const blk=Street.blocked(); if(blk) return this.toast(blk,'warn');
      if(window.Phaser) return Street.start();
      const opp=Street.opponent(), c={our:0,their:0,res:[],gol:0,asist:0};
      while(c.our<3&&c.their<3){ if(Math.random()<.5){c.our++;c.gol++;c.res.push({code:'GOL',min:'A',type:'sut'});} else {c.their++;c.res.push({code:'RAKIP_GOL',min:'A',type:'def'});} }
      this.quickSummary(Street.finish(opp,c));
    };
    this.app.querySelectorAll('[data-skill]').forEach(x=>x.onclick=()=>this.openSkill(x.dataset.skill));
  },
  openSkill(k){
    const n=SkillTree.NODES[k], st=SkillTree.state(k), pts=GameState.s.street.points;
    this.modal(`
      <div class="flex items-center gap-3"><div class="w-12 h-12 rounded-2xl grid place-items-center bg-[rgba(255,61,129,.18)] text-[#ff7aa8]"><i data-lucide="${n.ikon}" class="w-6 h-6"></i></div>

      ${n.req?`<p class="text-xs text-white/45 mt-2">Gereksinim: ${SkillTree.NODES[n.req].ad}</p>`:''}
      <p class="text-xs text-white/45 mt-1">Maliyet: <b class="text-[#ffc53d]">${n.cost} Sokak Puanı</b> • Sende: ${pts}</p>

    document.getElementById('mNo').onclick=()=>this.closeModal();

        </div>
        <div class="relative flex items-end justify-between mt-5">
          <div><p class="letter-serif italic text-white/75 text-lg">${this.esc(U.pick(['A. Moreau','K. Özdemir','L. Santos','M. Richter']))}</p><p class="text-[10px] text-white/40">Sportif Direktör • Geçerlilik: Hafta ${o.exp}</p></div>
          <div class="seal w-14 h-14 rounded-full grid place-items-center font-display font-bold text-white/90 text-sm rotate-[-12deg]">${c.kisa}</div>
        </div>
      </div>
      <div class="grid gap-2 mt-4">
        <button id="oA" class="btn btn-primary py-3 rounded-xl font-display text-lg">PAZARLIK MASASINA OTUR</button>
        <button id="oK" class="btn btn-ghost py-3 rounded-xl" ${o.free?'disabled style="opacity:.4"':''}>Kulübüme Koz Olarak Kullan</button>
        <button id="oR" class="btn py-3 rounded-xl text-[#ff3d81]">Reddet</button>
      </div>
      <p class="text-[10px] text-white/35 text-center mt-2">Kulübün teklifi reddedebilir. Transfer talebi, kısa sözleşme ve yüksek bonservis şansını artırır.</p>`);
    const $=x=>document.getElementById(x);
    $('oA').onclick=()=>{ this.closeModal(); this.tab='hub'; Negotiate.open(id); };   // sinematik pazarlık masası
    $('oK').onclick=async()=>{ const r=Transfer.leverage(id); this.closeModal(); await this.after(r.win?`Koz işe yaradı! Yeni maaşın ${this.eur(r.wage)}/hf.`:'Yönetim blöfünü gördü. Hoca Güveni düştü.', r.win?'info':'bad'); };
    $('oR').onclick=async()=>{ Transfer.reject(id); this.closeModal(); await this.after('Teklifi reddettin. Taraftar sadakatini alkışlıyor.'); };

  openRenew(){
    const s=GameState.s, p=Transfer.renewProposal();
    this.modal(`
      <div class="flex items-center gap-3">${this.crest(s.club,46)}<div><p class="text-[10px] uppercase tracking-widest text-white/45">Sözleşme Görüşmesi</p><p class="font-display text-2xl font-bold">${this.esc(s.club)} Yönetimi</p></div></div>
      <div class="grid grid-cols-2 gap-2 mt-5 text-center">
        <div class="rounded-xl bg-black/30 p-3"><p class="text-[10px] uppercase text-white/40">Mevcut</p><p class="font-display text-xl font-bold">${this.eur(s.contract.wage)}/hf</p><p class="text-[11px] text-white/45">${Math.max(0,s.contract.years)} yıl</p></div>

      </div>
      <p class="text-xs text-white/50 mt-3">Teklif; piyasa değerine ve Hoca Güveni'ne göre şekillenir. Masada başka kulüplerin teklifi varsa pazarlık gücün artar.</p>
      <div class="grid gap-2 mt-5">
        <button data-neg="imzala" class="btn btn-primary py-3 rounded-xl">İmzala</button>
        <button data-neg="fazla" class="btn btn-ghost py-3 rounded-xl">Daha fazlasını iste (+%30) <span class="text-[10px] text-white/40">riskli</span></button>
        <button data-neg="rest" class="btn py-3 rounded-xl text-[#ff3d81]">Transfer resti çek</button>
      </div>`);
    document.querySelectorAll('[data-neg]').forEach(b=>b.onclick=async()=>{
      const r=Transfer.negotiate(b.dataset.neg); StoryEngine.weekly(true); this.closeModal();
      if(b.dataset.neg==='rest') this.tab='hub';
      await this.after(r.msg, r.ok?'info':'bad');
    });
  }
};

(async function boot(){
  DB.init();
  document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') UI.closeModal(); });
  const saved=await DB.load();
  if(saved && saved.player){
    GameState.s = saved.v>=2 ? saved : GameState.migrate(saved);
    GameState.ensure(GameState.s);
    await GameState.persist();
    UI.render();
  } else UI.renderCreate();
})();
</script>
</body>
